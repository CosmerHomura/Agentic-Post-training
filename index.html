 {
  "id": "ch4",
  "num": "03",
  "title": "03 · 强化学习 GRPO",
  "heading": "03 · 强化学习（GRPO）",
  "subtitle": "只有一个分数怎么学",
  "sections": [
   {
    "id": "s1",
    "title": "1. 一句话定义",
    "short": "一句话定义",
    "html": "<p><strong>让模型对同一个问题写 8 个答案，打分，然后\"把比平均分高的那些答案变得更可能\"。</strong></p>\n<p>不需要教师，不需要标准轨迹 —— 只需要一个<strong>能判断对错的东西</strong>（奖励函数）。这就是从\"抄\"转向\"练\"的分水岭。</p>"
   },
   {
    "id": "s2",
    "title": "2. 原文译文 · 3. Reinforcement learning (RL)",
    "short": "原文译文 · 3. Reinforcement learning (RL)",
    "html": "<blockquote><p>在强化学习中，模型从<strong>对自己输出的一个分数</strong>里学习。它写一个答案，奖励函数给它打分，训练让高分答案变得更可能。这样就<strong>不再需要教师</strong>——只要能校验答案就够了。</p>\n<p>这一步用的算法是 <strong>GRPO（Group Relative Policy Optimization）</strong>。对每个 prompt，它采样若干个答案，给它们全部打分，然后提高那些<strong>得分高于组内平均</strong>的答案的概率。在组内比较答案，就告诉了模型哪些尝试更好，<strong>而不需要另外训练一个模型来估计这件事</strong>（这正是它相对 PPO 省掉 critic 的地方）。</p>\n<p>这个信号比蒸馏弱：<strong>整条答案只有一分数</strong>，而不是每个 token 一个值，所以模型需要很多次尝试才能学到东西。用普通奖励函数时，每个答案只有一轮、只打一次分。而<strong>环境</strong>让模型可以行动多次，并看到每个动作的结果。</p></blockquote>\n<h3 id=\"s2-h1\">原文推荐资源</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>Watch</td><td><a href=\"https://www.youtube.com/watch?v=ztdTed5egrM\" target=\"_blank\" rel=\"noopener\">Training Agents 3: reinforcement learning</a>（<a href=\"https://huggingface.co/collections/sergiopaniego/training-agents-class-3-reinforcement-learning-6ad6aa71050342629dd0e3ec\" target=\"_blank\" rel=\"noopener\">合集</a>）</td></tr><tr><td>Read</td><td><a href=\"https://huggingface.co/blog/sergiopaniego/agentic-rl-2026\" target=\"_blank\" rel=\"noopener\">How frontier models train on outcomes in 2026</a></td></tr><tr><td>Project</td><td><a href=\"https://huggingface.co/blog/grpo-with-trl-ifstruct\" target=\"_blank\" rel=\"noopener\">Fine-tuning a 350M model for structured outputs in 100 GRPO steps</a></td></tr><tr><td>Docs</td><td><a href=\"https://huggingface.co/docs/trl/grpo_trainer\" target=\"_blank\" rel=\"noopener\">GRPO Trainer</a></td></tr></tbody></table></div>"
   },
   {
    "id": "s3",
    "title": "3. GRPO 到底在算什么",
    "short": "GRPO 到底在算什么",
    "html": "<h3 id=\"s3-h1\">3.1 四个步骤（TRL 文档的原话顺序）</h3>\n<div class=\"codewrap\"><pre><code>① 生成       每个 prompt 采样 G 条 completion（G = num_generations，默认 8）\n② 算优势     用同一 prompt 的 G 个奖励做组内标准化\n③ 估 KL      与参考模型的 KL（beta&gt;0 时才需要参考模型）\n④ 算损失     对 completion 的每个 token 做 clipped 策略梯度</code></pre></div>\n<h3 id=\"s3-h2\">3.2 优势：为什么\"组内比较\"就够</h3>\n<div class=\"codewrap\"><pre><code>prompt: \"23 × 47 = ?\"\n   ├── 回答1  &lt;answer&gt;1081&lt;/answer&gt;   reward 1.0   ┐\n   ├── 回答2  &lt;answer&gt;1081&lt;/answer&gt;   reward 1.0   │ 组内均值 μ = 0.5\n   ├── 回答3  &lt;answer&gt;1000&lt;/answer&gt;   reward 0.0   │ 组内标准差 σ = 0.5\n   ├── 回答4  &lt;answer&gt;1081&lt;/answer&gt;   reward 1.0   ┘\n   ...\n                    r_i - μ\n        A_i = ───────────────────\n                     σ + ε\n\n   → 答对的 A ≈ +1，答错的 A ≈ -1\n   → 训练目标：让 A&gt;0 的整条序列概率上升，A&lt;0 的下降</code></pre></div>\n<p><strong>关键洞察</strong>：因为基线 μ 来自\"同一 prompt 的其他尝试\"，所以<strong>不需要 critic 网络</strong>去估计\"这个状态值多少\"。这就是 GRPO 比 PPO 省一半显存的原因。</p>\n<h3 id=\"s3-h3\">3.3 损失（每个 completion token 上）</h3>\n<div class=\"codewrap\"><pre><code>ratio_t = π_θ(y_t | y_&lt;t) / π_old(y_t | y_&lt;t)\n\nL = -E[ min( ratio_t · A,  clip(ratio_t, 1-ε, 1+ε) · A ) ]</code></pre></div>\n<p><code>clip</code> 是防止一步更新太猛把策略带崩。<code>loss_type=\"dapo\"</code>（默认）在此之上不按回答长度归一，避免长回答被系统性压低。</p>"
   },
   {
    "id": "s4",
    "title": "4. 训练信号从哪来",
    "short": "训练信号从哪来",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>环节</th><th>内容</th></tr></thead><tbody><tr><td><strong>输入</strong></td><td><code>prompt</code>（+ 数据集里的额外列，如 <code>ground_truth</code>）</td></tr><tr><td><strong>模型产出</strong></td><td>每个 prompt <strong>G 条</strong> completion</td></tr><tr><td><strong>监督信号</strong></td><td>每条 completion 一个标量 reward（可以是多个奖励相加）</td></tr><tr><td><strong>损失</strong></td><td>组内标准化优势 × clipped 策略梯度</td></tr><tr><td><strong>产物</strong></td><td>会\"拿高分\"的模型——前提是你的奖励函数真的量对了东西</td></tr></tbody></table></div>\n<div class=\"codewrap\"><pre><code>        prompt ──┬──▶ completion 1 ──▶ reward 1.0 ┐\n                 ├──▶ completion 2 ──▶ reward 0.0 │\n                 ├──▶ completion 3 ──▶ reward 1.0 │──▶ 组内标准化 ──▶ A_i ──▶ loss\n                 └──▶ ...             ──▶ reward 0.0 ┘</code></pre></div>"
   },
   {
    "id": "s5",
    "title": "5. 输入格式",
    "short": "输入格式",
    "html": "<h3 id=\"s5-h1\">5.1 数据集：prompt + 你想要的任何额外列</h3>\n<p><code>data/grpo_prompts.jsonl</code>：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-json\">{\"prompt\": [{\"role\": \"user\", \"content\": \"计算 23 × 47 的值。……写进 &lt;answer&gt;&lt;/answer&gt;。\"}],\n \"ground_truth\": \"1081\"}</code></pre></div>\n<div class=\"tablewrap\"><table><thead><tr><th>列</th><th>必需</th><th>说明</th></tr></thead><tbody><tr><td><code>prompt</code></td><td>✅</td><td>对话式 messages（或字符串，TRL 会套模板）</td></tr><tr><td><code>ground_truth</code></td><td>通常需要</td><td><strong>自定义列名</strong>，会作为 kwargs 传给奖励函数</td></tr><tr><td><code>tools</code></td><td>可选</td><td>工具 schema，多轮工具调用时需要</td></tr><tr><td><code>environment</code></td><td>可选</td><td>多环境时用：填环境名，路由到对应的 factory（见第 4 章）</td></tr><tr><td>其他任意列</td><td>可选</td><td>全部会以 kwargs 形式传给 <strong>每一个</strong> 奖励函数</td></tr></tbody></table></div>\n<blockquote><p>重要机制：<strong>除了 <code>prompt</code>，数据集的所有列都会作为关键词参数传给奖励函数。</strong> 所以你把答案列叫 <code>ground_truth</code>、<code>answer</code>、<code>label</code> 都行——只要奖励函数的形参同名即可。</p></blockquote>\n<h3 id=\"s5-h2\">5.2 奖励函数：唯一必须自己写的代码</h3>\n<p>契约（三条，缺一不可）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">def my_reward(completions, ground_truth, **kwargs) -&gt; list[float]:\n    #  ① 形参：想用的字段名 = 数据集列名\n    #  ② 返回：list[float]，长度 == 这一批 completion 的数量\n    #  ③ 可以 async def（多个异步奖励会被并发 gather）\n    return [1.0 for _ in completions]</code></pre></div>\n<p>可用的关键字参数（按需挑）：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>参数</th><th>内容</th></tr></thead><tbody><tr><td><code>prompts</code></td><td>这一批 prompt（标准格式是字符串，对话格式是 message dict）</td></tr><tr><td><code>completions</code></td><td>这一批模型输出（同上，对话格式是 <code>[{\"role\",\"content\"}]</code> 列表的列表）</td></tr><tr><td><code>completion_ids</code></td><td>token id 列表</td></tr><tr><td><code>trainer_state</code></td><td>当前训练状态（可用于课程学习）</td></tr><tr><td><code>log_extra(col, values)</code></td><td>把额外列写进日志</td></tr><tr><td><code>log_metric(name, value)</code></td><td>记录自定义指标</td></tr><tr><td><code>environments</code></td><td>有 <code>environment_factory</code> 时，每个 completion 一个环境实例</td></tr><tr><td>数据集其他列</td><td>自动作为 kwargs</td></tr></tbody></table></div>\n<h3 id=\"s5-h3\">5.3 三个真实可用的奖励函数</h3>\n<p>见 <a class=\"il\" href=\"#\"><code>code/rewards.py</code></a>：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">def format_reward(completions, **kwargs):\n    pattern = r\"^&lt;think&gt;.*?&lt;/think&gt;\\s*&lt;answer&gt;.*?&lt;/answer&gt;$\"\n    return [1.0 if re.match(pattern, c[0][\"content\"].strip(), re.DOTALL) else 0.0\n            for c in completions]\n\ndef accuracy_reward(completions, ground_truth, **kwargs):\n    ...  # 抽 &lt;answer&gt;，和 ground_truth 比数值\n\ndef length_penalty(completion_ids, **kwargs):\n    return [-0.001 * len(ids) for ids in completion_ids]</code></pre></div>\n<blockquote><p>用 token 级奖励也可以，一个最小例子（文档原文）： <code>def reward_func(completion_ids, **kwargs): return [float(len(ids)) for ids in completion_ids]</code> → <code>[2.0, 4.0]</code></p></blockquote>"
   },
   {
    "id": "s6",
    "title": "6. 输入输出：一次训练步的完整张量流",
    "short": "输入输出：一次训练步的完整张量流",
    "html": "<div class=\"codewrap\"><pre><code>┌─ 采样阶段（推理引擎，通常是 vLLM）─────────────────────────────┐\n│  input_ids:        [B, L_prompt]                              │\n│  generate(num_return_sequences=G, temperature=1.0)            │\n│  → completion_ids: [B*G, L_completion]                        │\n│  → completion_logprobs: [B*G, L_completion]   ← 旧策略的概率   │\n└───────────────────────────────────────────────────────────────┘\n                        │\n                        ▼\n┌─ 打分阶段（你的 Python 函数，不占 GPU）─────────────────────────┐\n│  rewards: [B*G]        ← 多个奖励求和 / 加权                    │\n│  A_i = (r_i - mean_group) / (std_group + ε)   → advantages: [B*G] │\n└───────────────────────────────────────────────────────────────┘\n                        │\n                        ▼\n┌─ 训练阶段（前向 + 反向）────────────────────────────────────────┐\n│  input_ids = cat(prompt, completion)   [B*G, L]                │\n│  labels    = -100 ... -100 ⧺ completion（或带 mask 的策略梯度）│\n│  forward → logits → log π_θ(y_t)                               │\n│  ratio = exp(logπ_θ - logπ_old)                                │\n│  loss  = -min(ratio·A, clip(ratio,1-ε,1+ε)·A).mean()           │\n└───────────────────────────────────────────────────────────────┘</code></pre></div>\n<h3 id=\"s6-h1\">一个数字例子（G=4）</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>回答</th><th>reward</th><th>是否 &gt; 均值(0.5)</th><th>advantage</th><th>训练效果</th></tr></thead><tbody><tr><td>\"…1081\"</td><td class=\"num\">1.0</td><td>是</td><td>+1.0</td><td>概率 ↑</td></tr><tr><td>\"…1081\"</td><td class=\"num\">1.0</td><td>是</td><td>+1.0</td><td>概率 ↑</td></tr><tr><td>\"…1000\"</td><td class=\"num\">0.0</td><td>否</td><td class=\"num\">-1.0</td><td>概率 ↓</td></tr><tr><td>\"…1000\"</td><td class=\"num\">0.0</td><td>否</td><td class=\"num\">-1.0</td><td>概率 ↓</td></tr></tbody></table></div>\n<blockquote><p>如果 4 条<strong>全对</strong>（reward 都是 1.0），σ=0，所有 advantage=0 → <strong>这一步什么也没学到</strong>。 这就是为什么题目难度要\"刚好一半会一半不会\"。</p></blockquote>"
   },
   {
    "id": "s7",
    "title": "7. 代码与参数",
    "short": "代码与参数",
    "html": "<p>完整脚本：<a class=\"il\" href=\"#\"><code>code/train_grpo.py</code></a></p>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">from datasets import load_dataset\nfrom trl import GRPOConfig, GRPOTrainer\nfrom rewards import accuracy_reward, format_reward\n\ndataset = load_dataset(\"json\", data_files=\"../data/grpo_prompts.jsonl\", split=\"train\")\n\nargs = GRPOConfig(\n    output_dir=\"./ckpt/grpo-math\",\n    num_generations=8,          # ★ 每个 prompt 采几条\n    temperature=1.0,            # ★ 必须有随机性，否则组内全一样\n    max_completion_length=512,\n    loss_type=\"dapo\",\n    scale_rewards=\"group\",\n    beta=0.0,                   # 参考模型 KL 惩罚；0=不加载 ref model\n    learning_rate=1e-6,\n    per_device_train_batch_size=8,\n    num_train_epochs=1,\n    bf16=True,\n)\n\ntrainer = GRPOTrainer(\n    model=\"Qwen/Qwen2.5-0.5B-Instruct\",\n    args=args,\n    train_dataset=dataset,\n    reward_funcs=[accuracy_reward, format_reward],\n)\ntrainer.train()</code></pre></div>\n<h3 id=\"s7-h1\">关键参数</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>参数</th><th>作用</th><th>默认</th><th>备注</th></tr></thead><tbody><tr><td><code>num_generations</code></td><td>每个 prompt 采样条数 G</td><td><code>8</code></td><td><strong>必须整除有效 batch</strong></td></tr><tr><td><code>temperature</code></td><td>采样温度</td><td><code>1.0</code></td><td>太低→组内无差异；太高→全是噪声</td></tr><tr><td><code>max_completion_length</code></td><td>单条回答上限</td><td><code>512</code></td><td>多轮场景=整个 episode 预算</td></tr><tr><td><code>beta</code></td><td>对 ref model 的 KL 惩罚</td><td><code>0.0</code></td><td>设 &gt;0 会多加载一个模型</td></tr><tr><td><code>loss_type</code></td><td>损失变体</td><td><code>\"dapo\"</code></td><td>另有 <code>\"grpo\"</code>、<code>\"dr_grpo\"</code> 等</td></tr><tr><td><code>scale_rewards</code></td><td>优势归一化方式</td><td><code>\"group\"</code></td><td>用组内 std；<code>\"batch\"</code> 用全 batch</td></tr><tr><td><code>num_iterations</code></td><td>每批数据复用几次</td><td><code>1</code></td><td>&gt;1 类似 PPO 的多 epoch</td></tr><tr><td><code>reward_weights</code></td><td>多个奖励的权重</td><td>均等</td><td><strong>只作用于 <code>reward_funcs</code></strong>，不影响环境奖励</td></tr><tr><td><code>mask_truncated_completions</code></td><td>截断样本是否屏蔽</td><td><code>False</code></td><td>长回答任务建议开</td></tr><tr><td><code>steps_per_generation</code></td><td>一次生成支撑几步训练</td><td>—</td><td>提高生成利用率</td></tr><tr><td><code>max_tool_calling_iterations</code></td><td>最多工具轮数</td><td>—</td><td>多轮 agent 必设</td></tr></tbody></table></div>\n<blockquote><p>显存提示：<code>num_generations=8</code> 意味着<strong>同一时刻要放进 8 条 completion 做前向</strong>， 显存约等于 batch=8 的 SFT。0.5B 模型单卡 24GB 够用；4B 以上要考虑 <code>use_vllm</code> 或分卡。</p></blockquote>"
   },
   {
    "id": "s8",
    "title": "8. 产物与验收",
    "short": "产物与验收",
    "html": "<h3 id=\"s8-h1\">8.1 日志指标</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>指标</th><th>含义</th><th>健康表现</th></tr></thead><tbody><tr><td><code>reward</code></td><td>平均总奖励</td><td>稳步上升；后期趋平</td></tr><tr><td><code>reward_std</code></td><td>组内奖励标准差</td><td><strong>别长期为 0</strong>（全对/全错就学不动）</td></tr><tr><td><code>kl</code></td><td>与 ref model 的 KL</td><td><code>beta=0</code> 时为 0；<code>beta&gt;0</code> 时应平缓上升</td></tr><tr><td><code>entropy</code></td><td>输出熵</td><td>缓慢下降；骤降=塌缩</td></tr><tr><td><code>completions/mean_length</code></td><td>平均长度</td><td>应稳定；持续变长=在钻空子</td></tr><tr><td><code>completions/clipped_ratio</code></td><td>被截断比例</td><td>接近 0</td></tr><tr><td><code>tools/call_frequency</code></td><td>平均工具调用次数</td><td>多轮任务核心观察项</td></tr><tr><td><code>tools/failure_frequency</code></td><td>工具失败率</td><td>应下降</td></tr></tbody></table></div>\n<h3 id=\"s8-h2\">8.2 判断\"RL 真的起作用\"的三个检查</h3>\n<div class=\"codewrap\"><pre><code>□ 留出集上准确率提升，而不只是训练 reward 提升（后者可能只是 reward hacking）\n□ reward_std 仍在合理范围（0.1~0.5），说明题目难度合适\n□ 输出变短或结构变清晰，而不是靠\"多写点\"骗分</code></pre></div>\n<h3 id=\"s8-h3\">8.3 常见 reward hacking 形态</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>现象</th><th>模型在干什么</th><th>修法</th></tr></thead><tbody><tr><td>长度暴涨</td><td>用废话堆概率</td><td>加长度惩罚 / 开 <code>mask_truncated_completions</code></td></tr><tr><td>格式分满分但答案错</td><td>只学会了 <code>&lt;answer&gt;</code> 标签</td><td>提高 accuracy 权重，或去掉纯格式奖励</td></tr><tr><td>全部输出同一个模板</td><td>找到\"安全但正确\"的偷懒解</td><td>降 temperature？不，是提高题目多样性</td></tr><tr><td>训练 reward 上升、留出集下降</td><td>过拟合奖励函数</td><td>换更强验证器 / 加正则</td></tr></tbody></table></div>"
   },
   {
    "id": "s9",
    "title": "9. 常见坑",
    "short": "常见坑",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>坑</th><th>症状</th><th>解法</th></tr></thead><tbody><tr><td class=\"num\">1</td><td><code>num_generations</code> 不整除有效 batch</td><td>启动时报错</td><td>让 <code>batch × grad_accum × 卡数</code> 能被 G 整除</td></tr><tr><td class=\"num\">2</td><td>题目全对或全错</td><td><code>reward_std=0</code>，<code>loss≈0</code></td><td>换难度适中的题，或做难度筛选</td></tr><tr><td class=\"num\">3</td><td><code>temperature=0</code></td><td>8 条一模一样</td><td>保持 1.0 左右</td></tr><tr><td class=\"num\">4</td><td>奖励返回 numpy / tensor</td><td>报类型错或静默出错</td><td>显式 <code>float(...)</code></td></tr><tr><td class=\"num\">5</td><td>奖励函数里改了模型状态</td><td>千奇百怪的 bug</td><td>奖励函数要<strong>纯函数</strong>，只读输入</td></tr><tr><td class=\"num\">6</td><td><code>ground_truth</code> 长度对不上</td><td>索引错位</td><td>相信 TRL 的广播，别自己 <code>repeat</code></td></tr><tr><td class=\"num\">7</td><td>以为 <code>beta</code> 是\"必须 &gt;0\"</td><td>多花一张卡的显存</td><td>GRPO 默认 0，先别加</td></tr><tr><td class=\"num\">8</td><td>用训练集奖励判断成败</td><td>自我感觉良好</td><td>一定留验证集</td></tr></tbody></table></div>"
   },
   {
    "id": "s10",
    "title": "10. 练习与自测",
    "short": "练习与自测",
    "html": "<ol><li><strong>难度实验</strong>：把 3 道题换成 3 道\"远超模型能力\"的题，跑 100 步，观察 <code>reward</code> 是否几乎不动。理解\"全错 = 学不到\"。</li><li><strong>写一个只会被 hack 的奖励</strong>：只给 <code>format_reward</code>、不给 <code>accuracy_reward</code>，看模型多久学会\"格式完美但答案乱写\"。</li><li><strong>对比蒸馏</strong>：同一批 prompt，一次用教师做蒸馏、一次用 accuracy 奖励做 GRPO，比较 200 步内验证集准确率曲线。</li></ol>"

    "html": "<div class=\"codewrap\"><pre><code>   prompt（数据集里的，或 env.reset() 返回的）\n      │\n      ▼\n┌───────────────────────────────────────────────────────────────┐\n│ 轮 1  模型: \"先读文件\" → tool_call read_file(\"solution.py\")    │\n│       环境: 返回文件内容          ← 拼进上下文                  │\n│ 轮 2  模型: \"除零没处理\" → tool_call write_file(...)           │\n│       环境: 写入磁盘，返回\"已写入\"                              │\n│ 轮 3  模型: tool_call run_tests()                              │\n│       环境: 跑 pytest，返回 \"2 passed\"                          │\n│ 轮 4  模型: \"修好了\" → 结束                                     │\n└───────────────────────────────────────────────────────────────┘\n      │\n      ▼\n  env.get_reward() → 1.0</code></pre></div>\n<p><strong>几个容易被忽略的点</strong>：</p>\n<ol><li>每一轮的 <strong>prompt + completion + 工具结果都是 token</strong>，全都算进 <code>max_completion_length</code> 这个总预算。</li><li>工具抛异常不是崩溃，而是<strong>变成一条工具结果</strong>回喂模型（\"文件不存在\"、\"语法错误\"）。模型因此学会读报错。</li><li>一个 episode 结束的方式有三种：模型自己停、撞到 token 预算、撞到 <code>max_tool_calling_iterations</code>。</li><li><strong>组内 8 条 rollout 的初始状态可能不同</strong>（如果 <code>reset()</code> 自己采样子任务），此时\"组内比较\"要更小心。</li></ol>"

    "short": "接口契约：写一个环境类",
    "html": "<p>TRL 的约定非常具体，逐条照做就不会踩坑：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>要求</th><th>说明</th><th>不满足会怎样</th></tr></thead><tbody><tr><td>类定义在<strong>模块顶层</strong></td><td>第 5 步要 pickle 到 rollout 进程</td><td><code>TypeError: can't pickle</code></td></tr><tr><td><code>__init__(self)</code> <strong>不带参数</strong></td><td>参数通过 <code>reset()</code> 的 kwargs 传</td><td>factory 调用失败</td></tr><tr><td><code>reset(**kwargs) -&gt; str | None</code></td><td>必需。返回观测字符串（当 prompt）或 <code>None</code>（用数据集的 prompt）</td><td>训练无法开始</td></tr><tr><td>公开方法 = 工具</td><td>方法名即工具名，<strong>docstring 即 description</strong>，类型注解即 schema</td><td>模型不知道有这个工具</td></tr><tr><td><code>get_reward() -&gt; float</code></td><td>可选。定义了就会与 <code>reward_funcs</code> 的分数<strong>相加</strong></td><td>只能用外部奖励</td></tr><tr><td>别写通用的 <code>step(action)</code></td><td>工具应该是<strong>具体的</strong>（<code>read_file</code> 而不是 <code>step</code>）</td><td>模型学不到动作语义</td></tr><tr><td>工具内部状态要维护</td><td>环境自己记住改了什么</td><td>多轮之间状态丢失</td></tr></tbody></table></div>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">class MyEnv:\n    def __init__(self):\n        self.state = None\n\n    def reset(self, **kwargs):\n        self.state = ...\n        return \"任务描述……\"      # 或 None\n\n    def my_tool(self, arg: str) -&gt; str:\n        \"\"\"一句话说明这个工具干什么。\n\n        Args:\n            arg: 参数说明（schema 会从这里生成）\n        \"\"\"\n        return \"结果\"\n\n    def get_reward(self) -&gt; float:\n        return 1.0 if done else 0.0</code></pre></div>"

    "title": "6. 输入格式",
    "short": "输入格式",
    "html": "<p>环境有两种数据驱动方式。</p>\n<h3 id=\"s6-h1\">方式 A：环境自采样（无数据集）</h3>\n<p><code>reset()</code> 内部随机生成任务，返回 prompt。<strong>连 train_dataset 都不用给。</strong></p>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">training_args = GRPOConfig(environment_factory=IncrementEnv, ...)\ntrainer = GRPOTrainer(model=..., args=training_args)      # 没有 train_dataset</code></pre></div>\n<h3 id=\"s6-h2\">方式 B：数据集驱动（推荐，任务可控）</h3>\n<p><code>prompt</code> 列照旧，<strong>其余列会作为 kwargs 传给 <code>reset()</code></strong>。</p>\n<div class=\"codewrap\"><pre><code class=\"lang-json\">{\n  \"prompt\": \"solution.py 里的测试失败了，请修好它。\",\n  \"buggy_code\": \"def divide(a, b):\\n    return a / b\\n\",\n  \"tests\": \"from solution import divide\\n\\ndef test_zero():\\n    ...\"\n}</code></pre></div>\n<div class=\"tablewrap\"><table><thead><tr><th>列</th><th>去向</th></tr></thead><tbody><tr><td><code>prompt</code></td><td>第一条用户消息</td></tr><tr><td><code>buggy_code</code> / <code>tests</code></td><td><code>env.reset(buggy_code=..., tests=...)</code></td></tr><tr><td><code>environment</code></td><td>有多个 factory 时用来路由（见下）</td></tr></tbody></table></div>\n<h3 id=\"s6-h3\">多个环境并存</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">training_args = GRPOConfig(\n    environment_factory={\"increment\": IncrementEnv, \"coding\": CodingEnv},\n    ...\n)</code></pre></div>\n<p>数据集里 <code>environment</code> 列填 <code>\"increment\"</code> 或 <code>\"coding\"</code>，TRL 按名字选 factory。</p>"
   },
   {
    "id": "s7",
    "title": "7. 输入输出：多轮视角",
    "short": "输入输出：多轮视角",
    "html": "<div class=\"codewrap\"><pre><code>                     ┌──────────── 一个 episode（受 max_completion_length 约束）────────────┐\ninput_ids:           │ prompt ⧺ [turn1 completion] ⧺ [tool result] ⧺ [turn2 completion] ⧺ ... │\nloss mask:           │  -100  │      保留        │    -100     │      保留        │  -100    │\n                     └───────────────────────────────────────────────────────────────────────┘\n                                                                    │\n                                                                    ▼\n                                              env.get_reward()  →  reward  [1]\n                                                                    │\n                                          与另外 7 条 rollout 组内标准化 → advantage\n                                                                    │\n                                                                    ▼\n                                                     对每一轮 completion token 做策略梯度</code></pre></div>\n<p><strong>和 SFT 的 mask 规则完全一致</strong>：只有 assistant（模型自己说的）算 loss，工具结果和环境返回一律 <code>-100</code>。 区别只是这条序列由环境动态拼出来，不是数据里写好的。</p>"
   },
   {
    "id": "s8",
    "title": "8. OpenEnv：环境的标准容器",
    "short": "OpenEnv：环境的标准容器",
    "html": "<p>原文把 OpenEnv 作为环境生态的标准。它的关键点：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>特性</th><th>含义</th></tr></thead><tbody><tr><td><strong>Gymnasium 风格 API</strong></td><td><code>reset()</code> / <code>step()</code> / <code>state()</code> —— 和你熟悉的 RL 接口一致</td></tr><tr><td><strong>WebSocket 传输</strong></td><td>客户端与服务器分离，环境可以跑在另一台机器/云端</td></tr><tr><td><strong>同步 + 异步</strong></td><td>天然适配异步 rollout</td></tr><tr><td><strong>每个环境 = 一个 Docker 镜像</strong></td><td>依赖、工具、状态全打包，本地/HF Space/云沙箱都能跑</td></tr><tr><td><strong>环境目录（catalog）</strong></td><td>现成的环境可以直接拿来训，不用自己写</td></tr><tr><td><strong>集成</strong></td><td>TRL、Unsloth、SkyRL、ART、Oumi、torchforge、Miles</td></tr><tr><td><strong>Harbor</strong></td><td>在环境里跑 Claude Code / Codex / OpenCode 这类真实 agent，并抓下 token（第 5 步的基础）</td></tr></tbody></table></div>\n<h3 id=\"s8-h1\">用现成环境的最小例子（文档原文的 Echo 环境）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">from envs.echo_env import CallToolAction, EchoEnv\n\nclass EchoToolEnv:\n    def __init__(self):\n        self.env = EchoEnv(base_url=\"https://openenv-echo-env.hf.space\")\n        self.reward = 0.0\n\n    def reset(self, **kwargs):\n        obs = self.env.reset()\n        return obs.observation.echoed_message\n\n    def call_tool(self, message: str) -&gt; str:\n        \"\"\"调用 Echo 环境里的工具。\"\"\"\n        obs = self.env.step(CallToolAction(message=message))\n        self.reward = obs.observation.reward\n        return obs.observation.echoed_message\n\n    def get_reward(self):\n        return self.reward\n\ndef reward_func(environments, **kwargs):\n    return [env.reward for env in environments]\n\ntrainer = GRPOTrainer(\n    model=\"Qwen/Qwen3-0.6B\",\n    args=GRPOConfig(output_dir=\"echo\", chat_template_kwargs={\"enable_thinking\": False},\n                    log_completions=True, ...),\n    environment_factory=EchoToolEnv,\n    reward_funcs=[reward_func],\n)</code></pre></div>\n<blockquote><p>有 <code>environment_factory</code> 时，奖励函数的签名里会出现 <code>environments</code> 参数—— 每个 completion 对应一个环境实例，所以能直接读 <code>env.reward</code>。</p></blockquote>"
   },
   {
    "id": "s9",
    "title": "9. 代码与参数",
    "short": "代码与参数",
    "html": "<ul><li>环境类：<a class=\"il\" href=\"#\"><code>code/env_factory.py</code></a>（<code>IncrementEnv</code> 最小示例 + <code>CodingEnv</code> 编程环境）</li><li>训练脚本：<a class=\"il\" href=\"#\"><code>code/train_grpo_env.py</code></a></li></ul>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">args = GRPOConfig(\n    output_dir=\"./ckpt/grpo-coding-env\",\n    environment_factory=CodingEnv,   # ★ 唯一的关键改动\n    num_generations=8,\n    max_completion_length=4096,      # ★ 整个 episode 的 token 预算\n    max_tool_calling_iterations=20,\n    log_completions=True,            # ★ 调试环境时必开\n    learning_rate=1e-6,\n)\ntrainer = GRPOTrainer(model=\"Qwen/Qwen2.5-0.5B-Instruct\", args=args,\n                      train_dataset=dataset)   # reward_funcs 可为空</code></pre></div>\n<h3 id=\"s9-h1\">参数对照（与第 3 步的差异）</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>参数</th><th>第 3 步（奖励函数）</th><th>第 4 步（环境）</th></tr></thead><tbody><tr><td><code>max_completion_length</code></td><td>一条回答的长度</td><td><strong>整个 episode</strong> 的预算，要放大 5–20 倍</td></tr><tr><td><code>max_tool_calling_iterations</code></td><td>不用设</td><td>必设（防止无限调工具）</td></tr><tr><td><code>log_completions</code></td><td>可选</td><td><strong>强烈建议开</strong>，否则环境行为是黑盒</td></tr><tr><td><code>reward_funcs</code></td><td>必需</td><td>可为空（分数来自 <code>get_reward</code>）</td></tr><tr><td><code>train_dataset</code></td><td>必需</td><td>可省（环境自采样）</td></tr></tbody></table></div>\n<h3 id=\"s9-h2\">环境服务器</h3>\n<p>如果环境跑在 OpenEnv 服务里（Docker 镜像 + WebSocket），注意并发上限：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">MAX_CONCURRENT_ENVS=9 openenv serve --port 8000</code></pre></div>\n<p>并发数至少要覆盖 <code>num_generations × 同时在跑的 batch</code>，否则 rollout 会排队，训练变慢。</p>"
   },
   {
    "id": "s10",
    "title": "10. 产物与验收",
    "short": "产物与验收",
    "html": "<h3 id=\"s10-h1\">10.1 日志指标</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>指标</th><th>含义</th><th>健康表现</th></tr></thead><tbody><tr><td><code>reward</code></td><td>二元通过率（本例）</td><td>从接近 0 稳步上升</td></tr><tr><td><code>reward_std</code></td><td>组内差异</td><td>太低说明题目太简单/太难</td></tr><tr><td><code>tools/call_frequency</code></td><td>每 episode 平均工具调用数</td><td>从 1–2 涨到 5–10 说明学会用工具</td></tr><tr><td><code>tools/failure_frequency</code></td><td>工具失败率</td><td>应下降（学会正确传参）</td></tr><tr><td><code>completions/mean_length</code></td><td>episode 平均 token 数</td><td>稳定；暴涨=在兜圈子</td></tr><tr><td><code>completions/clipped_ratio</code></td><td>撞预算上限比例</td><td>应 &lt; 5%</td></tr><tr><td><code>entropy</code></td><td>输出熵</td><td>平缓下降</td></tr></tbody></table></div>\n<h3 id=\"s10-h2\">10.2 看 <code>log_completions</code> 的完整 episode</h3>\n<p>这是<strong>最有效的验收方式</strong>。一个训练良好的 episode 应该像：</p>\n<div class=\"codewrap\"><pre><code>[turn 1] read_file(\"solution.py\")            → 文件内容\n[turn 2] \"除零没抛异常\"                        ← 有推理\n[turn 3] write_file(\"solution.py\", \"...\")    → 已写入\n[turn 4] run_tests()                          → 2 passed\n[turn 5] \"在 divide 里加除零检查，测试通过\"      ← 简洁总结</code></pre></div>\n<p>对比训练前的坏样子：</p>\n<div class=\"codewrap\"><pre><code>[turn 1] write_file(\"solution.py\", \"def divide(...): ...\")   ← 不看就改\n[turn 2] run_tests() → 1 failed 3 passed\n[turn 3] write_file(...)  ← 反复瞎试，撞预算</code></pre></div>\n<h3 id=\"s10-h3\">10.3 产物</h3>\n<ul><li><code>./ckpt/grpo-coding-env/</code>：会使用工具、会读报错的模型</li><li>一个可复用的环境（下一步 Harness 会把它包进真实 agent）</li></ul>"
   },
   {
    "id": "s11",
    "title": "11. 常见坑",
    "short": "常见坑",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>坑</th><th>症状</th><th>解法</th></tr></thead><tbody><tr><td class=\"num\">1</td><td>工具没有 docstring</td><td>模型不知道工具有什么用</td><td>写 docstring + 类型注解</td></tr><tr><td class=\"num\">2</td><td><code>max_completion_length</code> 还是 512</td><td>第 2 轮就被截断，永远失败</td><td>按 episode 长度放大</td></tr><tr><td class=\"num\">3</td><td>奖励塑形过度</td><td>模型刷中间步骤</td><td>优先用二元奖励（文档明确建议）</td></tr><tr><td class=\"num\">4</td><td>环境在本机跑 <code>exec</code></td><td>安全风险</td><td>用 Docker / 远程沙箱</td></tr><tr><td class=\"num\">5</td><td>环境很慢</td><td>GPU 空转等 rollout</td><td>提高 <code>MAX_CONCURRENT_ENVS</code>、开 <code>use_vllm</code></td></tr><tr><td class=\"num\">6</td><td>不同 rollout 初始状态差异大</td><td>组内比较失去意义</td><td>让 <code>reset()</code> 采样同一难度，或按难度分组</td></tr><tr><td class=\"num\">7</td><td><code>reset()</code> 返回空字符串</td><td>prompt 为空，模型乱说</td><td>返回明确任务描述或 <code>None</code></td></tr><tr><td class=\"num\">8</td><td>状态没在 <code>reset</code> 里清干净</td><td>上一个 episode 的污染</td><td>所有状态在 <code>reset</code> 里重置</td></tr><tr><td class=\"num\">9</td><td>忘了 <code>get_reward</code> 的调用时机</td><td>分数在动作中途就变了</td><td>只在终结时计算</td></tr></tbody></table></div>"
   },
   {
    "id": "s12",
    "title": "12. 练习与自测",
    "short": "练习与自测",
    "html": "<ol><li><strong>最小环境</strong>：把 <code>IncrementEnv</code> 的目标改成\"从 10 减到 0\"（加一个 <code>decrement</code> 工具），训练 100 步，看 <code>tools/call_frequency</code> 是否能稳定到 10。</li><li><strong>错误反馈</strong>：在 <code>read_file</code> 里故意对不存在的文件抛 <code>FileNotFoundError</code>，观察模型是否学会\"先列文件再读\"。</li><li><strong>二元 vs 塑形</strong>：给 <code>CodingEnv.get_reward()</code> 加一个\"改了文件就给 0.2\"的塑形分，对比 200 步后真实通过率——你大概率会看到塑形版本更差。</li></ol>"
   },
   {
    "id": "s13",
    "title": "13. 一句话带走",
    "short": "一句话带走",
    "html": "<blockquote><p>环境把 RL 从\"评一句话\"变成了\"评一次行动\"，好评如潮，但<strong>每个 episode 都要真的跑起来</strong>—— 于是 rollout 成了瓶颈，而模型还是在你写的循环里跑。 下一章：干脆<strong>别自己写循环</strong>，让真实 agent harness 来跑。</p></blockquote>"
   }
  ]
 },
 {
  "id": "ch6",
  "num": "05",
  "title": "05 · Harness 与规模化",
  "heading": "05 · Harness 与规模化",
  "subtitle": "真实 agent + 异步训练",
  "sections": [
   {
    "id": "s1",
    "title": "1. 一句话定义",
    "short": "一句话定义",
    "html": "<p><strong>别自己写 agent 循环了——让真实 agent（mini-swe-agent / opencode / claude-code）在远程沙箱里跑，训练它。同时把\"生成\"和\"训练\"拆到两块 GPU 上并行，让 trainer 不再空转。</strong></p>\n<p>这一步同时解决两件事：<strong>真实性</strong>（在它将来要跑的同一个壳里训练）和<strong>速度</strong>（长 episode 不再阻塞训练）。</p>"
   },
   {
    "id": "s2",
    "title": "2. 原文译文 · 5. Harnesses and scale",
    "short": "原文译文 · 5. Harnesses and scale",
    "html": "<blockquote><p>每一次 rollout 都是<strong>一个完整的 agent 运行</strong>——通过一个现成的 agent harness、在一个远程沙箱里跑完。用 agent 实际部署时会用的同一个 harness 来训练，意味着模型是在<strong>它将来真正运行的那个环境</strong>里学习。</p>\n<p>生成与训练跑在<strong>不同的 GPU</strong> 上，所以很长的 episode 不会让训练器干等着。随后训练器把更新后的权重送回 vLLM。</p></blockquote>\n<h3 id=\"s2-h1\">原文推荐资源</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>Slides</td><td><a href=\"https://huggingface.co/spaces/FineEnvs/multi-harness-rl-slides\" target=\"_blank\" rel=\"noopener\">Training a coding agent through a harness you did not write</a></td></tr><tr><td>Read</td><td><a href=\"https://huggingface.co/spaces/FineEnvs/multi-harness-rl\" target=\"_blank\" rel=\"noopener\">The ultimate guide to multi-harness RL</a> · <a href=\"https://huggingface.co/blog/sergiopaniego/rl-environments-2026\" target=\"_blank\" rel=\"noopener\">One sandbox per rollout</a> · <a href=\"https://huggingface.co/blog/async-rl-training-landscape\" target=\"_blank\" rel=\"noopener\">Keep the Tokens Flowing: lessons from 16 open-source RL libraries</a></td></tr><tr><td>Docs</td><td><a href=\"https://huggingface.co/docs/trl/async_grpo_trainer\" target=\"_blank\" rel=\"noopener\">Async GRPO Trainer</a> · <a href=\"https://huggingface.co/docs/openenv/tutorials/harnesses\" target=\"_blank\" rel=\"noopener\">OpenEnv harnesses</a></td></tr></tbody></table></div>"
   },
   {
    "id": "s3",
    "title": "3. 为什么需要异步：同步 RL 的浪费",
    "short": "为什么需要异步：同步 RL 的浪费",
    "html": "<div class=\"codewrap\"><pre><code>同步 GRPO 的时间线（一张卡干两件事）：\n\nGPU: [生成 8 条 episode ............ 40s][训练一步 5s][生成 ............ 40s][训练 5s]\n            ↑ 这 40 秒里，算损失的 GPU 完全闲置（利用率 ~11%）\n\n异步（生成与训练分卡）：\n\nGPU-0 (vLLM)  : [生成 episode 1][生成 2][生成 3][生成 4][生成 5]...  一直在产数据\nGPU-1 (trainer):      [训练步1][训练步2][训练步3][训练步4][训练步5]...  一直在学\n                        ↑ 队列里有货就吃，不吃就等（但不再空转）</code></pre></div>\n<p>一句话：<strong>episode 越长，同步的浪费越致命</strong>。第 4 步已经把 episode 拉长到几十轮，第 5 步拉到真实 agent 的几百轮——必须异步。</p>"
   },
   {
    "id": "s4",
    "title": "4. 完整架构",
    "short": "完整架构",
    "html": "<div class=\"codewrap\"><pre><code>┌──────────────────────────── 训练侧（GPU-1）────────────────────────────┐\n│  AsyncGRPOTrainer                                                      │\n│    ① 从队列取 (prompt, completions, rewards, advantages, logprobs)     │\n│    ② 前向 + 反向，算 clipped 策略梯度                                   │\n│    ③ 每 weight_sync_steps 步：把新权重通过 NCCL 推给 vLLM               │\n└───────────────▲───────────────────────────────────────┬────────────────┘\n                │ 队列（进程间）                         │ 权重同步\n┌───────────────┴───────────────────────────────────────▼────────────────┐\n│  rollout worker（后台进程，CUDA_VISIBLE_DEVICES=\"\" —— 不占 GPU）        │\n│    ① 取 prompt → 发给 vLLM 生成                                  │\n│    ② 打奖励分（reward_funcs / rollout_reward_fn）                       │\n│    ③ 组内标准化算优势                                                   │\n│    ④ 入队                                                               │\n└───────────────▲────────────────────────────────────────────────────────┘\n                │ HTTP\n┌───────────────┴──────────────┐      ┌──────────────────────────────────┐\n│  vLLM server（GPU-0）         │◀─────│  Harbor（远程沙箱编排）           │\n│  · 生成 completion            │      │  · 每个 rollout 起一个沙箱        │\n│  · 返回 token id + logprobs   │      │  · 跑 mini-swe-agent / opencode   │\n└───────────────────────────────┘      │  · 抓 TrainingTrace 回传          │\n                                       └──────────────────────────────────┘</code></pre></div>\n<h3 id=\"s4-h1\">关键设计：<strong>同一个模型，两个身份</strong></h3>\n<p>vLLM 里跑的是\"当前策略\"，trainer 里更新的是同一份权重。同步靠 <code>weight_sync_steps</code>，而 <code>max_staleness</code> 决定\"一条样本最多可以落后几次更新\"——这是<strong>异步带来的 off-policy 程度</strong>的直接度量。</p>"
   },
   {
    "id": "s5",
    "title": "5. 核心数据结构：TrainingTrace",
    "short": "核心数据结构：TrainingTrace",
    "html": "<p>黑盒 harness 唯一必须交回来的东西，就是\"这段 token 是我们模型生成的、那段不是\"。</p>\n<div class=\"codewrap\"><pre><code>trace.node_id              = \"turn_3\"\ntrace.prompt_token_ids     = [10, 11]              ← 这一轮看到的上下文\ntrace.completion_token_ids = [20, 21, 22]          ← 模型生成的部分\ntrace.per_token_logps      = [-0.1, -0.9, -0.4]    ← 生成时的旧概率（算 ratio 用）\ntrace.loss_mask            = [0, 0, 1, 0, 1]       ← 与 prompt+completion 等长</code></pre></div>\n<div class=\"codewrap\"><pre><code>位置:        0    1    2    3    4\ntoken:      10   11   20   21   22\n来源:     prompt prompt 模型 模型 模型\nmask:       0    0    1    0    1\n是否学:      ✗    ✗    ✓    ✗    ✓</code></pre></div>\n<p><strong>为什么 mask 里会有 0？</strong> 因为 harness 可能在两轮之间插入了它自己生成的文本（比如它自己做了一次摘要、或某轮输出被判定无效）。这些位置<strong>保留作为上下文</strong>，但<strong>不参与梯度</strong>。</p>\n<blockquote><p>这就是\"用别人的 harness 训练\"的核心难点：你必须能从 harness 的日志里<strong>精确还原</strong>哪些 token 是模型生成的。 Harbor 帮你做了这件事；自研 harness 就要自己写 adapter 产出 <code>TrainingTrace</code>。</p></blockquote>"
   },
   {
    "id": "s6",
    "title": "6. 两条实现路径",
    "short": "两条实现路径",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th></th><th>路径 A：自己写循环（第 4 步）</th><th>路径 B：黑盒 harness（第 5 步）</th></tr></thead><tbody><tr><td>谁控制循环</td><td>你的 <code>environment_factory</code></td><td><code>mini-swe-agent</code> / <code>opencode</code> / <code>claude-code</code></td></tr><tr><td>工具从哪来</td><td>环境类的公开方法</td><td>harness 自带的工具集</td></tr><tr><td>训练信号</td><td><code>env.get_reward()</code></td><td><code>rollout_reward_fn(outcome)</code></td></tr><tr><td>token 对齐</td><td>trainer 自己知道</td><td>必须靠 <code>TrainingTrace</code> 还原</td></tr><tr><td>适合</td><td>任务可控、想快速迭代</td><td>要\"在真实部署配置里训练\"</td></tr></tbody></table></div>\n<h3 id=\"s6-h1\">路径 B 的执行流程</h3>\n<div class=\"codewrap\"><pre><code>1. trainer 把 prompt 交给 rollout worker\n2. worker 请求 Harbor：用哪个 harness、哪个沙箱、连哪个 vLLM\n3. Harbor 起一个沙箱 → 启动 agent → agent 调用 vLLM（就是被训的模型）\n4. agent 跑完（或超时）→ Harbor 收集 trace + 环境结果\n5. worker 用 rollout_reward_fn 把 outcome 变成一个分数\n6. 组内标准化 → 入队 → trainer 更新 → 权重同步回 vLLM</code></pre></div>"
   },
   {
    "id": "s7",
    "title": "7. 输入输出",
    "short": "输入输出",
    "html": "<h3 id=\"s7-h1\">7.1 输入</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>输入</th><th>内容</th></tr></thead><tbody><tr><td>任务数据集</td><td>至少 <code>prompt</code>；其余列可给 Harbor 做任务配置</td></tr><tr><td>harness 配置</td><td><code>harness=</code>（哪个 agent）、<code>sandbox=</code>（哪种沙箱）、<code>llm_url=</code></td></tr><tr><td>奖励</td><td><code>rollout_reward_fn(outcome) -&gt; float | None</code>，或 <code>reward_funcs</code></td></tr><tr><td>vLLM 服务</td><td>一个已启动、开了 <code>--weight-transfer-config</code> 的 server</td></tr></tbody></table></div>\n<h3 id=\"s7-h2\">7.2 输出（<code>HarnessRolloutOutcome</code>）</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>字段</th><th>含义</th></tr></thead><tbody><tr><td><code>completion</code></td><td>agent 的最终回答（可能是 None）</td></tr><tr><td><code>env_reward</code></td><td>环境/验证器给的分数（有就用它）</td></tr><tr><td><code>trace</code></td><td><code>TrainingTrace</code> 列表，每轮一条</td></tr><tr><td><code>tool_call_count</code></td><td>总共调了几次工具</td></tr><tr><td><code>tool_failure_count</code></td><td>工具失败几次</td></tr><tr><td><code>tool_calls_by_name</code></td><td>每个工具被调了几次</td></tr><tr><td><code>timed_out</code></td><td>是否超时</td></tr></tbody></table></div>\n<blockquote><p><code>rollout_reward_fn</code> 返回 <code>None</code> = <strong>\"这条不可评分\"</strong>，它会从组基线里被剔除（而不是当 0 分）。 这个细节很重要：把\"跑挂了\"当成 0 分会污染优势估计。</p></blockquote>"
   },
   {
    "id": "s8",
    "title": "8. 代码与命令",
    "short": "代码与命令",
    "html": "<ul><li>异步训练：<a class=\"il\" href=\"#\"><code>code/train_async_grpo.py</code></a></li><li>黑盒 harness：<a class=\"il\" href=\"#\"><code>code/harbor_rollout.py</code></a></li></ul>\n<h3 id=\"s8-h1\">8.1 起服务（三个进程）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># ① Harbor：负责沙箱 + harness + trace 抓取\nMAX_CONCURRENT_ENVS=9 openenv harbor serve \\\n  --dataset &lt;hf-dataset&gt; --port 8200 --capture-port 8300 --expose gradio\n\n# ② vLLM：生成 + 权重接收\nvllm serve Qwen/Qwen3-4B \\\n  --enable-auto-tool-choice --tool-call-parser hermes \\\n  --logprobs-mode processed_logprobs \\\n  --return-tokens-as-token-ids \\\n  --weight-transfer-config '{\"backend\":\"nccl\"}'\n\n# ③ 训练\nCUDA_VISIBLE_DEVICES=1 accelerate launch train_async_grpo.py</code></pre></div>\n<h3 id=\"s8-h2\">8.2 训练脚本骨架</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">trainer = AsyncGRPOTrainer(\n    model=\"Qwen/Qwen3-4B\",\n    args=AsyncGRPOConfig(\n        vllm_server_url=\"http://localhost:8000\",\n        max_staleness=2,\n        weight_sync_steps=8,\n        num_generations=8,\n        max_completion_length=8192,   # 真实 agent 的 episode 很长\n    ),\n    train_dataset=dataset,\n    reward_funcs=[accuracy_reward],\n)</code></pre></div>\n<h3 id=\"s8-h3\">8.3 黑盒 harness 骨架</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">worker = HarnessRolloutWorker(\n    harness_session_factory=partial(\n        HarborSessionFactory, \"http://localhost:8200\",\n        split=\"train\", harness=\"mini-swe-agent\", sandbox=\"e2b\",\n        llm_url=\"http://localhost:8000\", model=\"Qwen/Qwen3-4B\",\n    ),\n    harness_adapter=None,          # 内置 harness 不需要 adapter\n    rollout_reward_fn=rollout_reward_fn,\n    model_name=\"Qwen/Qwen3-4B\",\n    dataset=dataset,\n    processing_class=tokenizer,\n    num_generations=8,\n    max_inflight_tasks=8,\n    vllm_server_url=\"http://localhost:8000\",\n)</code></pre></div>\n<h3 id=\"s8-h4\">关键参数</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>参数</th><th>作用</th><th>建议</th></tr></thead><tbody><tr><td><code>vllm_server_url</code></td><td>生成服务地址</td><td>必须在另一块卡上</td></tr><tr><td><code>max_staleness</code></td><td>样本最多落后几次权重更新</td><td>1–3；越大越省但越 off-policy</td></tr><tr><td><code>max_inflight_tasks</code></td><td>同时在跑的 rollout 数</td><td>≤ Harbor 的 <code>MAX_CONCURRENT_ENVS</code></td></tr><tr><td><code>weight_sync_steps</code></td><td>每几步同步权重到 vLLM</td><td>4–16；太频繁会拖慢训练</td></tr><tr><td><code>max_completion_length</code></td><td>episode 总预算</td><td>真实 agent 建议 8k–32k</td></tr><tr><td><code>ignore_data_skip</code></td><td>续训时跳过已训数据</td><td>默认 True</td></tr></tbody></table></div>"
   },
   {
    "id": "s9",
    "title": "9. 产物与验收",
    "short": "产物与验收",
    "html": "<h3 id=\"s9-h1\">9.1 指标</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>指标</th><th>含义</th><th>健康表现</th></tr></thead><tbody><tr><td><code>reward</code></td><td>平均奖励</td><td>上升</td></tr><tr><td><code>reward_std</code></td><td>组内差异</td><td>0.1–0.5</td></tr><tr><td><code>tools/call_frequency</code></td><td>agent 平均工具调用数</td><td>应稳定在某个值，不无限涨</td></tr><tr><td><code>tools/failure_frequency</code></td><td>工具失败率</td><td>下降</td></tr><tr><td><code>completions/mean_length</code></td><td>episode 长度</td><td>稳定；暴涨=兜圈子</td></tr><tr><td><code>completions/clipped_ratio</code></td><td>撞预算比例</td><td>&lt; 10%</td></tr><tr><td><code>kl</code></td><td>与参考模型偏离</td><td>平缓</td></tr></tbody></table></div>\n<p><strong>异步特有的观察项</strong>：</p>\n<div class=\"codewrap\"><pre><code>□ 训练 loss 是否比同步版本更抖？（正常，因为样本来自稍旧的策略）\n□ max_staleness 调大后 reward 是否还涨？（不涨说明 off-policy 太重）\n□ 权重同步是否成为瓶颈？（看 step_time 是否周期性飙高）</code></pre></div>\n<h3 id=\"s9-h2\">9.2 最终验收：在真实 harness 里跑一次</h3>\n<p>训练结束后，最好的验收不是看 loss，而是：</p>\n<div class=\"codewrap\"><pre><code>□ 用同一个 harness（mini-swe-agent）在留出任务上跑 20 个 episode\n□ 统计通过率，对比训练前\n□ 抽 3 条 transcript 人工看：工具调用是否合理、是否读报错、是否收敛</code></pre></div>\n<h3 id=\"s9-h3\">9.3 产物</h3>\n<ul><li><code>./ckpt/harness-rl/</code>：在真实 agent 壳里训练过的模型</li><li><code>rollout_state.json</code>：断点续训用的状态（首个未训练 prompt 的位置）</li><li>一套可复现的服务编排（Harbor + vLLM + 沙箱）</li></ul>"
   },
   {
    "id": "s10",
    "title": "10. 常见坑",
    "short": "常见坑",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>坑</th><th>症状</th><th>解法</th></tr></thead><tbody><tr><td class=\"num\">1</td><td>用了 lambda / 闭包做奖励</td><td><code>TypeError: can't pickle</code></td><td>改成模块级函数或 <code>functools.partial</code></td></tr><tr><td class=\"num\">2</td><td>工具写成嵌套函数</td><td>pickle 失败 / 工具没注册</td><td>工具必须模块级，靠 <code>__name__</code> 注册</td></tr><tr><td class=\"num\">3</td><td>在 rollout 进程里加载奖励模型</td><td>报无 GPU 可用</td><td>rollout 进程 <code>CUDA_VISIBLE_DEVICES=\"\"</code>，奖励模型另起 HTTP 服务</td></tr><tr><td class=\"num\">4</td><td>Harbor 并发 &lt; <code>max_inflight_tasks</code></td><td>rollout 排队，GPU 饿死</td><td>提高 <code>MAX_CONCURRENT_ENVS</code></td></tr><tr><td class=\"num\">5</td><td>忘记 <code>--weight-transfer-config</code></td><td>权重同步失败</td><td>两台机器都要配 NCCL 后端</td></tr><tr><td class=\"num\">6</td><td>vLLM 与 trainer 同卡</td><td>OOM</td><td>必须分卡（第 5 步的前提）</td></tr><tr><td class=\"num\">7</td><td><code>max_staleness</code> 设太大</td><td>reward 不涨</td><td>降到 1–2</td></tr><tr><td class=\"num\">8</td><td>trace 的 mask 造错</td><td>模型学到\"harness 说的话\"</td><td>用 Harbor 的 trace；自研 harness 要严格核对</td></tr><tr><td class=\"num\">9</td><td>沙箱超时没设</td><td>挂死的 episode 拖垮队列</td><td>用 <code>timed_out</code> 字段识别并返回 0 或 None</td></tr><tr><td class=\"num\">10</td><td>按次计费的沙箱</td><td>账单爆炸</td><td>控制 <code>max_inflight_tasks</code> 与 episode 上限</td></tr></tbody></table></div>"
   },
   {
    "id": "s11",
    "title": "11. 练习与自测",
    "short": "练习与自测",
    "html": "<ol><li><strong>异步 vs 同步</strong>：同一任务跑 200 步同步 GRPO 与异步 GRPO，比较墙钟时间与最终奖励。算一下\"理论加速比 = 生成时间/训练时间\"。</li><li><strong>staleness 实验</strong>：<code>max_staleness</code> 取 1 / 4 / 8，观察 <code>reward</code> 曲线。你会看到\"省时间\"与\"学得准\"的权衡。</li><li><strong>换 harness</strong>：把 <code>harness=\"mini-swe-agent\"</code> 换成 <code>\"opencode\"</code>，同一份权重直接跑，观察行为差异——这直观说明\"壳\"对模型表现的影响有多大。</li></ol>"
   },
   {
    "id": "s12",
    "title": "12. 五步总复习：什么时候用哪一步",
    "short": "五步总复习：什么时候用哪一步",
    "html": "<div class=\"codewrap\"><pre><code>你有「正确的完整轨迹」吗？\n ├─ 有 ──────────────────────────────▶ ① SFT（最便宜、最稳，先做这个）\n └─ 没有\n     ├─ 有一个更强的教师模型吗？\n     │    ├─ 有 ──────────────────────▶ ② 蒸馏（信号密、样本省）\n     │    └─ 没有\n     │        ├─ 能写出「判断对错」的规则吗？\n     │        │    ├─ 能，且一轮就够 ──▶ ③ GRPO + 奖励函数\n     │        │    └─ 能，但要动手试 ──▶ ④ GRPO + 环境\n     │        └─ 只能事后看结果\n     │             └─ 有真实 agent 壳吗？\n     │                  └─ 有 ────────▶ ⑤ 异步 GRPO + Harness\n     └─ 什么都没有 ──▶ 回去先造数据 / 造验证器</code></pre></div>\n<p><strong>真实流水线通常是串起来的</strong>：<code>SFT（学会格式）→ 蒸馏或 GRPO（学会解题）→ 环境 / Harness（学会在真实壳里行动）</code>。</p>"
   },
   {
    "id": "s13",
    "title": "13. 一句话带走",
    "short": "一句话带走",
    "html": "<blockquote><p>前四步你在<strong>造数据、造奖励、造环境</strong>；第五步你终于<strong>不再造任何东西</strong>——直接用生产环境里的那个壳。 代价是工程复杂度：三个进程、两块卡、pickle 约束、权重同步、沙箱账单。 这也是为什么原文把\"规模化\"和\"harness\"放在同一步：<strong>到了这一步，瓶颈已经不是算法，而是流水线工程。</strong></p></blockquote>"
   }
  ]
 },
 {
  "id": "ch7",
  "num": "99",
  "title": "99 · 附录",
  "heading": "99 · 附录：全文对照、资源总表、术语、速查",
  "subtitle": "原文对照 / 链接 / 术语 / FAQ",
  "sections": [
   {
    "id": "s1",
    "title": "附录 A · 原文与译文全文对照",
    "short": "附录 A · 原文与译文全文对照",
    "html": "<blockquote><p>原文：<a href=\"https://huggingface.co/blog/huggingface/train-agents\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/huggingface/train-agents</a> 说明：为方便对照，段落逐段对齐；原文中每节的 Watch / Read / Docs 链接统一收在「附录 B」。</p></blockquote>\n<h3 id=\"s1-h1\">A.0 标题与引言</h3>\n<p><strong>原文</strong></p>\n<blockquote><p>A curriculum for post-training agents</p>\n<p>Post-training refers to the training stages that follow pretraining, such as supervised fine-tuning, distillation and reinforcement learning. These stages turn a pretrained model into one that follows instructions, uses tools or solves a specific task.</p>\n<p>When a model acts as an agent, it works over many turns. It calls tools, reads the results and decides what to do next. Agentic post-training applies these stages to agents, so training has to account for the whole sequence of turns instead of a single answer.</p></blockquote>\n<p><strong>译文</strong></p>\n<blockquote><p>一份面向 agent 的后训练课程</p>\n<p>后训练指的是预训练之后的那些训练阶段，例如监督微调、蒸馏和强化学习。这些阶段把一个预训练模型变成会遵循指令、会使用工具、或能解决特定任务的模型。</p>\n<p>当模型作为 agent 工作时，它要在很多轮里行动：调用工具、读取结果、决定下一步做什么。Agentic 后训练就是把这些阶段用在 agent 上——于是训练必须考虑<strong>整条多轮交互的序列</strong>，而不是单个回答。</p></blockquote>\n<p><strong>原文</strong></p>\n<blockquote><p>This page is organized in five steps, after an introductory section. Every step includes a diagram of the method, a livestream or slides, a blog post that explains the idea and the relevant documentation. Some steps add example projects built with that method. The table below summarizes, for each step, what the model learns from, the TRL trainer and what you need to prepare.</p>\n<p>The order of the steps follows Training Agents, a livestream series on the Hugging Face YouTube channel. Each session covers one post-training method, with training a coding agent as the running example. The Post-training Agents playlist has the four sessions plus two related workshops.</p></blockquote>\n<p><strong>译文</strong></p>\n<blockquote><p>本页在导言之后组织为五个步骤。每一步都包含：方法示意图、一场直播或幻灯片、一篇解释思路的博客，以及相关文档。部分步骤还附了用该方法构建的示例项目。下面的表格总结了每一步：模型从什么信号中学习、用哪个 TRL trainer、以及你需要准备什么。</p>\n<p>这些步骤的顺序沿袭 Hugging Face YouTube 频道的直播系列 <strong>Training Agents</strong>。每一期讲一种后训练方法，并始终以<strong>训练一个编程 agent</strong> 作为贯穿全程的示例。<strong>Post-training Agents</strong> 播放列表包含这四期节目以及两场相关 workshop。</p></blockquote>\n<h3 id=\"s1-h2\">A.1 Steps at a glance</h3>\n<p><strong>原文</strong></p>\n<blockquote><p>| Step | The model learns from | TRL trainer | What you need | | 1. SFT | agent traces from a stronger model | SFTTrainer | a dataset of agent traces | | 2. Distillation | a teacher's tokens or probabilities | DistillationTrainer | prompts and a teacher model | | 3. RL | a score for each answer | GRPOTrainer | prompts and a reward function | | 4. RL environments | the outcome of acting in an environment | GRPOTrainer | tasks and an environment (OpenEnv) | | 5. Harnesses and scale | full runs of a real agent | AsyncGRPOTrainer | tasks, an environment and an agent harness |</p></blockquote>\n<p><strong>译文</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>模型从什么学习</th><th>TRL trainer</th><th>你需要准备</th></tr></thead><tbody><tr><td>1. SFT</td><td>来自更强模型的 agent 轨迹</td><td><code>SFTTrainer</code></td><td>一个 agent 轨迹数据集</td></tr><tr><td>2. 蒸馏</td><td>教师的 token 或概率</td><td><code>DistillationTrainer</code></td><td>prompts + 一个教师模型</td></tr><tr><td>3. RL</td><td>每个回答的得分</td><td><code>GRPOTrainer</code></td><td>prompts + 一个奖励函数</td></tr><tr><td>4. RL 环境</td><td>在环境中行动的结果</td><td><code>GRPOTrainer</code></td><td>任务 + 一个环境（OpenEnv）</td></tr><tr><td>5. Harness 与规模化</td><td>真实 agent 的完整运行</td><td><code>AsyncGRPOTrainer</code></td><td>任务 + 环境 + 一个 agent harness</td></tr></tbody></table></div>\n<h3 id=\"s1-h3\">A.2 · 0. Before you start</h3>\n<p><strong>原文</strong></p>\n<blockquote><p>The terms used in the rest of the page (agent, harness, scaffold) and an overview of all the steps.</p></blockquote>\n<p><strong>译文</strong></p>\n<blockquote><p>本页后续会用到的术语（agent、harness、scaffold），以及所有步骤的总览。</p></blockquote>\n<h3 id=\"s1-h4\">A.3 · 1. Supervised fine-tuning (SFT)</h3>\n<p><strong>原文</strong></p>\n<blockquote><p>The model learns to copy agent traces, recordings of an agent solving a task with every tool call and its result, usually produced by a stronger model. It's cheap and stable.</p>\n<p>The model only sees correct traces, never its own attempts. When it makes a mistake while solving a task, it has not learned how to recover from it. On-policy distillation and RL address this by training on the model's own outputs.</p></blockquote>\n<p><strong>译文</strong></p>\n<blockquote><p>模型学会复制 <strong>agent 轨迹</strong>——也就是 agent 解决一个任务的过程记录，其中包含每一次工具调用及其结果，通常由更强的模型产生。这一步便宜且稳定。</p>\n<p>模型只会见到<strong>正确的</strong>轨迹，永远见不到它自己的尝试。当它在解题过程中犯了错，它并没有学过如何从错误中恢复。<strong>On-policy 蒸馏</strong>和 <strong>RL</strong> 通过在模型自己的输出上训练来解决这个问题。</p></blockquote>\n<h3 id=\"s1-h5\">A.4 · 2. Distillation</h3>\n<p><strong>原文</strong></p>\n<blockquote><p>A teacher model supervises the student, either through the data it writes or through its probabilities on the student's own tokens. The teacher is usually a larger model, several expert models distilled into one student (as in MOPD), or the same model with extra context in the case of self-distillation. The signal is dense, one value per token, so training needs fewer samples than RL.</p>\n<p>On the other hand, the student is limited by what the teacher knows, and on-policy distillation has to run the teacher at every training step. RL replaces the teacher with a reward that only checks the result.</p></blockquote>\n<p><strong>译文</strong></p>\n<blockquote><p>由一个教师模型来监督学生：监督可以来自<strong>教师写出来的数据</strong>，也可以来自<strong>教师在学生自己那些 token 上的概率</strong>。教师通常是一个更大的模型，也可以是\"多个专家模型蒸馏进一个学生\"（例如 MOPD），或者在自蒸馏的情况下是\"同一个模型 + 更长的上下文\"。这个信号是<strong>密集的：每个 token 一个值</strong>，所以训练所需的样本量比 RL 少。</p>\n<p>反过来，学生会被教师的知识水平所限制；而在 on-policy 蒸馏里，<strong>每一个训练步都必须跑一次教师</strong>。RL 则用\"只看结果的奖励\"替代了教师。</p></blockquote>\n<h3 id=\"s1-h6\">A.5 · 3. Reinforcement learning (RL)</h3>\n<p><strong>原文</strong></p>\n<blockquote><p>In reinforcement learning, the model learns from a score on its own outputs. It writes an answer, a reward function scores it, and training makes high-scoring answers more likely. This removes the need for a teacher. A way to check the answer is enough.</p>\n<p>The algorithm used in this step is GRPO (Group Relative Policy Optimization). For each prompt it samples several answers, scores them all, and raises the probability of the ones that scored above the group average. Comparing answers within the group tells the model which attempts were better, without training a separate model to estimate that.</p>\n<p>The signal is weaker than in distillation, one number for the whole answer instead of one per token, so the model needs many attempts to learn. With a plain reward function each answer is a single turn, scored once. Environments let the model act several times and see the result of each action.</p></blockquote>\n<p><strong>译文</strong></p>\n<blockquote><p>在强化学习中，模型从<strong>对自己输出的一个分数</strong>里学习。它写一个答案，奖励函数给它打分，训练让高分答案变得更可能。这样就<strong>不再需要教师</strong>——只要能校验答案就够了。</p>\n<p>这一步用的算法是 <strong>GRPO（Group Relative Policy Optimization）</strong>。对每个 prompt，它采样若干个答案，给它们全部打分，然后提高那些<strong>得分高于组内平均</strong>的答案的概率。在组内比较答案，就告诉了模型哪些尝试更好，<strong>而不需要另外训练一个模型来估计这件事</strong>。</p>\n<p>这个信号比蒸馏弱：<strong>整条答案只有一个数</strong>，而不是每个 token 一个值，所以模型需要很多次尝试才能学到东西。用普通奖励函数时，每个答案只有一轮、只打一次分。而<strong>环境</strong>让模型可以行动多次，并看到每个动作的结果。</p></blockquote>\n<h3 id=\"s1-h7\">A.6 · 4. RL environments</h3>\n<p><strong>原文</strong></p>\n<blockquote><p>The reward comes from acting in an environment that keeps state, exposes tools and answers back over several turns. The environment runs the tools, keeps track of what changed and checks the final result, for example by running the tests of a coding task.</p>\n<p>Each episode is longer than a single answer, so generating rollouts becomes the slowest part of training.</p></blockquote>\n<p><strong>译文</strong></p>\n<blockquote><p>奖励来自<strong>在一个环境中行动</strong>——这个环境保持状态、暴露工具、并在多轮交互中回应你。环境负责执行工具、跟踪发生了什么变化、并检查最终结果，例如运行一个编程任务的测试。</p>\n<p>每个 episode 都比单个回答更长，所以<strong>生成 rollout 成了训练中最慢的部分</strong>。</p></blockquote>\n<h3 id=\"s1-h8\">A.7 · 5. Harnesses and scale</h3>\n<p><strong>原文</strong></p>\n<blockquote><p>Each rollout is a full agent run through an existing agent harness inside a remote sandbox. Training through the same harness the agent uses in practice means the model learns in the setting where it will run.</p>\n<p>Generation and training run on separate GPUs, so long episodes don't leave the trainer idle. The trainer then sends the updated weights back to vLLM.</p></blockquote>\n<p><strong>译文</strong></p>\n<blockquote><p>每一次 rollout 都是<strong>一个完整的 agent 运行</strong>——通过一个现成的 agent harness、在一个远程沙箱里跑完。用 agent 实际部署时会用的同一个 harness 来训练，意味着模型是在<strong>它将来真正运行的那个环境</strong>里学习。</p>\n<p>生成与训练跑在<strong>不同的 GPU</strong> 上，所以很长的 episode 不会让训练器干等着。随后训练器把更新后的权重送回 vLLM。</p></blockquote>"

361428545566\" target=\"_blank\" rel=\"noopener\">https://x.com/ben_burtenshaw/status/2067615361428545566</a></td></tr><tr><td>文档</td><td><a href=\"https://huggingface.co/docs/trl/sft_trainer\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/docs/trl/sft_trainer</a></td></tr></tbody></table></div>\n<h3 id=\"s2-h3\">B.2 蒸馏</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>图</td><td><a href=\"https://huggingface.co/buckets/merve/post-training-curriculum/resolve/2_distillation.png?download=true\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/buckets/merve/post-training-curriculum/resolve/2_distillation.png?download=true</a></td></tr><tr><td>直播</td><td><a href=\"https://www.youtube.com/watch?v=GZT_oNQnLV4\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=GZT_oNQnLV4</a></td></tr><tr><td>合集</td><td><a href=\"https://huggingface.co/collections/sergiopaniego/training-agents-class-2-distillation-6a47a62b9f09867dccf61e1e\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/collections/sergiopaniego/training-agents-class-2-distillation-6a47a62b9f09867dccf61e1e</a></td></tr><tr><td>阅读 1</td><td><a href=\"https://huggingface.co/blog/sergiopaniego/brief-history-of-distillation-in-ai\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/sergiopaniego/brief-history-of-distillation-in-ai</a></td></tr><tr><td>阅读 2</td><td><a href=\"https://huggingface.co/blog/sergiopaniego/distillation-2026\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/sergiopaniego/distillation-2026</a></td></tr><tr><td>文档</td><td><a href=\"https://huggingface.co/docs/trl/distillation_trainer\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/docs/trl/distillation_trainer</a></td></tr></tbody></table></div>\n<h3 id=\"s2-h4\">B.3 GRPO</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>图</td><td><a href=\"https://huggingface.co/buckets/merve/post-training-curriculum/resolve/3_rl.png?download=true\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/buckets/merve/post-training-curriculum/resolve/3_rl.png?download=true</a></td></tr><tr><td>直播</td><td><a href=\"https://www.youtube.com/watch?v=ztdTed5egrM\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ztdTed5egrM</a></td></tr><tr><td>合集</td><td><a href=\"https://huggingface.co/collections/sergiopaniego/training-agents-class-3-reinforcement-learning-6ad6aa71050342629dd0e3ec\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/collections/sergiopaniego/training-agents-class-3-reinforcement-learning-6ad6aa71050342629dd0e3ec</a></td></tr><tr><td>阅读</td><td><a href=\"https://huggingface.co/blog/sergiopaniego/agentic-rl-2026\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/sergiopaniego/agentic-rl-2026</a></td></tr><tr><td>项目</td><td><a href=\"https://huggingface.co/blog/grpo-with-trl-ifstruct\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/grpo-with-trl-ifstruct</a></td></tr><tr><td>文档</td><td><a href=\"https://huggingface.co/docs/trl/grpo_trainer\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/docs/trl/grpo_trainer</a></td></tr></tbody></table></div>\n<h3 id=\"s2-h5\">B.4 RL 环境</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>图</td><td><a href=\"https://huggingface.co/buckets/merve/post-training-curriculum/resolve/4_environments.png?download=true\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/buckets/merve/post-training-curriculum/resolve/4_environments.png?download=true</a></td></tr><tr><td>直播</td><td><a href=\"https://www.youtube.com/watch?v=nJV3yUuz6DU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=nJV3yUuz6DU</a></td></tr><tr><td>合集</td><td><a href=\"https://huggingface.co/collections/sergiopaniego/training-agents-class-4-rl-environments-6aa27543918888a0f2b5312c\" target=\"_blank\" rel=\" \"noopener\">https://huggingface.co/spaces/FineEnvs/multi-harness-rl</a></td></tr><tr><td>阅读 2</td><td><a href=\"https://huggingface.co/blog/sergiopaniego/rl-environments-2026\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/sergiopaniego/rl-environments-2026</a></td></tr><tr><td>阅读 3</td><td><a href=\"https://huggingface.co/blog/async-rl-training-landscape\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/async-rl-training-landscape</a></td></tr><tr><td>文档 · AsyncGRPO</td><td><a href=\"https://huggingface.co/docs/trl/async_grpo_trainer\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/docs/trl/async_grpo_trainer</a></td></tr><tr><td>文档 · OpenEnv harnesses</td><td><a href=\"https://huggingface.co/docs/openenv/tutorials/harnesses\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/docs/openenv/tutorials/harnesses</a></td></tr></tbody></table></div>"

    "html": "<p><strong>Q1：我只有一张 16GB 卡，能学完吗？</strong> 能。前三步用 <code>Qwen3-0.6B</code> / <code>Qwen2.5-0.5B</code> 全参 SFT 也能跑；蒸馏用 0.5B 学生 + 1.5B 教师（开 <code>gradient_checkpointing</code>）；GRPO 把 <code>num_generations</code> 降到 4、<code>max_completion_length</code> 降到 512。第 4 步能跑。第 5 步需要两块卡——可以用 Colab / 免费额度跳过，只读代码。</p>\n<p><strong>Q2：SFT 数据从哪来？</strong> 三个来源：① 用更强的模型（Claude / GPT / Qwen-Max）跑你的 agent，把 transcript 存下来；② 人类专家演示；③ 你自己写脚本合成（前提是有可验证的执行环境，否则质量难保证）。关键是<strong>必须是完整 transcript</strong>，包括工具调用和结果。</p>\n<p><strong>Q3：为什么 SFT 之后还要 RL？SFT 不能一步到位吗？</strong> SFT 只见过正确轨迹，所以遇到自己犯错时不会恢复；它优化的是\"和示范的相似度\"，不是\"任务成功率\"。RL 直接优化成功率，能发现示范里没有的解法。原文的比喻很准确：SFT 学\"抄\"，RL 学\"练\"。</p>\n<p><strong>Q4：GRPO 的 <code>reward</code> 一直不涨怎么办？</strong> 按这个顺序排查：① <code>reward_std</code> 是否为 0（全对/全错）；② <code>temperature</code> 是否太低（组内全一样）；③ 奖励函数是否有 bug（打印几条 <code>completions</code> + <code>rewards</code> 看）；④ 题目难度是否合适；⑤ <code>learning_rate</code> 是否太大（loss 爆炸）或太小。</p>\n<p><strong>Q5：怎么发现 reward hacking？</strong> 三个信号：<code>completions/mean_length</code> 持续上涨；训练 <code>reward</code> 涨但留出集不涨；抽看 transcript 发现\"格式完美、内容空洞\"。对策：加长度惩罚、提高准确率权重、用更强的验证器、定期人工抽检。</p>\n<p><strong>Q6：<code>beta</code> 到底设多少？</strong> 蒸馏的 <code>beta</code> 是散度选择器（0=前向 KL，1=反向 KL，0.5=JSD），先试 0.5。GRPO 的 <code>beta</code> 是参考模型 KL 惩罚，默认 0.0（不加载 ref model，省显存），想做稳定性约束再设 0.01~0.04。<strong>两个 beta 完全不是一回事。</strong></p>\n<p><strong>Q7：环境里的 <code>max_completion_length</code> 为什么老是截断？</strong> 因为它管的是<strong>整个 episode</strong> 的 token 预算，不是单轮。一个 10 轮的工具调用任务轻松超过 8k token。要同时调大 <code>max_completion_length</code> 和 <code>max_tool_calling_iterations</code>，并看 <code>completions/clipped_ratio</code>。</p>\n<p><strong>Q8：第 5 步报 <code>TypeError: can't pickle</code> 怎么办？</strong> 把奖励函数/工具/环境类挪到模块顶层（不要 lambda、不要闭包、不要 <code>__main__</code> 里的嵌套函数）。需要预绑定参数就 <code>functools.partial(fn, arg=...)</code>。工具函数名会作为注册键，所以别重名。</p>\n<p><strong>Q9：可以跳过前面直接做第 5 步吗？</strong> 技术上可以（<code>AsyncGRPOTrainer</code> 不依赖前面的产物），但实践上不建议：模型连工具调用格式都不会时，真实 harness 里的 rollout 几乎全是失败，<code>reward_std≈0</code>，什么也学不到。<strong>先用 SFT 把格式教会，是性价比最高的一步。</strong></p>\n<p><strong>Q10：这套流程和\"预训练\"是什么关系？</strong> 预训练学语言与世界知识；后训练学\"怎么用这些知识完成任务\"。五步全在后训练范畴内，都不改变模型规模，只改行为分布。</p>"

const TOTAL = 89;

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

const LS = {
  get(k, d) { try { const v = localStorage.getItem('apc:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('apc:' + k, JSON.stringify(v)); } catch (e) {} }
};

let done = LS.get('done', {}) || {};
let last = LS.get('last', 'ch0');
let theme = LS.get('theme', 'light');

const key = (c, s) => c + '/' + s;
const isDone = (c, s) => !!done[key(c, s)];
const chDone = c => c.sections.filter(s => done[key(c.id, s.id)]).length;
const chPct = c => c.sections.length ? Math.round(chDone(c) * 100 / c.sections.length) : 0;

const chapterById = id => DATA.find(c => c.id === id) || DATA[0];

/* ---------------- sidebar ---------------- */
function drawToc() {
  const html = DATA.map((c, i) => {
    const p = chPct(c);
    const secs = c.sections.map(s => {
      const d = isDone(c.id, s.id);
      return `<a class="sl${d ? ' done' : ''}" href="#/${c.id}/${s.id}" data-ch="${c.id}" data-sec="${s.id}">
        <i class="box">✓</i><span>${esc(s.short)}</span></a>`;
    }).join('');
    return `<div class="ch" data-ch="${c.id}" id="toc-${c.id}">
      <a class="chl" href="#/${c.id}">
        <span class="num">${esc(c.num)}</span>
        <span class="ct">${esc(shortTitle(c))}</span>
        <span class="pct">${p}%</span>
      </a>
      <div class="secs">${secs}</div>
    </div>`;
  }).join('');
  $('#toc').innerHTML = html;
  refreshToc();
}

function shortTitle(c) {
  return c.title.replace(/^\d+\s*·\s*/, '').replace(/（.*?）$/, m => m);
}

function refreshToc() {
  DATA.forEach(c => {
    const el = $('#toc-' + c.id);
    if (!el) return;
    el.querySelector('.pct').textContent = chPct(c) + '%';
    el.classList.toggle('done', chPct(c) === 100);
    c.sections.forEach(s => {
      const a = el.querySelector(`a.sl[data-sec="${s.id}"]`);
      if (a) a.classList.toggle('done', isDone(c.id, s.id));
    });
  });
  const d = DATA.reduce((n, c) => n + chDone(c), 0);
  $('#ptext').textContent = d + ' / ' + TOTAL;
  $('#pfill').style.width = (TOTAL ? d * 100 / TOTAL : 0) + '%';
}

/* ---------------- routing ---------------- */
function parseHash() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [ch, sec] = h.split('/');
  return { ch: ch || last, sec: sec || '' };
}
function go(ch, sec) {
  const t = '#/' + ch + (sec ? '/' + sec : '');
  if (location.hash === t) paint(); else location.hash = t;
}

/* ---------------- render ---------------- */
let current = null;

function paint(scrollTo) {
  const r = parseHash();
  const c = chapterById(r.ch);
  current = c;
  const i = DATA.indexOf(c);

  $('#crumb').innerHTML = `<b>${esc(c.title)}</b>${r.sec ? ' · ' + esc((c.sections.find(s => s.id === r.sec) || {}).short || '') : ''}`;

  const p = chPct(c);
  const kicker = c.id === 'ch0' ? '总目录' : (c.num === '99' ? '附录' : 'Step ' + c.num);
  const head = `<header class="chead">
    <div class="kicker">${kicker}</div>
    <h1>${esc(c.heading || c.title)}</h1>
    ${c.subtitle ? `<p class="sub">${esc(c.subtitle)}</p>` : ''}
    <div class="meta">
      <span class="m">${c.sections.length} 节 · 已学 ${chDone(c)} 节</span>
      <div class="bar"><i style="width:${p}%"></i></div>
      <span class="m">${p}%</span>
      <button class="tbtn" id="markall" type="button">${p === 100 ? '清除本章标记' : '整章标记已学'}</button>
    </div>
  </header>`;

  const secs = c.sections.map(s => {
    const d = isDone(c.id, s.id);
    return `<section class="sec${d ? ' done' : ''}" id="sec-${c.id}-${s.id}" data-ch="${c.id}" data-sec="${s.id}">
      <div class="sechead">
        <h2>${esc(s.title)}<a class="anchor" href="#/${c.id}/${s.id}" title="复制此小节的链接">¶</a></h2>
        <button class="mark" type="button" aria-pressed="${d}" data-ch="${c.id}" data-sec="${s.id}">
          <i class="dot">✓</i><span>${d ? '已学' : '标记已学'}</span>
        </button>
      </div>
      ${s.html}
    </section>`;
  }).join('');

  const prev = DATA[i - 1], next = DATA[i + 1];
  const pager = `<div class="pager">
    ${prev ? `<a class="prev" href="#/${prev.id}"><small>← 上一章</small><b>${esc(prev.title)}</b></a>` : `<a class="ghost"></a>`}
    ${next ? `<a class="next" href="#/${next.id}"><small>下一章 →</small><b>${esc(next.title)}</b></a>` : `<a class="ghost"></a>`}
  </div>`;

  $('#doc').innerHTML = head + secs + pager;

  $('#prev').disabled = !prev;
  $('#next').disabled = !next;
  $('#prev').onclick = () => prev && go(prev.id);
  $('#next').onclick = () => next && go(next.id);

  $$('.ch').forEach(el => el.classList.toggle('act', el.dataset.ch === c.id));
  $$('a.sl').forEach(el => el.classList.toggle('act', el.dataset.ch === c.id && el.dataset.sec === r.sec));
  if (window.innerWidth <= 980) document.body.classList.remove('nav-open');

  last = c.id; LS.set('last', c.id);
  refreshToc();
  document.title = c.title + ' · Agentic 后训练教程';

  if (scrollTo) {
    if (r.sec) {
      const el = document.getElementById('sec-' + c.id + '-' + r.sec);
      if (el) {
        const y = el.getBoundingClientRect().top + window.scrollY - 66;
        window.scrollTo(0, Math.max(0, y));
      }
    } else {
      window.scrollTo({ top: 0 });
    }
  }
}

/* ---------------- actions ---------------- */
function toggle(cid, sid) {
  const k = key(cid, sid);
  if (done[k]) delete done[k]; else done[k] = 1;
  LS.set('done', done);
  const sec = document.getElementById('sec-' + cid + '-' + sid);
  const b = document.querySelector(`.mark[data-ch="${cid}"][data-sec="${sid}"]`);
  if (sec) sec.classList.toggle('done', !!done[k]);
  if (b) {
    b.setAttribute('aria-pressed', done[k] ? 'true' : 'false');
    b.querySelector('span').textContent = done[k] ? '已学' : '标记已学';
  }
  refreshToc();
  const c = chapterById(cid);
  const p = chPct(c);
  const m = $('#doc .meta');
  if (m && current && current.id === cid) {
    m.querySelector('.bar i').style.width = p + '%';
    m.querySelectorAll('.m')[1].textContent = p + '%';
    m.querySelectorAll('.m')[0].textContent = `${c.sections.length} 节 · 已学 ${chDone(c)} 节`;
    $('#markall').textContent = p === 100 ? '清除本章标记' : '整章标记已学';
  }
}

document.addEventListener('click', e => {
  const mk = e.target.closest('.mark');
  if (mk) { e.preventDefault(); toggle(mk.dataset.ch, mk.dataset.sec); return; }
  const ma = e.target.closest('#markall');
  if (ma) {
    const c = current, all = chPct(c) === 100;
    c.sections.forEach(s => { if (all) delete done[key(c.id, s.id)]; else done[key(c.id, s.id)] = 1; });
    LS.set('done', done);
    const y = window.scrollY;
    paint(false);
    window.scrollTo(0, y);
    return;
  }
  const an = e.target.closest('.anchor');
  if (an) { e.preventDefault(); history.replaceState(null, '', an.getAttribute('href')); copy(location.href); an.textContent = '✓'; setTimeout(() => an.textContent = '¶', 1200); }
});

function copy(t) {
  try { navigator.clipboard.writeText(t); } catch (e) {}
}

/* ---------------- search ---------------- */
const q = $('#q'), qres = $('#qres');
function search() {
  const v = q.value.trim().toLowerCase();
  if (!v) { qres.hidden = true; qres.innerHTML = ''; return; }
  const hits = [];
  DATA.forEach(c => {
    if (c.title.toLowerCase().includes(v)) hits.push({ c, s: null });
    c.sections.forEach(s => {
      if ((s.short + ' ' + s.title).toLowerCase().includes(v)) hits.push({ c, s });
    });
  });
  qres.innerHTML = hits.length
    ? hits.slice(0, 24).map(h => `<a href="#/${h.c.id}${h.s ? '/' + h.s.id : ''}"><small>${esc(h.c.num)}</small>${esc(h.s ? h.s.short : h.c.title)}</a>`).join('')
    : '<div class="empty">没有匹配的小节</div>';
  qres.hidden = false;
}
q.addEventListener('input', search);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const a = qres.querySelector('a'); if (a) { location.hash = a.getAttribute('href'); qres.hidden = true; q.blur(); } }
  if (e.key === 'Escape') { q.value = ''; search(); q.blur(); }
});

/* ---------------- misc ---------------- */
$('#theme').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  LS.set('theme', theme);
  document.documentElement.dataset.theme = theme;
  $('#theme').textContent = theme === 'dark' ? '浅色模式' : '深色模式';
};
$('#expand').onclick = () => {
  const on = $('#expand').dataset.on !== '1';
  $('#expand').dataset.on = on ? '1' : '0';
  $$('.ch').forEach(el => el.classList.toggle('open', on));
  $('#expand').textContent = on ? '收起目录' : '展开目录';
};
$('#reset').onclick = () => {
  if (!confirm('确定清空所有「已学」标记？')) return;
  done = {}; LS.set('done', done); paint(false);
};
$('#burger').onclick = () => document.body.classList.toggle('nav-open');
$('#scrim').onclick = () => document.body.classList.remove('nav-open');
$('#up').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

window.addEventListener('scroll', () => {
  $('#up').classList.toggle('on', window.scrollY > 600);
});
window.addEventListener('hashchange', () => paint(true));
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key === '/') { e.preventDefault(); q.focus(); return; }
  if (e.key === 'Escape') { document.body.classList.remove('nav-open'); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const i = DATA.indexOf(current);
    const t = DATA[i + (e.key === 'ArrowRight' ? 1 : -1)];
    if (t) go(t.id);
  }
});
