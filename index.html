<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic 后训练教程 · 从 SFT 到 Harness</title>
<script>try{if(localStorage.getItem("apc:theme")==="dark"){document.documentElement.dataset.theme="dark"}}catch(e){}</script>
<style>
:root{
  --bg:#f5f4ef; --paper:#fffefb; --ink:#1c2025; --muted:#6b7280; --line:#e5e1d7;
  --accent:#3f51d6; --accent-soft:#eceefe; --ok:#12703f; --ok-soft:#e7f5ec; --ok-line:#b9e0c6;
  --code-bg:#f4f2ec; --shadow:0 1px 2px rgba(24,28,40,.05),0 8px 24px -12px rgba(24,28,40,.18);
  --side:#fbfaf6;
}
html[data-theme="dark"]{
  --bg:#0f1115; --paper:#171a20; --ink:#e7e9ee; --muted:#98a0ad; --line:#282d36;
  --accent:#8f9dff; --accent-soft:#1d2235; --ok:#5fd39a; --ok-soft:#13251d; --ok-line:#245439;
  --code-bg:#11141a; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px #000;
  --side:#12151b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.78 ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,pre,kbd{font-family:ui-monospace,"Cascadia Code","SF Mono",Consolas,"Liberation Mono",monospace}

/* ---------------- layout ---------------- */
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}
aside{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--side);border-right:1px solid var(--line);padding:20px 16px 28px;
  display:flex;flex-direction:column;gap:14px;
}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 0}
.brand .logo{
  width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),#7c3aed);color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 4px 12px -6px var(--accent);
}
.brand h1{font-size:15px;margin:0;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.3px}

.searchbox{position:relative}
.searchbox input{
  width:100%;padding:9px 12px 9px 32px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:13.5px;outline:none;
}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.qres{
  max-height:300px;overflow:auto;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:4px;box-shadow:var(--shadow);margin-top:-6px;
}
.qres a{display:block;padding:7px 9px;border-radius:7px;color:var(--ink);font-size:13px}
.qres a:hover{background:var(--accent-soft);text-decoration:none}
.qres small{color:var(--muted);margin-right:6px;font-size:11px}
.qres .empty{color:var(--muted);font-size:12.5px;padding:8px 10px}

.progress{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.progress .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.progress .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ok),#4ec98a);transition:width .35s ease}

nav.toc{display:flex;flex-direction:column;gap:2px}
.ch{--pad:0}
.ch>a.chl{
  display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;color:var(--ink);
  font-size:13.5px;font-weight:600;line-height:1.35;position:relative;
}
.ch>a.chl:hover{background:var(--accent-soft);text-decoration:none}
.ch>a.chl .num{
  flex:none;min-width:26px;height:20px;padding:0 5px;border-radius:5px;background:var(--line);
  color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center;letter-spacing:.4px;
  font-variant-numeric:tabular-nums;
}
.ch.act>a.chl{background:var(--accent-soft);color:var(--accent)}
.ch.act>a.chl .num{background:var(--accent);color:#fff}
.ch>a.chl .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch>a.chl .pct{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.ch.done>a.chl .pct{color:var(--ok)}
.secs{display:none;margin:2px 0 8px 22px;border-left:1px solid var(--line);padding-left:9px}
.ch.act .secs,.ch.open .secs{display:block}
a.sl{
  display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;
  color:var(--muted);font-size:12.5px;line-height:1.5;
}
a.sl:hover{background:var(--accent-soft);color:var(--ink);text-decoration:none}
a.sl.act{color:var(--accent);font-weight:600}
a.sl .box{
  flex:none;width:13px;height:13px;margin-top:3px;border:1.5px solid var(--line);border-radius:4px;
  display:grid;place-items:center;font-size:9px;color:transparent;line-height:1;background:var(--paper);
}
a.sl.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
a.sl.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
a.sl.act.done{color:var(--accent)}

.sidefoot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.sidefoot button{
  flex:1 1 auto;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--paper);
  color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;
}
.sidefoot button:hover{color:var(--ink);border-color:var(--accent)}
.tip{font-size:11px;color:var(--muted);line-height:1.6;padding:0 2px}

/* ---------------- main ---------------- */
main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 28px;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.topbar .crumb{font-size:12.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .crumb b{color:var(--ink);font-weight:600}
.tbtn{
  padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn:disabled:hover{border-color:var(--line);color:var(--ink)}

article{width:100%;max-width:900px;margin:0 auto;padding:34px 32px 80px}
.chead{margin:0 0 26px}
.chead .kicker{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:700}
.chead h1{font-size:31px;line-height:1.3;margin:8px 0 8px;letter-spacing:-.3px}
.chead .sub{color:var(--muted);font-size:14.5px;margin:0}
.chead .meta{display:flex;gap:14px;align-items:center;margin-top:16px;flex-wrap:wrap}
.chead .meta .m{font-size:12.5px;color:var(--muted)}
.chead .meta .bar{width:150px;flex:none}

.sec{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 30px 28px;
  margin:0 0 18px;box-shadow:var(--shadow);scroll-margin-top:74px;position:relative;
}
.sec.done{border-color:var(--ok-line)}
.sec.done::after{
  content:"已学";position:absolute;top:0;right:0;font-size:11px;color:var(--ok);
  background:var(--ok-soft);border-bottom-left-radius:10px;padding:3px 10px;letter-spacing:.5px;
}
.sechead{display:flex;align-items:flex-start;gap:14px;margin:0 0 14px}
.sechead h2{flex:1;font-size:20px;line-height:1.45;margin:0;letter-spacing:-.2px}
.sechead h2 .anchor{opacity:0;margin-left:6px;font-weight:400;color:var(--muted);font-size:15px}
.sechead:hover h2 .anchor{opacity:1}
.mark{
  flex:none;display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:12px;cursor:pointer;
  font-family:inherit;margin-top:2px;
}
.mark .dot{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:9px;color:transparent}
.mark:hover{border-color:var(--ok);color:var(--ok)}
.mark[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.mark[aria-pressed="true"] .dot{background:var(--ok);border-color:var(--ok);color:#fff}

.sec p{margin:0 0 14px}
.sec>*:last-child{margin-bottom:0}
.sec h3{font-size:16.5px;margin:26px 0 10px;letter-spacing:-.1px}
.sec h3:first-child{margin-top:0}
.sec h4{font-size:14.5px;margin:20px 0 8px;color:var(--muted)}
.sec ul,.sec ol{margin:0 0 14px;padding-left:22px}
.sec li{margin:5px 0}
.sec li::marker{color:var(--muted)}
.sec li.task{list-style:none;position:relative;padding-left:24px;margin:7px 0}
.sec li.task::before{content:"";position:absolute;left:1px;top:.42em;width:13px;height:13px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper)}
.sec li.task.done::before{background:var(--ok);border-color:var(--ok)}
.sec strong{font-weight:650}
.sec hr{border:none;border-top:1px dashed var(--line);margin:22px 0}
.sec blockquote{
  margin:0 0 16px;padding:4px 0 4px 18px;border-left:3px solid var(--accent);
  color:var(--ink);background:linear-gradient(90deg,var(--accent-soft),transparent 70%);
  border-radius:0 8px 8px 0;
}
.sec blockquote p:last-child{margin-bottom:0}
.sec code{background:var(--code-bg);padding:.15em .38em;border-radius:5px;font-size:.9em;border:1px solid var(--line)}
.codewrap{
  margin:0 0 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg);
}
.codewrap pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:12.9px;line-height:1.65}
.codewrap code{background:none;border:none;padding:0;font-size:inherit}
.tablewrap{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.6px;line-height:1.6}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);background:color-mix(in srgb,var(--bg) 60%,var(--paper));font-weight:650;font-size:12.8px;letter-spacing:.2px;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--accent-soft);background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td code,th code{white-space:normal;overflow-wrap:anywhere}

.pager{display:flex;gap:12px;margin-top:26px}
.pager a{
  flex:1;display:flex;flex-direction:column;gap:3px;padding:14px 18px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);
}
.pager a:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-1px)}
.pager a small{color:var(--muted);font-size:11.5px}
.pager a b{font-size:14px}
.pager a.next{text-align:right;align-items:flex-end}
.pager a.ghost{visibility:hidden}

footer.ft{max-width:900px;margin:0 auto;padding:0 32px 60px;color:var(--muted);font-size:12.5px;line-height:1.8}
footer.ft kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;background:var(--paper)}

#up{
  position:fixed;right:22px;bottom:22px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--paper);color:var(--muted);font-size:15px;cursor:pointer;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(6px);
}
#up.on{opacity:1;pointer-events:auto;transform:none}
#up:hover{color:var(--accent);border-color:var(--accent)}

#burger{display:none}
#scrim{display:none;position:fixed;inset:0;background:rgba(12,14,18,.42);z-index:55;backdrop-filter:blur(1px)}
body.nav-open #scrim{display:block}
body.nav-open #burger{position:relative;z-index:57}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;z-index:60;width:290px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow)}
  body.nav-open aside{transform:none}
  #burger{display:inline-block}
  article{padding:24px 16px 70px}
  .topbar{padding:9px 14px;gap:8px}
  .crumb{font-size:12px}
  .sec{padding:20px 18px 22px;border-radius:12px}
  .chead h1{font-size:25px;letter-spacing:-.2px}
  .sechead{gap:10px}
  .mark{padding:4px 9px}
}
@media print{
  aside,.topbar,.pager,#up,.mark{display:none!important}
  .app{display:block}
  .sec{box-shadow:none;break-inside:avoid;border-color:#ddd}
  body{background:#fff}
}

/* ---- 公式 ---- */
.math{margin:18px 0;padding:8px 2px;overflow-x:auto;font-size:1.2em;text-align:center}
.math math[display="block"]{margin:0 auto}
.imath{white-space:nowrap;font-size:1.04em}
.katex{font-size:1em;line-height:1.35}
.math .katex{font-size:1.16em}
td .katex,th .katex{font-size:1.02em}
.math::-webkit-scrollbar{height:6px}

/* ---- 缩写悬浮提示 ---- */
details.fold{margin:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
details.fold>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;color:var(--ink);list-style:none;background:var(--paper2)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸ ";color:var(--muted)}
details.fold[open]>summary::before{content:"▾ "}
details.fold[open]>summary{border-bottom:1px solid var(--line)}
details.fold .foldbody{padding:6px 16px 12px}
abbr[title]{text-decoration:none;border-bottom:1px dotted var(--muted);cursor:help}
abbr[title]:hover{border-bottom-color:var(--ink);color:var(--ink)}

/* ── 公式拆解器 ───────────────────────────── */
.fxl{margin:20px 0;padding:16px 18px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:var(--shadow)}
.fx-title{font-weight:700;font-size:14px;color:var(--ink);margin-bottom:8px}
.fx-root{margin:2px 0 0}
.fx-hint{margin:10px 0 0;font-size:12px;color:var(--muted)}
.fx-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fx-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:13px;line-height:1.2;transition:border-color .15s,color .15s,background .15s}
.fx-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.fx-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fx-chip-math{font-size:13px}
.fx-chip-name{white-space:nowrap}
.fx-chip-more{font-size:10px;color:var(--muted)}
.fx-back{border:none;background:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:6px 4px}
.fx-panel{display:none;margin-top:14px;padding:13px 16px 14px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0}
.fx-panel.open{display:block}
.fx-crumb{font-size:12px;color:var(--muted);margin-bottom:8px;word-break:break-word}
.fx-node{margin-bottom:2px}
.fx-node-math{font-size:1.15em}
.fx-def{margin:10px 0 8px;font-size:1.02em}
.fx-note{margin:0;font-size:14px;color:var(--ink)}
</style>
</head>
<body>
<div id="scrim"></div>
<div class="app">
  <aside id="side">
    <div class="brand">
      <div class="logo">A↑</div>
      <div>
        <h1>Agentic 后训练教程</h1>
        <p>SFT → 蒸馏 → GRPO → 环境 → Harness</p>
      </div>
    </div>

    <div class="searchbox">
      <span class="icon">⌕</span>
      <input id="q" type="search" placeholder="搜索小节…（/）" autocomplete="off" spellcheck="false">
    </div>
    <div id="qres" class="qres" hidden></div>

    <div class="progress">
      <div class="row"><span>学习进度</span><b id="ptext">0 / 0</b></div>
      <div class="bar"><i id="pfill"></i></div>
    </div>

    <nav class="toc" id="toc"></nav>

    <div class="sidefoot">
      <button id="theme" type="button">深色模式</button>
      <button id="expand" type="button">展开目录</button>
      <button id="reset" type="button">重置进度</button>
    </div>
    <div class="tip">勾选右侧「已学」即记在本机浏览器里；页面可加书签，链接会带你回到具体小节。</div>
  </aside>

  <main>
    <div class="topbar">
      <button class="tbtn" id="burger" type="button" aria-label="目录">☰ 目录</button>
      <div class="crumb" id="crumb"></div>
      <button class="tbtn" id="prev" type="button">← 上一章</button>
      <button class="tbtn" id="next" type="button">下一章 →</button>
    </div>
    <article id="doc"></article>
    <footer class="ft">
      快捷键：<kbd>←</kbd> <kbd>→</kbd> 切换章节 · <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 关闭搜索。
      进度保存在当前浏览器（localStorage），换浏览器或清理数据会重置。
    </footer>
  </main>
</div>

<button id="up" type="button" aria-label="回到顶部">↑</button>

<script>
const DATA = [
 {
  "id": "ch0",
  "num": "目",
  "title": "总目录",
  "heading": "Agent 后训练学习教程",
  "subtitle": "怎么用这份教程",
  "sections": [
   {
    "id": "s1",
    "title": "引言",
    "short": "引言",
    "html": "<blockquote><p>对照 Hugging Face 官方课程页 <strong>《A curriculum for post-training agents》</strong> 原文：<a href=\"https://huggingface.co/blog/huggingface/train-agents\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/huggingface/train-agents</a> 本教程：全文中文翻译 + 每一步的<strong>数据格式</strong>、<strong>输入输出</strong>、<strong>可运行代码骨架</strong>、<strong>踩坑清单</strong> 整理日期：2026-10-28 ｜ 对应文档版本：<abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> v1.16.0</p></blockquote>"
   },
   {
    "id": "s2",
    "title": "0. 这份教程是什么",
    "short": "这份教程是什么",
    "html": "<p>Hugging Face 那篇课程页是一张\"<strong>学习地图</strong>\"：它把 agent 后训练拆成 5 步，每步给你「一张方法图 + 一场直播 + 一篇博客 + 官方文档」。 但它本身<strong>不告诉你每一步的数据长什么样、喂给模型的是什么、模型吐出来的是什么</strong>——这些细节散落在 <abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> 文档各个角落。</p>\n<p>这份教程补上这一块：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>你会得到</th><th>在哪</th></tr></thead><tbody><tr><td>原文的完整中文翻译（逐节对应）</td><td>各章 README 的「原文译文」小节</td></tr><tr><td>每一步的<strong>数据格式</strong>（<abbr title=\"JSON Lines —— 按行存 JSON 的文本格式\">JSONL</abbr> 逐字段）</td><td>各章 <code>data/</code> 示例文件 + README 表格</td></tr><tr><td>每一步的<strong>模型输入输出</strong>（token / mask 视角）</td><td>各章 README 的「输入输出」小节</td></tr><tr><td>可运行代码骨架（改路径就能跑）</td><td>各章 <code>code/</code> 目录</td></tr><tr><td><strong>公式逐项拆解器</strong>（点开一层层往下钻）</td><td>第 1、2、3 章的损失小节 + 第 6 章全部公式</td></tr><tr><td>训练成败的判断依据（看哪些指标）</td><td>各章 README 的「产物与验收」小节</td></tr><tr><td>目录导航、学习路线、资源总表</td><td>本文件</td></tr></tbody></table></div>\n<p><strong>网页版</strong>：仓库里的 <code>index.html</code> 是整份教程的单文件网页（左边目录、小节可打勾、链接可加书签、自动记进度）。<strong>下载下来双击就能看</strong>，不需要服务器、不需要联网。打勾存在你自己浏览器的 localStorage 里，所以谁下载谁记自己的，互不影响；想清空就点页面左下角「重置进度」。</p>\n<p><strong>一句话主线</strong>：后训练就是\"换监督信号\"。 从「抄一遍正确答案」（<abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr>）→「抄老师的概率分布」（蒸馏）→「按评分改自己」（<abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr>）→「在环境里按结果改自己」（<abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr> 环境）→「在真实 agent 里按结果改自己」（Harness）。 <strong>监督信号越来越稀疏，但越来越贴近你真正想要的能力。</strong></p>"
   },
   {
    "id": "s3",
    "title": "1. 原文译文 · 引言",
    "short": "原文译文 · 引言",
    "html": "<blockquote><p>后训练（post-training）指的是预训练之后的那些训练阶段，例如监督微调、蒸馏和强化学习。这些阶段把一个预训练模型变成会遵循指令、会使用工具、能解决特定任务的模型。</p>\n<p>当模型作为 agent 工作时，它要在很多轮里行动：调用工具、读取结果、决定下一步做什么。<strong>Agentic 后训练</strong>就是把这些阶段用在 agent 上——于是训练必须考虑整条多轮交互的序列，而不是单个回答。</p></blockquote>\n<blockquote><p>本页组织为五个步骤，前面有一段导言。每一步都包含：方法示意图、一场直播或幻灯片、一篇解释思路的博客，以及相关文档。部分步骤还附了用该方法构建的示例项目。下面的表格总结了每一步：模型从什么信号中学习、用哪个 <abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> trainer、你需要准备什么。</p></blockquote>\n<blockquote><p>这些步骤的顺序沿袭直播系列 <strong>Training Agents</strong>（Hugging Face 的 YouTube 频道）。每一期讲一种后训练方法，并始终以\"训练一个编程 agent\"作为贯穿全程的示例。播放列表 <a href=\"https://www.youtube.com/playlist?list=PLo2EIpI_JMQvQZm-kVlz4wY1vWF0LBcf5\" target=\"_blank\" rel=\"noopener\">Post-training Agents</a> 包含四期节目加两场相关 workshop。</p></blockquote>"
   },
   {
    "id": "s4",
    "title": "2. 五步一图看懂",
    "short": "五步一图看懂",
    "html": "<div class=\"codewrap\"><pre><code>   同一个模型，五种监督信号\n   ══════════════════════════════════════════════════════════════════════\n\n   (1) SFT          数据：(prompt, 完整正确轨迹)      信号：每个 token 的硬标签\n      模仿          ─────────────────────────────▶  loss = 交叉熵\n\n   (2) 蒸馏         数据：(prompt)  学生自己生成      信号：教师每个 token 的分布\n      对齐分布      ─────────────────────────────▶  loss = JSD(p_学生 ‖ p_教师)\n\n   (3) RL/GRPO      数据：(prompt, 可验证答案)        信号：整条回答一个分数\n      试错优化      ─────────────────────────────▶  loss = 组内相对优势 × 策略梯度\n\n   (4) RL 环境      数据：(任务) + 有状态环境        信号：多轮交互后的最终结果\n      行动学习      ─────────────────────────────▶  同上，但轨迹由环境决定长度\n\n   (5) Harness      数据：(任务) + 真实 agent + 沙箱  信号：真实 agent 跑完的结果\n      规模化        ─────────────────────────────▶  同上，但生成与训练解耦并行\n\n        监督密度：  密集(每token) ────────────────▶ 稀疏(每个 episode 一个数)\n        真实程度：  离线数据   ────────────────▶ 生产环境里的同一个 agent</code></pre></div>\n<h3 id=\"s4-h1\">原文「Steps at a glance」表格（译文）</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>模型从什么学习</th><th><abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> trainer</th><th>你需要准备</th></tr></thead><tbody><tr><td>1. <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr></td><td>来自更强模型的 agent 轨迹</td><td><code>SFTTrainer</code></td><td>一个 agent 轨迹数据集</td></tr><tr><td>2. 蒸馏</td><td>教师的 token 或概率</td><td><code>DistillationTrainer</code></td><td>prompts + 一个教师模型</td></tr><tr><td>3. <abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr></td><td>每个回答的得分</td><td><code>GRPOTrainer</code></td><td>prompts + 一个奖励函数</td></tr><tr><td>4. <abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr> 环境</td><td>在环境中行动的结果</td><td><code>GRPOTrainer</code></td><td>任务 + 一个环境（OpenEnv）</td></tr><tr><td>5. Harness 与规模化</td><td>真实 agent 的完整运行</td><td><code>AsyncGRPOTrainer</code></td><td>任务 + 环境 + 一个 agent harness</td></tr></tbody></table></div>\n<h3 id=\"s4-h2\">换一种说法：每一步的输入 / 输出 / 产物</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>你喂给 trainer 的</th><th>模型（或环境）产出的</th><th>训练后你拿到</th></tr></thead><tbody><tr><td>1 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr></td><td><code>messages</code>（含 <code>tool_calls</code>）</td><td>每个 token 的预测 → 交叉熵</td><td>会模仿轨迹的模型</td></tr><tr><td>2 蒸馏</td><td>只有 <code>prompt</code></td><td>学生自己写的回答 + 师生两组分布</td><td>分布上贴近教师的模型</td></tr><tr><td>3 <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr></td><td><code>prompt</code> + <code>ground_truth</code></td><td>G 条回答 + G 个分数</td><td>会得高分的模型</td></tr><tr><td>4 环境</td><td>任务（可由环境自采样）</td><td>多轮 obs/action 序列 + 最终奖励</td><td>会\"用工具完成任务\"的模型</td></tr><tr><td>5 Harness</td><td>任务 + agent 配置</td><td>真实 agent 的完整 transcript + 验证器打分</td><td>在真实 harness 里变强的模型</td></tr></tbody></table></div>"
   },

    "id": "s5",
    "title": "3. 目录导航",
    "short": "目录导航",
    "html": "<div class=\"codewrap\"><pre><code>Agentic Post-training/\n├── README.md                       ← 你在这里（总目录 / 学习路线 / 资源总表）\n├── 00-开始之前/\n│   ├── README.md                   术语、全景图、环境准备、如何读这份教程\n│   └── cloud-setup.md              只有云 GPU 时怎么跑：选机器 / 传输 / 命令 / 账单\n├── .gitignore · .gitattributes     不提交 ckpt 与缓存；统一 LF\n├── 01-监督微调-SFT/\n│   ├── README.md                   译文 + 格式 + 输入输出 + 损失手算 + 代码 + 踩坑\n│   ├── data/sft_agent_trace.jsonl  解剖样本（2 条完整轨迹，训练请用 trl-lib/Capybara）\n│   └── code/                       7 个模块：train_sft.py 入口 + common/sft_data/\n│                                   sft_template/sft_trainer/sft_report/sft_loss\n├── 02-蒸馏/\n│   ├── README.md\n│   ├── data/distill_prompts.jsonl  解剖样本（3 条 prompt，训练请用 trl-lib/ultrafeedback-prompt）\n│   └── code/                       8 个模块：train_distill.py 入口 + distill_*.py\n├── 03-强化学习-GRPO/\n│   ├── README.md\n│   ├── data/grpo_prompts.jsonl     解剖样本（3 道题，训练请用 trl-lib/DeepMath-103K）\n│   └── code/                       8 个模块：train_grpo.py 入口 + grpo_*.py\n├── 04-RL环境/\n│   ├── README.md\n│   └── code/{env_factory.py, train_grpo_env.py}\n├── 05-Harness与规模化/\n│   ├── README.md\n│   └── code/{train_async_grpo.py, harbor_rollout.py}\n├── 06-理论串联-从熵到GRPO/\n│   └── README.md                   熵 / 交叉熵 / KL / JS 与贝尔曼 / 策略梯度 / GAE / PPO / GRPO 的一条线\n└── 99-附录-资源与术语/\n    └── README.md                   术语表、原文全部链接、常见问题</code></pre></div>\n<h3 id=\"s5-h1\">按顺序读</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>章节</th><th>核心问题</th><th>预计</th></tr></thead><tbody><tr><td class=\"num\">0</td><td><a class=\"il\" href=\"#/ch1\">开始之前</a></td><td>agent / harness / scaffold / environment 到底指什么？</td><td>20 min</td></tr><tr><td class=\"num\">1</td><td><a class=\"il\" href=\"#/ch2\">监督微调 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr></a></td><td>一条 agent 轨迹长什么样？怎么只对 assistant 的 token 算 loss？</td><td>60 min</td></tr><tr><td class=\"num\">2</td><td><a class=\"il\" href=\"#/ch3\">蒸馏</a></td><td>没有\"标准答案\"时，怎么用教师的概率分布当监督？</td><td>45 min</td></tr><tr><td class=\"num\">3</td><td><a class=\"il\" href=\"#/ch4\">强化学习 <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr></a></td><td>只有一个分数时，梯度怎么算？奖励函数怎么写？</td><td>75 min</td></tr><tr><td class=\"num\">4</td><td><a class=\"il\" href=\"#/ch5\"><abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr> 环境</a></td><td>多轮交互、工具、状态，怎么接进 trainer？</td><td>60 min</td></tr><tr><td class=\"num\">5</td><td><a class=\"il\" href=\"#/ch6\">Harness 与规模化</a></td><td>真实 agent 自己掌控循环时，怎么训练？怎么并行？</td><td>60 min</td></tr><tr><td class=\"num\">6</td><td><a class=\"il\" href=\"#/ch7\">理论串联</a></td><td>这些损失函数各自从哪来？为什么 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 用交叉熵、<abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr> 用策略梯度？</td><td>70 min</td></tr><tr><td>附</td><td><a class=\"il\" href=\"#/ch8\">资源与术语</a></td><td>原文全部链接、名词对照、FAQ</td><td>随时查</td></tr></tbody></table></div>\n<h3 id=\"s5-h2\">三条学习路线</h3>\n<ul><li><strong>速通（半天）</strong>：读本文件 → 每章只读「原文译文」+「输入输出」两张表 → 跳过代码。</li><li><strong>动手（一周）</strong>：按 1→2→3→4→5 顺序，每章跑一遍 <code>code/</code> 里的脚本（用小模型 <code>Qwen3-0.6B</code>）。</li><li><strong>深挖（两周）</strong>：先读 <a class=\"il\" href=\"#/ch7\">第 6 章</a> 把损失函数的来路串起来 → 每章读完官方文档链接 → 把你自己的任务改造成对应格式 → 对比五步在同一任务上的效果。</li></ul>"
   },

    "id": "s6",
    "title": "4. 每个文件夹的统一结构",
    "short": "每个文件夹的统一结构",
    "html": "<p>每章 README 都是同一套骨架，方便你横向对比：</p>\n<div class=\"codewrap\"><pre><code>1. 顶部导航        ← 上一节 / 总目录 / 下一节\n2. 一句话定义      ← 这步在整条流水线里的位置\n3. 原文译文        ← 该节完整翻译（含 Watch/Read/Docs 链接）\n4. 训练信号从哪来  ← 一张表：输入 → 产出 → 监督 → 损失\n5. 输入格式        ← JSONL 逐字段表 + 真实示例\n6. 输入输出        ← token / mask / logits 视角，带示意图\n7. 代码与参数      ← 最小可运行脚本 + 关键参数表\n8. 产物与验收      ← 该看哪些日志指标、怎么判断训成功了\n9. 常见坑          ← 我们踩过的（和文档里明写的）\n10. 练习与自测     ← 3 个动手题</code></pre></div>"

   {
    "id": "s7",
    "title": "5. 环境与依赖",
    "short": "环境与依赖",
    "html": "<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 最小可用（第 1–3 步，单卡即可）\npip install \"trl&gt;=1.16.0\" transformers datasets accelerate\n\n# 第 4 步（环境）\npip install openenv-core        # 或直接用 TRL 的 environment_factory，不装也能跑\npip install trl[vllm]           # 用 vLLM 加速生成\n\n# 第 5 步（异步 / harness）\n#   - 需要至少 2 张 GPU：一张跑 vLLM server，一张跑 trainer\n#   - 黑盒 harness 还需要 OpenEnv Harbor server + 沙箱凭证（如 E2B_API_KEY）</code></pre></div>\n<p>硬件参考：<code>0.5B–0.6B</code> 模型单卡 16GB 可跑 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> / 蒸馏 / <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr>小规模实验；<code>4B</code> 以上建议 A100 级别；第 5 步按文档说明需要把 vLLM 与训练分卡。</p>"
   },

    "id": "s8",
    "title": "6. 名词速查（详见 [附录](99-附录-资源与术语/README.md)）",
    "short": "名词速查（详见 附录）",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>词</th><th>一句话</th></tr></thead><tbody><tr><td><strong>agent</strong></td><td>能多轮调用工具、根据结果决定下一步的模型</td></tr><tr><td><strong>harness</strong>（脚手架/外部壳）</td><td>驱动 agent 的那套程序：规划、工具集、上下文管理、停止条件</td></tr><tr><td><strong>scaffold</strong></td><td>与 harness 近义，常指\"模型之外的工程结构\"</td></tr><tr><td><strong>environment</strong></td><td>有状态的世界：能执行动作、记住变化、判定结果</td></tr><tr><td><strong>rollout</strong></td><td>一次完整的采样过程（一条轨迹 / 一个 episode）</td></tr><tr><td><strong>trace</strong></td><td>rollout 的记录：每轮的 prompt、completion、token、logprob、mask</td></tr><tr><td><strong>on-policy</strong></td><td>用\"当前模型自己生成的\"数据来训练</td></tr><tr><td><strong>reward</strong></td><td>给整条回答/整次 rollout 的一个标量分数</td></tr></tbody></table></div>"

    "title": "7. 原文资源总表",
    "short": "原文资源总表",
    "html": "<h3 id=\"s9-h1\">7.1 通用</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>资源</th></tr></thead><tbody><tr><td>课程页</td><td><a href=\"https://huggingface.co/blog/huggingface/train-agents\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/huggingface/train-agents</a></td></tr><tr><td>播放列表</td><td><a href=\"https://www.youtube.com/playlist?list=PLo2EIpI_JMQvQZm-kVlz4wY1vWF0LBcf5\" target=\"_blank\" rel=\"noopener\">Post-training Agents</a>（四期正课 + 两场 workshop）</td></tr><tr><td>术语博客</td><td><a href=\"https://huggingface.co/blog/agent-glossary\" target=\"_blank\" rel=\"noopener\">Harness, Scaffold, and the AI Agent Terms Worth Getting Right</a></td></tr><tr><td>总览幻灯片</td><td><a href=\"https://huggingface.co/spaces/sergiopaniego/train-the-agent-slides\" target=\"_blank\" rel=\"noopener\">Train the agent, not just the model</a>（20 页）</td></tr><tr><td>入门课</td><td><a href=\"https://huggingface.co/learn/llm-course\" target=\"_blank\" rel=\"noopener\"><abbr title=\"Large Language Model —— 大语言模型\">LLM</abbr> Course</a></td></tr></tbody></table></div>\n<h3 id=\"s9-h2\">7.2 逐步资源（对应原文各节的 Watch / Read / Projects / Docs）</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>直播 / 幻灯片</th><th>阅读</th><th>项目</th><th>文档</th></tr></thead><tbody><tr><td><strong>1 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr></strong></td><td><a href=\"https://www.youtube.com/watch?v=rNgUoH7Wbv8\" target=\"_blank\" rel=\"noopener\">Training Agents 1</a>（<a href=\"https://huggingface.co/burtenshaw/gemma4-pi-mono-youtube-livestream-1-scripts\" target=\"_blank\" rel=\"noopener\">直播代码</a>）</td><td><a href=\"https://x.com/ben_burtenshaw/status/2067615361428545566\" target=\"_blank\" rel=\"noopener\"><abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> from scratch</a></td><td>—</td><td><a href=\"https://huggingface.co/docs/trl/sft_trainer\" target=\"_blank\" rel=\"noopener\"><abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> Trainer</a></td> 18888a0f2b5312c\" target=\"_blank\" rel=\"noopener\">合集</a>） · <a href=\"https://www.youtube.com/watch?v=cixmqTsi2A4\" target=\"_blank\" rel=\"noopener\"><abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr> for Agents Workshop</a></td><td><a href=\"https://huggingface.co/blog/sergiopaniego/rl-environments-story\" target=\"_blank\" rel=\"noopener\"><abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr> 环境为什么现在可行</a></td><td><a href=\"https://huggingface.co/blog/train-to-paint-with-code\" target=\"_blank\" rel=\"noopener\">用代码画水彩</a> · <a href=\"https://huggingface.co/blog/sergiopaniego/bringing-carla-to-openenv-trl\" target=\"_blank\" rel=\"noopener\">CARLA 自动驾驶环境</a></td><td><a href=\"https://huggingface.co/docs/trl/openenv\" target=\"_blank\" rel=\"noopener\"><abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> + OpenEnv</a> · <a href=\"https://huggingface.co/docs/openenv\" target=\"_blank\" rel=\"noopener\">OpenEnv</a></td></tr><tr><td><strong>5 Harness</strong></td><td><a href=\"https://huggingface.co/spaces/FineEnvs/multi-harness-rl-slides\" target=\"_blank\" rel=\"noopener\">Multi-harness <abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr> 幻灯片</a></td><td><a href=\"https://huggingface.co/spaces/FineEnvs/multi-harness-rl\" target=\"_blank\" rel=\"noopener\">Multi-harness <abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr> 指南</a> · <a href=\"https://huggingface.co/blog/sergiopaniego/rl-environments-2026\" target=\"_blank\" rel=\"noopener\">每次 rollout 一个沙箱</a> · <a href=\"https://huggingface.co/blog/async-rl-training-landscape\" target=\"_blank\" rel=\"noopener\">Keep the Tokens Flowing</a></td><td>—</td><td><a href=\"https://huggingface.co/docs/trl/async_grpo_trainer\" target=\"_blank\" rel=\"noopener\">Async <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr> Trainer</a> · <a href=\"https://huggingface.co/docs/openenv/tutorials/harnesses\" target=\"_blank\" rel=\"noopener\">OpenEnv harnesses</a></td></tr></tbody></table></div>\n<blockquote><p>完整清单（含合集、配图、原文逐条链接）见 <a class=\"il\" href=\"#/ch8\">附录 B · 资源总表</a>。</p></blockquote>"

 {
  "id": "ch1",
  "num": "00",
  "title": "00 · 开始之前",
  "heading": "00 · 开始之前：术语、全景图、环境",
  "subtitle": "先分清 agent / harness / 环境",
  "sections": [
   {
    "id": "s1",
    "title": "1. 这一章解决什么",
    "short": "这一章解决什么",
    "html": "<p>原文在正式讲五步之前，先让你搞清\"我们在训练什么\"。 如果 <em>agent / harness / scaffold / environment / rollout / trace</em> 这几个词在你脑子里是一团，后面的五步会全部糊掉。这一章先把它们钉死，再画出整条流水线。</p>"
   },
   {
    "id": "s2",
    "title": "2. 原文译文 · 引言",
    "short": "原文译文 · 引言",
    "html": "<blockquote><p>后训练指的是预训练之后的那些训练阶段，例如监督微调、蒸馏和强化学习。这些阶段把一个预训练模型变成会遵循指令、会使用工具、能解决特定任务的模型。</p>\n<p>当模型作为 agent 工作时，它要在很多轮里行动：调用工具、读取结果、决定下一步做什么。<strong>Agentic 后训练</strong>就是把这些阶段用在 agent 上——于是训练必须考虑整条多轮交互的序列，而不是单个回答。</p></blockquote>\n<blockquote><p>本页组织为五个步骤，前面有一段导言。每一步都包含：方法示意图、一场直播或幻灯片、一篇解释思路的博客，以及相关文档。部分步骤还附了用该方法构建的示例项目。下面的表格总结了每一步：模型从什么信号中学习、用哪个 <abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> trainer、你需要准备什么。</p>\n<p>这些步骤的顺序沿袭直播系列 <strong>Training Agents</strong>（Hugging Face 的 YouTube 频道）。每一期讲一种后训练方法，并始终以\"训练一个编程 agent\"作为贯穿全程的示例。播放列表 <a href=\"https://www.youtube.com/playlist?list=PLo2EIpI_JMQvQZm-kVlz4wY1vWF0LBcf5\" target=\"_blank\" rel=\"noopener\">Post-training Agents</a> 包含四期节目加两场相关 workshop。</p></blockquote>\n<blockquote><p><strong>原文「Before you start」</strong>：如果你对 agent 不熟，建议先读 <em><a href=\"https://huggingface.co/blog/agent-glossary\" target=\"_blank\" rel=\"noopener\">Harness, Scaffold, and the AI Agent Terms Worth Getting Right</a></em>。如果你对后训练整体还不熟，<a href=\"https://huggingface.co/learn/llm-course\" target=\"_blank\" rel=\"noopener\"><abbr title=\"Large Language Model —— 大语言模型\">LLM</abbr> Course</a> 覆盖了这些方法背后的基础。想看总览，就看 <em>Train the agent, not just the model</em> 幻灯片。</p></blockquote>"
   },
   {
    "id": "s3",
    "title": "3. 六个词，一次说清",
    "short": "六个词，一次说清",
    "html": "<p>教程里所有混乱都来自这六个词。下面是我给的\"人话定义 + 反例\"。</p>\n<div class=\"tablewrap\"><table><thead><tr><th>词</th><th>人话定义</th><th>反面例子（别这么理解）</th></tr></thead><tbody><tr><td><strong>agent</strong></td><td>能<strong>多轮</strong>调用工具、看结果、再决定下一步的模型</td><td>一次性吐一段长文本的聊天模型（那是 chat，不是 agent）</td></tr><tr><td><strong>harness</strong>（外部壳/脚手架）</td><td>驱动 agent 的那套程序：决定何时调工具、怎么拼上下文、什么时候停</td><td>不是模型的一部分，是包在模型外面的循环</td></tr><tr><td><strong>scaffold</strong></td><td>与 harness 近义，更偏\"模型之外的工程结构\"</td><td>不是训练框架（<abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> 是 trainer，不是 scaffold）</td></tr><tr><td><strong>environment</strong></td><td>有状态的\"世界\"：能执行动作、记住变化、最后给结果</td><td>不是一个静态数据集；它有 <code>reset()</code> 和 <code>step()</code></td></tr><tr><td><strong>rollout</strong></td><td>一次完整采样：从初始状态到结束的一整条轨迹</td><td>不是\"一条 completion\"，是<strong>整个 episode</strong></td></tr><tr><td><strong>trace</strong></td><td>rollout 的记录：每轮的 token id、logprob、loss mask</td><td>不是纯文本日志，是<strong>能反传梯度的张量记录</strong></td></tr></tbody></table></div>\n<h3 id=\"s3-h1\">最容易混的一对：harness vs environment</h3>\n<div class=\"codewrap\"><pre><code>harness（壳）：决定\"下一步做什么\"\n  · 把工具列表塞进上下文\n  · 解析模型输出里的 tool_call\n  · 把工具结果拼回上下文\n  · 判断结束条件、压缩历史\n        │ 调用工具\n        ▼\nenvironment（环境）：决定\"做了会怎样\"\n  · 维护状态（文件系统、数据库、游戏盘面）\n  · 执行动作、返回观测\n  · 判定成败、给 reward</code></pre></div>\n<p>一句话：<strong>harness 是\"大脑的外壳\"，environment 是\"身体所在的世界\"</strong>。 在 <abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr>里：<code>environment_factory</code> 给你 environment；<code>HarnessRolloutWorker</code> 给你 harness。</p>"
   },
   {
    "id": "s4",
    "title": "4. 全景图：一次 agent rollout 到底发生了什么",
    "short": "全景图：一次 agent rollout 到底发生了什么",
    "html": "<div class=\"codewrap\"><pre><code>任务 prompt\n  │\n  ▼\nactor（模型本身，就是要训练的那份权重）\n  │   1 输出 tool_call\n  ▼\nharness（循环控制器：解析工具调用、执行、把结果拼回上下文）\n  │   2 执行\n  ▼\nenvironment（有状态的世界：文件、shell、浏览器、数据库……）\n  │   3 返回观测（stdout / 报错 / 页面内容）\n  ▼\n回到 actor 的上下文 ── 重复 1 2 3，直到模型说\"我完成了\"或步数用尽\n  │\n  ▼\n4 整条轨迹 + 一个结果\n  │\n  ├─ 有标准答案？──→ SFT（抄轨迹） / 蒸馏（抄分布）\n  └─ 只有分数？  ──→ GRPO（按分数改自己） / + 环境（按多轮结果改）</code></pre></div>\n<p><strong>关键认知</strong>：后训练算法本身没变（还是交叉熵、还是策略梯度）。 变的是<strong>\"监督信号从哪来\"</strong>，以及<strong>\"一条样本有多长\"</strong>（从 1 个回答 → 几十轮交互）。</p>"
   },
   {
    "id": "s5",
    "title": "5. 监督信号的谱系",
    "short": "监督信号的谱系",
    "html": "<p>这是整份教程最重要的一张表。五步就是在沿着这张表往右下走。</p>\n<div class=\"tablewrap\"><table><thead><tr><th></th><th>监督信号</th><th>密度</th><th>需要什么</th><th>学不到什么</th></tr></thead><tbody><tr><td><abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr></td><td>每个 token 的<strong>硬标签</strong></td><td>最密（每 token 1 个）</td><td>正确轨迹</td><td>不会纠错、不会探索</td></tr><tr><td>蒸馏</td><td>每个 token 的<strong>概率分布</strong></td><td>密（每 token 1 个分布）</td><td>教师模型</td><td>不会超过教师</td></tr><tr><td><abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr></td><td>每条回答<strong>一个分数</strong></td><td>稀（每序列 1 个）</td><td>奖励函数</td><td>需要大量采样</td></tr><tr><td><abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr> 环境</td><td>每次 <strong>episode 一个结果</strong></td><td>更稀（多轮 1 个）</td><td>环境 + 验证器</td><td>rollout 慢</td></tr><tr><td>Harness</td><td>真实 agent 跑完的<strong>结果</strong></td><td>最稀、最真实</td><td>harness + 沙箱</td><td>工程复杂、成本高</td></tr></tbody></table></div>\n<blockquote><p>一个直觉：<strong>信号越稀，模型越要靠自己\"试\"；信号越密，模型越只是在\"抄\"。</strong> 抄得快但不鲁棒，试得慢但能超越数据——这就是为什么真实流水线是 1 → 2 → 3/4 → 5 串起来的。</p></blockquote>"
   },
   {
    "id": "s6",
    "title": "6. 环境准备",
    "short": "环境准备",
    "html": "<h3 id=\"s6-h1\">6.1 依赖</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">python -m venv .venv &amp;&amp; source .venv/bin/activate    # Windows: .venv\\Scripts\\activate\n\npip install \"trl&gt;=1.16.0\" transformers datasets accelerate\npip install trl[vllm]              # 想用 vLLM 加速生成（3/4/5 步强烈建议）\npip install openenv-core           # 第 4 步：环境</code></pre></div>\n<blockquote><p>版本提示：第 4 步的 <code>environment_factory</code> 要求 <code>transformers&gt;=5.2.0</code>； 第 5 步的异步 rollout 走 <abbr title=\"NVIDIA Collective Communications Library —— NVIDIA 集合通信库\">NCCL</abbr>权重同步，vLLM 版本别太旧。</p></blockquote>\n<h3 id=\"s6-h2\">6.2 硬件</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>最小可行</th><th>舒服</th></tr></thead><tbody><tr><td>1 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr></td><td>1×16GB（0.5B + <abbr title=\"Quantized LoRA —— 量化低秩适配\">QLoRA</abbr>）</td><td>1×A100</td></tr><tr><td>2 蒸馏</td><td>1×24GB（学生 0.5B + 教师 1.5B）</td><td>1×A100</td></tr><tr><td>3 <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr></td><td>1×24GB（0.5B，G=8）</td><td>4–8×A100</td></tr><tr><td>4 环境</td><td>同 3，但要留 rollout 时间</td><td>8×A100</td></tr><tr><td>5 Harness</td><td><strong>≥2 卡</strong>（vLLM 与 trainer 分卡）</td><td>多机 + 沙箱配额</td></tr></tbody></table></div>\n<blockquote><p>手上没有 24GB 以上的卡？本章第 <strong>9～15 节</strong>是完整的云端方案：怎么选机器、代码怎么送上去（git / rsync）、开机器后的初始化脚本、单卡与双卡的具体命令、四个云上专属的坑、以及一次走完大概花多少钱。</p></blockquote>\n<h3 id=\"s6-h3\">6.3 三条命令先跑通</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 1) 确认能加载 chat template 和工具 schema\npython -c \"from transformers import AutoTokenizer; t=AutoTokenizer.from_pretrained('Qwen/Qwen3-0.6B'); print(t.chat_template[:200])\"\n\n# 2) 确认 TRL 装好\npython -c \"import trl; print(trl.__version__)\"\n\n# 3) 确认 GPU 可见\npython -c \"import torch; print(torch.cuda.device_count(), torch.cuda.get_device_name(0))\"</code></pre></div>"
   },
   {
    "id": "s7",
    "title": "7. 本教程的贯穿示例",
    "short": "本教程的贯穿示例",
    "html": "<p>为了让五步能横向对比，我们始终用<strong>同一个任务族</strong>：一个会读文件、改文件、跑测试的<strong>编程 agent</strong>。</p>\n<div class=\"codewrap\"><pre><code>工具集（tools）：\n  read_file(path: str) -&gt; str          读文件\n  write_file(path: str, content: str)  写文件\n  run_tests() -&gt; str                   跑测试，返回通过/失败\n\n任务：修好 calculator.py 里失败的测试</code></pre></div>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>这个任务怎么用</th></tr></thead><tbody><tr><td>1 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr></td><td>一条\"人类/强模型修好了\"的完整 transcript</td></tr><tr><td>2 蒸馏</td><td>只给任务描述，学生自己修，教师逐 token 打分</td></tr><tr><td>3 <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr></td><td>换成单轮可验证数学题（先学会奖励函数怎么写）</td></tr><tr><td>4 环境</td><td>真给一个有文件系统的环境，多轮交互，测试通过才得分</td></tr><tr><td>5 Harness</td><td>真跑 mini-swe-agent / claude-code，在沙箱里跑完整循环</td></tr></tbody></table></div>"
   },
   {
    "id": "s8",
    "title": "8. 怎么用这份教程",
    "short": "怎么用这份教程",
    "html": "<ol><li><strong>先读本文件</strong>（你正在读），把六个词记住。</li><li>进入第 1 章，<strong>先看「输入格式」那张表和 <abbr title=\"JSON Lines —— 按行存 JSON 的文本格式\">JSONL</abbr>示例</strong>——那是你实际要准备的东西。</li><li>再看「输入输出」小节，理解 <code>labels</code> 里的 <code>-100</code> 是怎么来的。</li><li>跑 <code>code/</code> 里的脚本，盯「产物与验收」里列的指标。</li><li>每章最后的「练习」做完再进下一章。</li></ol>"
   },
   {
    "id": "s9",
    "title": "9. 先选机器",
    "short": "先选机器",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>你要做的事</th><th>机器</th><th>大致价格</th><th>说明</th></tr></thead><tbody><tr><td>跑通 ① <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr>、② 蒸馏</td><td>1×RTX 4090 24G</td><td>¥1.5–2 / 小时</td><td>0.5–0.6B 全参够用</td></tr><tr><td>跑通 ③ <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr>（小规模）</td><td>1×RTX 4090 24G</td><td>同上</td><td><code>num_generations</code> 降到 4～8</td></tr><tr><td>跑通 ④ 环境（长 episode）</td><td>1×A100 40G</td><td>¥5–6 / 小时</td><td>8k token 预算不容易爆</td></tr><tr><td>⑤ Harness（模型 ≤1.7B）</td><td>2×RTX 4090 24G</td><td>¥3–4 / 小时</td><td>vLLM 与 trainer 分卡</td></tr><tr><td>⑤ Harness（<code>Qwen3-4B</code>）</td><td>1×A800 80G 或 2×A100</td><td>¥9 / 小时起</td><td>trainer 侧全参要 48–64GB 显存</td></tr></tbody></table></div>\n<p>选择的三个要点：</p>\n<ol><li><strong>先单卡，再双卡</strong>。前四步单卡全包，别为了\"以后要用\"多付双卡的钱。</li><li><strong>显存优先于算力</strong>。这些实验是显存敏感、算力不敏感；4090 比同价位的 A10 划算。</li><li><strong>能用子集就别用全量</strong>。<code>trl-lib/DeepMath-103K</code> 全量跑一轮，官方口径是 8×A100 约一天；你裁到 3k 条 prompt，单卡几小时就够看曲线动。</li></ol>"
   },
   {
    "id": "s10",
    "title": "10. 把代码送上去",
    "short": "把代码送上去",
    "html": "<p>三条路，按省事程度排：</p>\n<h3 id=\"s10-h1\">10.1 git（推荐：改一次推一次，云上 <code>git pull</code> 就同步）</h3>\n<p>本地仓库（第一次）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">cd \"F:\\study\\AI\\Agentic Post-training\"     # 或你的实际路径\ngit init -b main\ngit add -A\ngit commit -m \"agentic post-training 教程：5 步 + 网页版\"\ngit remote add origin https://github.com/&lt;你的账号&gt;/agentic-post-training.git\ngit push -u origin main</code></pre></div>\n<p>云上：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">git clone https://github.com/&lt;你的账号&gt;/agentic-post-training.git\ncd agentic-post-training</code></pre></div>\n<p>私有仓库用 <abbr title=\"HyperText Transfer Protocol Secure —— 加密的 HTTP\">HTTPS</abbr>时要输 <strong>Personal Access Token</strong>（GitHub：Settings → Developer settings → Tokens，勾 <code>repo</code>），不是登录密码；或者配 SSH key（<code>ssh-keygen -t ed25519</code>，把 <code>~/.ssh/id_ed25519.pub</code> 贴进 GitHub → SSH keys）。</p>\n<h3 id=\"s10-h2\">10.2 scp / rsync（不建仓库，一次拷完）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">rsync -avz --exclude ckpt --exclude .venv --exclude __pycache__ \\\n  ./ root@&lt;云主机IP&gt;:/root/work/agentic/</code></pre></div>\n<p>Windows 没装 rsync 就用 <code>scp -r</code>，或者 WinSCP 拖文件夹。</p>\n<h3 id=\"s10-h3\">10.3 云平台自带的上传（最省事，适合一次性）</h3>\n<p>AutoDL / 阿里云 PAI / 恒源云的控制台都有 JupyterLab，直接把整个文件夹压成 zip 拖上去，在终端 <code>unzip</code> 即可。</p>\n<h3 id=\"s10-h4\">10.4 仓库里别提交什么</h3>\n<p>各章目录下的 <code>ckpt/</code>（几百 MB 到几十 GB）、<code>.venv/</code>、<code>__pycache__/</code>、模型缓存、<code>_site/_preview.html</code> 这类临时件。工作区根目录已经放了 <code>.gitignore</code>，覆盖这些。</p>\n<blockquote><p>仓库真正的体积只有约 400KB —— 8 个 README + 16 个示例文件 + 一个 148KB 的单文件网页。<code>index.html</code> 一起提交，但不依赖任何托管服务：想要网页版的人自己下载 <code>index.html</code>，双击就能看，不需要服务器、不需要联网。</p>\n<p>学习进度（打勾）存在各自浏览器的 localStorage 里，<strong>天然按人分开</strong>：你把 <code>index.html</code> 发给十个人，十个人各自记各自的进度，互不影响，也不需要账号。想重来就点页面左下角「重置进度」。</p></blockquote>"
   },
   {
    "id": "s11",
    "title": "11. 开机器后 10 分钟",
    "short": "开机器后 10 分钟",
    "html": "<p>每台新实例照抄这一段。<strong>先看方案 A——它不下载 torch，十分钟内就能开跑。</strong></p>\n<h3 id=\"s11-h1\">11.1 方案 A：克隆镜像自带的 base（推荐，零大文件下载）</h3>\n<p><strong>先确认 base 里真有 torch</strong>（有些镜像是干净的 miniconda，base 只有 1GB，没装 torch）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">conda run -n base python -c \"import torch;print(torch.__version__, torch.version.cuda)\" 2&gt;&amp;1 | tail -2</code></pre></div>\n<p>打出版本号才走方案 A；报 <code>ModuleNotFoundError</code> 就直接跳到 11.2（但环境仍要建到数据盘，见 11.6）。</p>\n<p>确认有 torch 之后，克隆一份 base（硬链接，几秒完成，几乎不占磁盘）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">conda create -n postrl --clone base -y\nconda activate postrl\n\nexport HF_ENDPOINT=https://hf-mirror.com\nexport HF_HOME=/root/autodl-tmp/hf\n\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple -U pip\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple \\\n  \"trl&gt;=1.16.0\" datasets accelerate openenv-core</code></pre></div>\n<p>要补的只有几十 MB 的纯 Python 包，<code>torch</code> 一个字节都不用下。</p>\n<p><strong>别写 <code>trl[vllm]</code></strong>：<code>[vllm]</code> 会让 pip 重装 vllm，并把它 pin 的 torch 一起换掉，于是又回到 <code>cuda=False</code> 那个坑（见 11.4）。</p>\n<h3 id=\"s11-h2\">11.2 方案 B：空环境自己装 torch（走国内镜像，别用官方源）</h3>\n<p>如果就是想从零开始：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">conda create -n postrl python=3.11 -y\nconda activate postrl\n\nexport HF_ENDPOINT=https://hf-mirror.com\nexport HF_HOME=/root/autodl-tmp/hf\n\nnvidia-smi | head -4        # 右上角 \"CUDA Version: 12.8\" 就是要匹配的版本\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple -U pip</code></pre></div>\n<p>torch 走官方源在国内往往只有几十 KB/s。下面两个国内镜像都有 cu128 完整目录，<code>torch-2.11.0+cu128-cp311</code> 的 wheel 约 820MB：</p>\n<blockquote><p><strong>版本上限</strong>：cu128 目前最高只到 <strong>torch 2.11.0</strong>。pip 从 PyPI 装到的 2.13 是 cu130 构建，所以「降到 cu128」必然同时把 torch 版本降到 2.11——这是正常的，不是装错了。</p></blockquote>\n<p><strong>推荐：把南大索引当 <code>--index-url</code> 用</strong>（它是标准 PEP 503 索引，pip 能顺着页面找到 wheel）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">pip install \"torch==2.11.0+cu128\" \\\n  --index-url https://mirror.nju.edu.cn/pytorch/whl/cu128 \\\n  --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple</code></pre></div>\n<p><code>--extra-index-url</code> 是用来补 <code>nvidia-*</code>、<code>sympy</code> 这些依赖的。版本号写死成 <code>2.11.0+cu128</code>，pip 就不会去拿清华源里更高版本的 cu130 包。</p>\n<p><strong>如果直链下 403</strong>：阿里云的 <code>pytorch-wheels</code> 会对部分 IP 直接返回 <code>403 Forbidden</code>（pip 和 curl 都一样），这不是你写错了。两个办法：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 办法一：走南大直链（同一份文件）\nwget -c \"https://mirror.nju.edu.cn/pytorch/whl/cu128/torch-2.11.0%2Bcu128-cp311-cp311-manylinux_2_28_x86_64.whl\" \\\n  -O \"/root/torch-2.11.0+cu128.whl\"\npip install \"/root/torch-2.11.0+cu128.whl\" -i https://pypi.tuna.tsinghua.edu.cn/simple\n\n# 办法二：带浏览器 UA 从阿里云下（403 多半是 UA/防盗链判定）\ncurl -L -C - -A \"Mozilla/5.0\" -o \"/root/torch-2.11.0+cu128.whl\" \\\n  \"https://mirrors.aliyun.com/pytorch-wheels/cu128/torch-2.11.0%2Bcu128-cp311-cp311-manylinux_2_28_x86_64.whl\"\npip install \"/root/torch-2.11.0+cu128.whl\" -i https://pypi.tuna.tsinghua.edu.cn/simple</code></pre></div>\n<p>先本地存成 <code>.whl</code> 再 <code>pip install 文件</code> 还有个好处：断了能续传，不会每次重下 820MB。</p>\n<p>还嫌慢就上多线程下载器：<code>aria2c -x16 -s16 &lt;上面的 url&gt; -o /root/torch.whl</code>，下完 <code>pip install /root/torch.whl</code>。</p>\n<p>镜像可用性（2026-10 实测）：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>镜像</th><th><code>pytorch-wheels/cu128</code></th><th>说明</th></tr></thead><tbody><tr><td>阿里云 <code>mirrors.aliyun.com/pytorch-wheels/</code></td><td>✅ 200 / ⚠️ 403</td><td>目录可浏览；<strong>部分 IP 直链下 wheel 会 403</strong>，见上面两个办法</td></tr><tr><td>南大 <code>mirror.nju.edu.cn/pytorch/whl/</code></td><td>✅ 200</td><td>完整 PEP 503 索引，可直接当 <code>--index-url</code> 用（推荐）</td></tr><tr><td>上交 <code>mirror.sjtu.edu.cn</code></td><td>⚠️ 301</td><td>能进，但要跟随跳转，且没有 <code>torch/</code> 子索引</td></tr><tr><td>清华 / 南大 / 北外 / CERNET / 中科大</td><td>❌ 404</td><td>只镜像 anaconda 与 PyPI，没有 pytorch-wheels</td></tr></tbody></table></div>\n<p>按驱动选目录：</p>\n<div class=\"tablewrap\"><table><thead><tr><th><code>nvidia-smi</code> 右上角</th><th>用哪个目录</th></tr></thead><tbody><tr><td><abbr title=\"Compute Unified Device Architecture —— 英伟达 GPU 计算平台\">CUDA</abbr> Version: 12.8</td><td><code>https://mirror.nju.edu.cn/pytorch/whl/cu128/</code></td></tr><tr><td class=\"num\">12.4</td><td><code>.../cu124/</code></td></tr><tr><td class=\"num\">12.1</td><td><code>.../cu121/</code></td></tr><tr><td>13.0 以上</td><td><code>.../cu130/</code></td></tr></tbody></table></div>\n<p>装错的典型报错（<strong>这条不是你代码的问题</strong>）：</p>\n<div class=\"codewrap\"><pre><code>UserWarning: CUDA initialization: The NVIDIA driver on your system is too old\n(found version 12080) ... torch 2.13.0+cu130  cuda=False</code></pre></div>\n<p>意思是 torch 是 cu130 编的、驱动只到 12.8。换成对应目录的 wheel 重装即可，不用动驱动：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 0) 先看清楚现在装了什么：vllm 与 torch 是强绑定，换 torch 前必须先确认\npip list | grep -Ei '^(torch|vllm|trl|transformers) '\npip show vllm 2&gt;/dev/null | grep -i requires     # 它会写死 torch==某个版本\n\n# 1) 换 wheel（就地修，不用删环境）\npip uninstall -y torch torchvision torchaudio\npip install \"https://mirrors.aliyun.com/pytorch-wheels/cu128/torch-2.11.0%2Bcu128-cp311-cp311-manylinux_2_28_x86_64.whl\" \\\n  -i https://pypi.tuna.tsinghua.edu.cn/simple\npython -c \"import torch;print(torch.__version__, torch.cuda.is_available())\"   # 要 True\npip check          # 看依赖有没有被这次替换弄坏</code></pre></div>\n<p>如果上一步发现 vllm 写死了别的 torch 版本，两条路选一条：把 vllm 一起换到匹配你 wheel 的版本，或者<strong>先把 vllm 卸掉</strong>——第 1、2 步根本用不到它，等到第 3～5 步再装。</p>\n<p><strong>要 vllm 的话最后再装</strong>（它只用于第 3～5 步加速）：<code>pip install -i https://pypi.tuna.tsinghua.edu.cn/simple vllm</code>，装完<strong>重跑 11.3 自检</strong>——vllm 会把 torch 换成它 pin 的版本，如果又变成高版本 <abbr title=\"Compute Unified Device Architecture —— 英伟达 GPU 计算平台\">CUDA</abbr> 编的，就按上面的办法把同版本号的 cu128 wheel 装回去。</p>\n<p>第 4 步的 <code>environment_factory</code> 要求 <code>transformers&gt;=5.2.0</code>，④ 报版本不够时再单独升一行 <code>pip install -U \"transformers&gt;=5.2.0\"</code>。</p>\n<h3 id=\"s11-h3\">11.3 装完自检（两条路线都跑这三行）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">python -c \"import torch;print(torch.__version__, torch.version.cuda, torch.cuda.is_available())\"\npython -c \"import transformers, trl;print(transformers.__version__, trl.__version__)\"\npython -c \"from transformers import AutoTokenizer;t=AutoTokenizer.from_pretrained('Qwen/Qwen3-0.6B');print('template ok', len(t.chat_template))\"</code></pre></div>\n<p>第一行必须是 <code>True</code>；<code>torch.version.cuda</code> 要 ≤ <code>nvidia-smi</code> 那个版本号。</p>\n<p>第 4 步的 <code>environment_factory</code> 要求 <code>transformers&gt;=5.2.0</code>，④ 报版本不够时再单独升一行 <code>pip install -U \"transformers&gt;=5.2.0\"</code>。</p>\n<p>新终端会丢两样东西（环境和镜像），一次性写进 <code>~/.bashrc</code> 就不必每次重敲：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">echo 'source /root/miniconda3/etc/profile.d/conda.sh &amp;&amp; conda activate postrl' &gt;&gt; ~/.bashrc\necho 'export HF_ENDPOINT=https://hf-mirror.com' &gt;&gt; ~/.bashrc\necho 'export HF_HOME=/root/autodl-tmp/hf' &gt;&gt; ~/.bashrc</code></pre></div>\n<p>漏掉第一行的症状是 <code>pip install</code> 装进了 base（<code>which python</code> 指到 <code>/usr/bin</code> 或 conda base），漏掉后两行的症状是模型下载 <code>ConnectionError</code> / <code>Timeout</code>。</p>\n<h3 id=\"s11-h4\">11.4 为什么必须建环境</h3>\n<ol><li><strong><code>trl[vllm]</code> 会顺手换掉 torch</strong>。vLLM 对 torch 版本卡得很死，pip 装它时会覆盖镜像里那份预编译的 torch+<abbr title=\"Compute Unified Device Architecture —— 英伟达 GPU 计算平台\">CUDA</abbr>，症状是自检里 <code>torch.cuda.is_available()</code> 变成 <code>False</code>，或 <abbr title=\"NVIDIA Collective Communications Library —— NVIDIA 集合通信库\">NCCL</abbr>报 <code>unhandled cuda error</code>。真遇到了就<strong>降 vllm 版本去匹配镜像 torch</strong>，别反过来升 torch。</li><li><strong>依赖会打架</strong>：教程要较新的 <code>transformers</code>，你别的项目可能锁在旧版本。</li><li><strong>实例一换就没了</strong>，有 conda 环境 + <code>requirements.txt</code>（<code>pip freeze &gt; requirements.txt</code>）才谈得上复现。</li></ol>\n<p>方案 B 就是这条路：代价是几 GB 的 torch 下载（走阿里云镜像大约几分钟）；好处是完全隔离，同机跑多个互斥项目也不打架。不想付这个代价就用方案 A 的 <code>conda create --clone base</code>，隔离性一样有，下载量接近零。</p>\n<p>本地 Windows / macOS 同样用 conda：<code>conda create -n postrl python=3.11 -y &amp;&amp; conda activate postrl</code>。</p>\n<h3 id=\"s11-h5\">11.5 AutoDL 学术加速：开与关</h3>\n<p>AutoDL 的「学术加速」是一个只会对 <strong>github.com / githubusercontent.com / githubassets.com / huggingface.co</strong> 生效的代理，用来解决 <code>git clone</code> 和直连 HF 慢的问题。</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 开（只对当前这个终端有效，新开终端要重新执行）\nsource /etc/network_turbo\n\n# 关\nunset http_proxy &amp;&amp; unset https_proxy</code></pre></div>\n<p>两点要注意：</p>\n<ol><li><strong>它是环境变量代理</strong>：<code>source</code> 之后 <code>env | grep -i proxy</code> 能看到 <code>http_proxy</code> / <code>https_proxy</code>，新终端失效需重新 <code>source</code>。</li><li><strong>只在需要 <code>git clone</code> 时开，用完就关</strong>：官方说过它会影响正常网络，留着它跑 <code>pip install</code>（清华源）或 <code>scp</code> 反而变慢甚至失败；拉模型走 ② 的 <code>HF_ENDPOINT</code> 镜像就够了，两个别同时开。</li></ol>\n<p>如果执行 <code>source /etc/network_turbo</code> 报 <code>No such file or directory</code>，说明你所在区域不支持该代理，那就走镜像站 + <code>ghproxy.link</code>（地址会变，进站点看当前可用的）。</p>\n<h3 id=\"s11-h6\">11.6 报 <code>[Errno 28] No space left on device</code> 怎么办</h3>\n<p>装 torch 时最常见，不是网络问题，是<strong>系统盘（<code>/root</code> 那 30G）被填满</strong>了。 一个 cu128 的 torch 要：wheel 本体 820MB + 解压后 2.6GB + 一堆 <code>nvidia-*-cu12</code> 依赖约 4GB + pip 缓存 1～2GB ≈ <strong>7～8GB</strong>。</p>\n<p><code>pip</code> 的缓存往往是最大的一块：装过几次 torch，<code>/root/.cache/pip</code> 轻松到 10GB 以上（每次 820MB 的 wheel 都会留一份）。所以<strong>第一步永远是清缓存</strong>。</p>\n<p>先看清楚谁在吃盘：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">df -h / /root/autodl-tmp              # 系统盘 vs 数据盘\ndu -sh /root/* 2&gt;/dev/null | sort -h | tail -6\ndu -sh /root/miniconda3/envs/*        # 是不是环境建在系统盘了\ndu -sh \"$(pip cache dir)\" 2&gt;/dev/null # pip 缓存</code></pre></div>\n<p>三条治法，按顺序试：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 1) 清缓存 + 卸掉装了一半的 torch\npip cache purge\nconda clean -a -y\nrm -rf /root/.cache/pip /root/tmp/*.whl\npip uninstall -y torch torchvision torchaudio\n\n# 2) 新环境直接建到数据盘（路径用 -p 指定，不走 miniconda3/envs）\nconda create -p /root/autodl-tmp/envs/postrl python=3.11 -y\nconda activate /root/autodl-tmp/envs/postrl\n\n# 3) 缓存和临时目录也搬到数据盘，再装（--no-cache-dir 不再留副本）\nexport PIP_CACHE_DIR=/root/autodl-tmp/.cache/pip\nexport TMPDIR=/root/autodl-tmp/tmp\nmkdir -p \"$PIP_CACHE_DIR\" \"$TMPDIR\"\npip install --no-cache-dir \"torch==2.11.0+cu128\" \\\n  --index-url https://mirror.nju.edu.cn/pytorch/whl/cu128 \\\n  --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple</code></pre></div>\n<p>盘上的预算大致是：torch 全家桶解压后约 6.5GB（其中 4GB 是 nvidia 的库），模型缓存 <code>HF_HOME=/root/autodl-tmp/hf</code> 另算（0.6B 约 1.2GB，1.7B 约 3.4GB）。</p>\n<p>最省的做法还是 <strong>11.1 的克隆 base</strong>：镜像自带的 torch 本来就按这张卡的驱动编好，<code>--clone</code> 用硬链接，几秒完成且几乎不占额外空间，一个字节的 wheel 都不用下。</p>"
   },
   {
    "id": "s12",
    "title": "12. 每一步怎么跑",
    "short": "每一步怎么跑",
    "html": "<h3 id=\"s12-h1\">12.1 先验证管线，再真训练</h3>\n<p><code>data/</code> 里的 jsonl 只有 2～3 条，是给你<strong>解剖数据格式</strong>用的，不是训练数据。 所以每条命令分两段：先小跑验证管线，再换官方数据集真训。</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 全部在仓库根目录执行（不用 cd 进 code/）\npython 01-监督微调-SFT/code/train_sft.py --inspect          # 只看数据链路，不需 GPU\npython 01-监督微调-SFT/code/train_sft.py --dataset trl-lib/Capybara --limit 2000 --eval-size 100\n\npython 02-蒸馏/code/train_distill.py --inspect\npython 02-蒸馏/code/train_distill.py --dataset trl-lib/ultrafeedback-prompt --limit 3000 --eval-size 100\n\npython 03-强化学习-GRPO/code/train_grpo.py --inspect\npython 03-强化学习-GRPO/code/train_grpo.py --dataset trl-lib/DeepMath-103K --limit 3000 --eval-size 100\n\npython 04-RL环境/code/train_grpo_env.py</code></pre></div>\n<p>脚本按自己的位置算出所在章节，所以<strong>从哪个目录启动都能找到 <code>data/</code></strong>，产物也只会落在本章的 <code>runs/</code> 与 <code>ckpt/</code>（例如 <code>01-监督微调-SFT/runs/sft/</code>），不会往仓库根堆。 加 <code>--dataset</code> 后数据从 Hugging Face 下载，记得 <code>export HF_ENDPOINT=https://hf-mirror.com</code>。</p>\n<p>每章「怎么判断真的学会了」看哪个指标，README 里都有一张表（<abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 看 held-out -ln p、蒸馏看 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>、<abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr>看 pass@1）。</p>\n<h3 id=\"s12-h2\">12.2 用 tmux 防断线</h3>\n<p>网页终端一断，前台进程就死。所有超过 5 分钟的任务都这样开：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">tmux new -s train          # 新建会话\npython 03-强化学习-GRPO/code/train_grpo.py     # 在里面跑\n# Ctrl+B 然后 D 脱离；下次 tmux attach -t train 回到现场</code></pre></div>\n<p>临时任务用 <code>nohup python 03-强化学习-GRPO/code/train_grpo.py &gt; log.txt 2&gt;&amp;1 &amp;</code> 也行。</p>\n<h3 id=\"s12-h3\">12.3 双卡（⑤ Harness）</h3>\n<p>开两个 tmux 窗口：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 窗口 1：vLLM 生成服务，占 0 号卡\nCUDA_VISIBLE_DEVICES=0 VLLM_SERVER_DEV_MODE=1 \\\nvllm serve Qwen/Qwen3-0.6B \\\n  --max-model-len 4096 \\\n  --logprobs-mode processed_logprobs \\\n  --weight-transfer-config '{\"backend\":\"nccl\"}'</code></pre></div>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 窗口 2：训练，占 1 号卡（参数仍是仓库根目录下的脚本路径）\nCUDA_VISIBLE_DEVICES=1 accelerate launch 05-Harness与规模化/code/train_async_grpo.py</code></pre></div>\n<p>脚本里的 <code>vllm_server_url</code> 默认就是 <code>http://localhost:8000</code>（见 <code>train_async_grpo.py</code> 顶部注释），换成别的端口要同步改。</p>\n<h3 id=\"s12-h4\">12.4 训练时看 TensorBoard（AutoDL 的 AutoPanel）</h3>\n<p>AutoDL 实例详情页右侧有个 <strong>AutoPanel</strong>，里面的 TensorBoard 只读一个固定目录：<code>/root/tf-logs</code>。 我们的脚本默认不写 TensorBoard（<code>report_to=[]</code>），要看就加 <code>--tensorboard</code>：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 1）确认有 tensorboard（镜像一般自带；没有就装，几 MB）\npython -c \"import tensorboard, sys; print('ok', tensorboard.__version__)\"\n\n# 2）开训时加 --tensorboard，日志落在 &lt;章节&gt;/runs/&lt;x&gt;/tb/\npython 01-监督微调-SFT/code/train_sft.py \\\n  --dataset trl-lib/Capybara --limit 2000 --eval-size 100 --tensorboard\n\n# 3）把它挂到 AutoPanel 认的目录（软链接，不占空间、不动代码）\nmkdir -p /root/tf-logs\nln -sfn /root/Agentic-Post-training/01-监督微调-SFT/runs/sft/tb /root/tf-logs/sft</code></pre></div>\n<p>然后：<strong>AutoDL 控制台 → 实例 → AutoPanel → TensorBoard → 打开</strong>。它会自动拉起一个 TensorBoard 进程（默认 6006 端口），页面里就能看到 <code>loss</code>、<code>learning_rate</code>、<code>grad_norm</code>、<code>eval/loss</code> 等曲线， 横轴是 step，可以缩放、可以对比多次运行。</p>\n<p>跑第 2、3 章时各挂一个子目录，TensorBoard 会当成不同的 run 并排比较：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">ln -sfn /root/Agentic-Post-training/02-蒸馏/runs/distill/tb /root/tf-logs/distill\nln -sfn /root/Agentic-Post-training/03-强化学习-GRPO/runs/grpo/tb   /root/tf-logs/grpo</code></pre></div>\n<p>看不到东西时按顺序查：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>现象</th><th>原因</th><th>处理</th></tr></thead><tbody><tr><td>面板一直「等待日志」</td><td>目录挂错了</td><td><code>ls -l /root/tf-logs/</code>，应能看到 <code>sft -&gt; .../runs/sft/tb</code></td></tr><tr><td>目录空的</td><td>没加 <code>--tensorboard</code>，或还没跑满 1 步</td><td>加了重跑；<code>logging_steps=1</code>，第 1 步就有数据</td></tr><tr><td>页面能开但没曲线</td><td>AutoPanel 缓存了旧的空目录</td><td>面板里点重启 TensorBoard，或换个子目录名</td></tr><tr><td>报 <code>TypeError: SFTConfig.__init__() got an unexpected keyword argument 'logging_dir'</code></td><td>云端还是旧脚本</td><td>同步代码（<code>git pull</code>，或 <code>scp</code> 覆盖本章 <code>code/</code> 下的 <code>common.py</code> / <code>*_trainer.py</code> / <code>train_*.py</code>）；新版是在构造完 config 之后才赋值 <code>args.logging_dir</code>，不再当构造参数传</td></tr><tr><td>TensorBoard 里没数据，但启动目录（仓库根）下冒出个 <code>runs/</code></td><td>transformers 5.x 的 TensorBoardCallback <strong>不读</strong> <code>args.logging_dir</code>，只认环境变量 <code>TENSORBOARD_LOGGING_DIR</code>；没设就退到 <code>os.path.join(output_dir, \"runs/&lt;日期&gt;_&lt;主机名&gt;\")</code>，而这是个相对路径</td><td>新版脚本已自动设该变量；旧脚本可临时 <code>export TENSORBOARD_LOGGING_DIR=$PWD/01-监督微调-SFT/runs/sft/tb</code> 再跑</td></tr></tbody></table></div>\n<p>两种看法不冲突：<code>--tensorboard</code> 给浏览器看交互曲线，<code>--plot-every 20</code> 顺手写一张 <code>loss.svg</code> 快照 （断线、离线、发群里都方便）。只想留一个就 <code>--plot-every 0</code> 或去掉 <code>--tensorboard</code>。</p>\n<p>想在本地看（不经过 AutoPanel）：先 <code>ssh -L 6006:localhost:6006 root@&lt;ip&gt;</code>，然后在云端跑 <code>tensorboard --logdir 01-监督微调-SFT/runs/sft/tb --port 6006</code>，浏览器开 <code>http://localhost:6006</code>。</p>"
   },

    "id": "s13",
    "title": "13. 云上四个坑",
    "short": "云上四个坑",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>现象</th><th>原因</th><th>处理</th></tr></thead><tbody><tr><td>下载模型 <code>ConnectionError</code> / <code>Timeout</code></td><td>没设 <code>HF_ENDPOINT</code>，或设了但没重开终端</td><td><code>export HF_ENDPOINT=https://hf-mirror.com</code>，写进 <code>~/.bashrc</code></td></tr><tr><td>第 5 步 <abbr title=\"NVIDIA Collective Communications Library —— NVIDIA 集合通信库\">NCCL</abbr> 初始化卡住或报 P2P 错</td><td>消费级 4090 走 PCIe，没有 NVLink/P2P</td><td>能跑但慢：把 <code>weight_sync_steps</code> 调大（少同步几次）；实在不行换 A100/A800</td></tr><tr><td><code>openenv</code> / Harbor 连不上沙箱</td><td>e2b、Daytona 要注册并绑卡</td><td>学习阶段先用 <code>sandbox=None</code> + 本地 Docker，只保留\"完整 agent 循环\"这一点</td></tr><tr><td>磁盘写满，训练中途报 <code>No space left</code></td><td>系统盘 30G，模型 + checkpoint 一下就满</td><td><code>HF_HOME</code> 指到数据盘；<code>save_strategy</code> 别用 <code>steps</code> 高频存</td></tr></tbody></table></div>\n<p>排错时先看这三条：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">df -h                                  # 磁盘\nnvidia-smi                             # 显存有没有被别人占、是不是掉卡\ntail -f log.txt                        # 有没有 HF_ENDPOINT 相关的报错</code></pre></div>"
