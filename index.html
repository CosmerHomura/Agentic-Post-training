    "id": "s14",
    "title": "14. 花多少钱",
    "short": "花多少钱",
    "html": "<p>按上面的价格，一个人完整走一遍的账单大概是这样：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>阶段</th><th>机器</th><th>时长</th><th>费用</th></tr></thead><tbody><tr><td>①～④ 跑通示例（本仓库的小数据）</td><td>1×4090</td><td>1–2 小时</td><td>¥3–5</td></tr><tr><td>①～④ 换成自己的真数据（几千条）</td><td>1×4090</td><td>6–10 小时</td><td>¥15–25</td></tr><tr><td>⑤ 双卡跑 0.6B/1.7B，摸通异步流程</td><td>2×4090</td><td>6–8 小时</td><td>¥25–35</td></tr><tr><td>⑤ 双卡 A100 + 4B 模型</td><td>2×A100</td><td>1 天</td><td>¥250–400</td></tr></tbody></table></div>\n<p>省钱的四个习惯：</p>\n<ol><li><strong>先小后大</strong>：先用示例数据确认脚本能跑通，再换真数据；别一上来就全量数据集。</li><li><strong>随时存 checkpoint</strong>：<code>save_strategy=\"epoch\"</code> + 手动 <code>trainer.save_model()</code>，机器被回收也不白跑。</li><li><strong>用完就关</strong>：按量计费关机不再收 <abbr title=\"Graphics Processing Unit —— 图形处理器\">GPU</abbr> 费（只收少量存储费），别让它空转一夜。</li><li><strong>模型选小的</strong>：<code>Qwen3-0.6B</code> 和 <code>Qwen2.5-0.5B</code> 足以看清 loss、奖励、<code>mean_token_accuracy</code> 的变化趋势；4B 只在你想验证\"规模化后行为是否还一致\"时再上。</li></ol>"
   },
   {
    "id": "s15",
    "title": "15. 上线前检查清单",
    "short": "上线前检查清单",
    "html": "<ul><li class=\"task\"><code>nvidia-smi</code> 能看到卡，显存 ≥ 24GB（双卡时两张都在）</li><li class=\"task\"><code>HF_ENDPOINT</code> 已设且在 <code>~/.bashrc</code> 里</li><li class=\"task\"><code>HF_HOME</code> 指向数据盘，<code>df -h</code> 剩余 ≥ 50GB</li><li class=\"task\"><code>trl</code>、<code>transformers</code> 版本符合（第 4 步要 <code>transformers&gt;=5.2.0</code>）</li><li class=\"task\">在 <code>code/</code> 目录里能读到 <code>../data/*.jsonl</code></li><li class=\"task\">长任务都在 <code>tmux</code> 里</li><li class=\"task\">知道 checkpoint 会存在哪、怎么拉回本地（<code>scp -r root@&lt;ip&gt;:/path/ckpt .</code>）</li><li class=\"task\">知道这次跑完大概花多少钱、什么时候该关机</li></ul>"
   }
  ]
 },
 {
  "id": "ch2",
  "num": "01",
  "title": "01 · 监督微调 SFT",
  "heading": "01 · 监督微调（SFT）",
  "subtitle": "把正确轨迹背下来",
  "sections": [
   {
    "id": "s1",
    "title": "1. 一句话定义",
    "short": "一句话定义",
    "html": "<p><strong>把\"一个更强的模型是怎样一步步解决任务\"的完整录像，当成标准答案让它背下来。</strong></p>\n<p>这是整条后训练流水线的<strong>第 1 步</strong>，也是后面所有步骤的地基：没有 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr>，模型连\"工具调用\"的格式都不会写，<abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr>阶段根本无从采样。</p>"
   },
   {
    "id": "s2",
    "title": "2. 原文译文 · 1. Supervised fine-tuning (SFT)",
    "short": "原文译文 · 1. Supervised fine-tuning (SFT)",
    "html": "<blockquote><p>模型学会复制 <strong>agent 轨迹</strong>——也就是 agent 解决一个任务的过程记录，其中包含每一次工具调用及其结果，通常由更强的模型产生。这一步便宜且稳定。</p>\n<p>模型只会见到<strong>正确的</strong>轨迹，永远见不到它自己的尝试。当它在解题过程中犯了错，它并没有学过如何从错误中恢复。<strong>On-policy 蒸馏</strong>和 <strong><abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr></strong> 通过在模型自己的输出上训练来解决这个问题。</p></blockquote>\n<h3 id=\"s2-h1\">原文推荐资源</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>Watch</td><td><a href=\"https://www.youtube.com/watch?v=rNgUoH7Wbv8\" target=\"_blank\" rel=\"noopener\">Training Agents 1: fine-tune a coding agent</a>（<a href=\"https://huggingface.co/burtenshaw/gemma4-pi-mono-youtube-livestream-1-scripts\" target=\"_blank\" rel=\"noopener\">代码</a>）</td></tr><tr><td>Read</td><td><a href=\"https://x.com/ben_burtenshaw/status/2067615361428545566\" target=\"_blank\" rel=\"noopener\">Training Agents: Class 1, <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> from scratch</a></td></tr><tr><td>Docs</td><td><a href=\"https://huggingface.co/docs/trl/sft_trainer\" target=\"_blank\" rel=\"noopener\"><abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> Trainer</a></td></tr></tbody></table></div>"
   },
   {
    "id": "s3",
    "title": "3. 训练信号从哪来",
    "short": "训练信号从哪来",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>环节</th><th>内容</th></tr></thead><tbody><tr><td><strong>输入</strong></td><td><code>(system prompt + 工具列表 + 用户任务 + 完整正确轨迹)</code></td></tr><tr><td><strong>模型产出</strong></td><td>每个位置的下一个 token 分布</td></tr><tr><td><strong>监督信号</strong></td><td>数据里那一个<strong>确定的 token</strong>（硬标签，one-hot）</td></tr><tr><td><strong>损失</strong></td><td>只在 assistant 的 token 上算的交叉熵：<code>-Σ log p(y_t)</code></td></tr><tr><td><strong>产物</strong></td><td>一个会模仿该轨迹（格式、顺序、风格）的模型</td></tr></tbody></table></div>\n<div class=\"codewrap\"><pre><code>数据：   \"先 read_file → 看到 bug → write_file → run_tests → 通过\"\n                    │\n                    ▼\n训练：   强制模型在每个位置都预测出数据里的那个 token\n                    │\n                    ▼\n效果：   模型学会「这个任务该按这个顺序、用这些工具、这样写参数」\n         但没学会「如果我刚才猜错了怎么办」（因为数据里从没有错误）</code></pre></div>"
   },
   {
    "id": "s4",
    "title": "4. 数据格式：一条 agent 轨迹长什么样",
    "short": "数据格式：一条 agent 轨迹长什么样",
    "html": "<h3 id=\"s4-h1\">4.1 SFTTrainer 支持的 4 种数据集格式</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>格式</th><th>列</th><th>适用</th></tr></thead><tbody><tr><td>标准 LM</td><td><code>text</code></td><td>纯文本续写</td></tr><tr><td>对话 LM</td><td><code>messages</code></td><td><strong>agent 轨迹就用这个</strong>（角色 + 工具调用都在里面）</td></tr><tr><td>标准 prompt-completion</td><td><code>prompt</code>, <code>completion</code></td><td>单轮问答</td></tr><tr><td>对话 prompt-completion</td><td><code>prompt</code>(messages), <code>completion</code>(messages)</td><td>单轮、要求只对 completion 算 loss</td></tr></tbody></table></div>\n<blockquote><p>agent 轨迹必须用 <strong>对话格式 + <code>tools</code> 列</strong>，因为一条轨迹里有多轮 assistant/tool 交替，单一 <code>completion</code> 表达不了。</p></blockquote>\n<h3 id=\"s4-h2\">4.2 逐字段说明（对话格式）</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>字段</th><th>类型</th><th>含义</th><th>注意</th></tr></thead><tbody><tr><td><code>messages</code></td><td><code>list[dict]</code></td><td>完整对话</td><td>每项 <code>{\"role\": ..., \"content\": ...}</code></td></tr><tr><td><code>messages[].role</code></td><td><code>system</code> / <code>user</code> / <code>assistant</code> / <code>tool</code></td><td>谁在说话</td><td><code>tool</code> 消息带上 <code>name</code> 便于自己溯源（Qwen3 模板不读它）</td></tr><tr><td><code>messages[].content</code></td><td><code>str</code></td><td>文本</td><td>assistant 只调工具时可以写 <code>\"\"</code></td></tr><tr><td><code>messages[].tool_calls</code></td><td><code>list[dict]</code></td><td>assistant 发起的工具调用</td><td><code>{\"type\":\"function\",\"function\":{\"name\",\"arguments\"}}</code></td></tr><tr><td><code>messages[].name</code></td><td><code>str</code></td><td>工具名</td><td>仅 <code>role=\"tool\"</code> 时用</td></tr><tr><td><code>tools</code></td><td><code>list[dict]</code></td><td><strong>工具 schema 列表</strong></td><td>会被渲染进 <strong>system</strong> 消息，告诉模型有哪些工具</td></tr></tbody></table></div>\n<h3 id=\"s4-h3\">4.3 真实示例：<code>data/sft_agent_trace.jsonl</code>（第 1 行，节选）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-json\">{\n  \"tools\": [\n    {\"type\": \"function\", \"function\": {\n      \"name\": \"read_file\",\n      \"description\": \"读取仓库中某个文件的完整内容。\",\n      \"parameters\": {\"type\": \"object\",\n                     \"properties\": {\"path\": {\"type\": \"string\"}},\n                     \"required\": [\"path\"]}}}\n  ],\n  \"messages\": [\n    {\"role\": \"system\", \"content\": \"你是一个编程 agent。你可以读文件、写文件、跑测试……\"},\n    {\"role\": \"user\",   \"content\": \"calculator.py 里的测试失败了，请修好它。\"},\n    {\"role\": \"assistant\", \"content\": \"先看代码和测试。\",\n     \"tool_calls\": [{\"type\": \"function\", \"function\": {\n        \"name\": \"read_file\", \"arguments\": {\"path\": \"calculator.py\"}}}]},\n    {\"role\": \"tool\", \"name\": \"read_file\",\n     \"content\": \"def divide(a, b):\\n    return a / b\\n\"},\n    {\"role\": \"assistant\", \"content\": \"\", \"tool_calls\": [\n        {\"type\": \"function\", \"function\": {\"name\": \"read_file\",\n                                          \"arguments\": {\"path\": \"test_calculator.py\"}}}]},\n    {\"role\": \"tool\", \"name\": \"read_file\", \"content\": \"from calculator import divide\\n...\"},\n    {\"role\": \"assistant\", \"content\": \"除零没有抛 ValueError，改掉。\", \"tool_calls\": [\n        {\"type\": \"function\", \"function\": {\"name\": \"write_file\",\n          \"arguments\": {\"path\": \"calculator.py\", \"content\": \"def divide(a, b):\\n    ...\"}}}]},\n    {\"role\": \"tool\", \"name\": \"write_file\", \"content\": \"written 96 bytes to calculator.py\"},\n    {\"role\": \"assistant\", \"content\": \"\", \"tool_calls\": [\n        {\"type\": \"function\", \"function\": {\"name\": \"run_tests\", \"arguments\": {}}}]},\n    {\"role\": \"tool\", \"name\": \"run_tests\", \"content\": \"2 passed in 0.31s\"},\n    {\"role\": \"assistant\", \"content\": \"在 divide 中增加了除零检查，两个测试都通过了。\"}\n  ]\n}</code></pre></div>\n<blockquote><p>一行 <abbr title=\"JSON Lines —— 按行存 JSON 的文本格式\">JSONL</abbr> = 一条完整 episode。assistant 有两类消息：<strong>带 <code>tool_calls</code> 的</strong>（决定下一步动作）和<strong>纯文本的</strong>（总结、推理），两种都要出现在数据里。</p></blockquote>\n<h3 id=\"s4-h4\">4.4 用代码生成 <code>tools</code> 列（避免手写 schema 出错）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">from transformers.utils import get_json_schema\n\ndef read_file(path: str) -&gt; str:\n    \"\"\"读取仓库中某个文件的完整内容。\n\n    Args:\n        path: 相对仓库根目录的文件路径。\n    \"\"\"\n    ...\n\ntools = [{\"type\": \"function\", \"function\": get_json_schema(read_file)}]</code></pre></div>"
   },
   {
    "id": "s5",
    "title": "5. 全链路实拍：一条轨迹进模型前，变四次形",
    "short": "全链路实拍：一条轨迹进模型前，变四次形",
    "html": "<div class=\"codewrap\"><pre><code>JSONL 记录 ──chat template──► 一段纯文本 ──tokenizer──► token id 序列\n    ──打掩码──► labels（学的保留 id，不学的 -100）──collate──► batch 张量 ──► loss</code></pre></div>\n<p>下面就按这个顺序，把 <code>python 01-监督微调-SFT/code/train_sft.py --inspect</code> 的真实输出贴出来（模型 <code>Qwen/Qwen3-0.6B</code>，数据 <code>data/sft_agent_trace.jsonl</code> 第 1 条）。<strong>这些数字都可以在你自己机器上复现。</strong></p>\n<h3 id=\"s5-h1\">5.1 阶段 1：读 <abbr title=\"JSON Lines —— 按行存 JSON 的文本格式\">JSONL</abbr></h3>\n<div class=\"codewrap\"><pre><code>  文件：.../01-监督微调-SFT/data/sft_agent_trace.jsonl\n  行数：2\n\n   #  role         content 长度  tool_calls\n  --------------------------------------------------------------\n   0  system               46  -\n   1  user                 52  -\n   2  assistant             8  read_file\n   3  tool                 35  -\n   4  assistant             0  read_file\n   5  tool                223  -\n   6  assistant            20  write_file\n   7  tool                 33  -\n   8  assistant             0  run_tests\n   9  tool                 17  -\n  10  assistant            49  -\n\n  第 1 条记录的 tools 列（渲染进 system 消息里的函数签名）：\n    - read_file(path)     # 读取仓库中某个文件的完整内容。\n    - write_file(path, content)  # 把内容写入仓库中的文件，覆盖原内容。\n    - run_tests()         # 运行仓库的 pytest 测试套件。</code></pre></div>\n<p>看出结构了：<strong>user 只出现 1 次，assistant 出现 5 次</strong>——中间 4 次是\"调工具\"，最后 1 次是\"给结论\"。</p>\n<h3 id=\"s5-h2\">5.2 阶段 2：套 chat template（<abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr> → 纯文本）</h3>\n<p><code>tokenizer.apply_chat_template(messages, tools=...)</code> 渲染出 <strong>2447 个字符</strong>。原样打印（<code>▸</code> 是脚本加的标记，表示模板插入的角色分隔符）：</p>\n<div class=\"codewrap\"><pre><code>▸ &lt;|im_start|&gt;system\n  你是一个编程 agent。你可以读文件、写文件、跑测试。修好失败的测试后，用一句话总结改动。\n\n  # Tools\n\n  You may call one or more functions to assist with the user query.\n\n  You are provided with function signatures within &lt;tools&gt;&lt;/tools&gt; XML tags:\n  &lt;tools&gt;\n  {\"type\": \"function\", \"function\": {\"name\": \"read_file\", \"description\": \"读取仓库中某个文件的完整内容。\", \"parameters\": {...}}}\n  {\"type\": \"function\", \"function\": {\"name\": \"write_file\", \"description\": \"把内容写入仓库中的文件，覆盖原内容。\", \"parameters\": {...}}}\n  {\"type\": \"function\", \"function\": {\"name\": \"run_tests\", \"description\": \"运行仓库的 pytest 测试套件。\", \"parameters\": {\"type\": \"object\", \"properties\": {}}}}\n  &lt;/tools&gt;\n\n  For each function call, return a json object with function name and arguments within &lt;tool_call&gt;&lt;/tool_call&gt; XML tags:\n  &lt;tool_call&gt;\n  {\"name\": &lt;function-name&gt;, \"arguments\": &lt;args-json-object&gt;}\n  &lt;/tool_call&gt;&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;user\n  calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;assistant\n  先看代码和测试。\n  &lt;tool_call&gt;\n  {\"name\": \"read_file\", \"arguments\": {\"path\": \"calculator.py\"}}\n  &lt;/tool_call&gt;&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;user            ← 注意！工具结果在 Qwen3 模板里是 user 轮\n  &lt;tool_response&gt;\n  def divide(a, b):\n      return a / b\n\n  &lt;/tool_response&gt;&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;assistant\n  &lt;tool_call&gt;\n  {\"name\": \"read_file\", \"arguments\": {\"path\": \"test_calculator.py\"}}\n  &lt;/tool_call&gt;&lt;|im_end|&gt;\n  ...\n▸ &lt;|im_start|&gt;assistant\n  &lt;think&gt;\n\n  &lt;/think&gt;\n\n  在 divide 中增加了除零检查，b == 0 时抛出 ValueError，两个测试都通过了。&lt;|im_end|&gt;</code></pre></div>\n<p>这里有 <strong>四个必须亲眼看到</strong>的事实，每一个都会影响训练结果：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>事实</th><th>后果</th></tr></thead><tbody><tr><td class=\"num\">1</td><td><code>tools</code> 不是单独一段，是被塞进 <strong>system 消息</strong>（<code># Tools</code> + <code>&lt;tools&gt;</code> <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr> + 一段调用格式说明）</td><td>换模型就得换写法；工具描述写得含糊，模型就选错工具</td></tr><tr><td class=\"num\">2</td><td><code>role=\"tool\"</code> 被渲染成 <strong><code>&lt;|im_start|&gt;user</code> + <code>&lt;tool_response&gt;…&lt;/tool_response&gt;</code></strong>，不是 <code>&lt;|im_start|&gt;tool</code></td><td>想靠\"只学 user 轮之后\"来打掩码会错；工具结果天然属于\"上下文\"</td></tr><tr><td class=\"num\">3</td><td>assistant 的 <code>tool_calls</code> 被渲染成 <code>&lt;tool_call&gt;{\"name\":…,\"arguments\":…}&lt;/tool_call&gt;</code>，<strong>参数是 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr></strong></td><td>训练数据里 <code>arguments</code> 必须是 dict（或合法 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr> 串），写成 Python <code>repr</code> 就学成单引号</td></tr><tr><td class=\"num\">4</td><td>最后一条 assistant 前面被插了 <strong>空的 <code>&lt;think&gt;\\n\\n&lt;/think&gt;</code></strong></td><td>Qwen3 的\"非思考模式\"就是用空 think 块表示；训练数据保持一致即可，别指望它凭空学会思考</td></tr></tbody></table></div>\n<h3 id=\"s5-h3\">5.3 阶段 3：tokenize → 打掩码 → labels</h3>\n<p>把上面的文本切成 token，共 <strong>650 个</strong>。然后回答一个问题：<strong>这 650 个 token，哪些该学？</strong></p>\n<div class=\"codewrap\"><pre><code>  已给模板打 generation 补丁\n  总 token：650    需要学的 token：166（25.5%）\n\n  掩码条（█ = 要学，· = 不学，每行 100 个 token）：\n       0 ····································································································\n     100 ····································································································\n     200 ····································································································\n     300 ··············································████████████████████████████··················\n     400 ·····████████████████████████··································································█████\n     500 ██████████████████████████████████████████████████████████████····················█████████████████·\n     600 ····················██████████████████████████████</code></pre></div>\n<p><strong>为什么前面 300 多个 token 全是 <code>·</code>？</strong> 因为那是 system + 工具 schema + 用户提问——全是\"给定上下文\"，让模型去预测它们只会教它复述用户。</p>\n<p>掩码翻转的精确位置（表里第 1 列是下标，第 3 列是 label）：</p>\n<div class=\"codewrap\"><pre><code>   idx  token_id     label  学   token\n  ----------------------------------------------------------\n   348      1773      -100  ·   。\n   349    151645      -100  ·   &lt;|im_end|&gt;\n   350       198      -100  ·   \\n\n   351    151644      -100  ·   &lt;|im_start|&gt;     ← assistant 的角色头，不算\n   352     77091      -100  ·   assistant       ← 同上\n   353       198      -100  ·   \\n              ← 同上\n   354     60726     60726  █   先              ← 从这里开始学\n   355     50930     50930  █   看\n   356     46100     46100  █   代码\n   357     33108     33108  █   和\n   358     81705     81705  █   测试\n   359      8997      8997  █   。\\n\n   360    151657    151657  █   &lt;tool_call&gt;     ← 工具调用的结构也要学\n   361       198       198  █   \\n\n   362      4913      4913  █   {\"\n   363       606       606  █   name\n   ...\n   647      1773      1773  █   。\n   648    151645    151645  █   &lt;|im_end|&gt;     ← 学会停下来\n   649       198       198  █   \\n</code></pre></div>\n<p>三条规则：</p>\n<ol><li><strong>system / user / 工具 schema / <code>tool_response</code> → <code>-100</code></strong>，不算 loss。</li><li><strong>assistant 轮的全部 token → 保留原 id</strong>，包括 <code>&lt;tool_call&gt;</code> 结构、参数 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr>、结尾的 <code>&lt;|im_end|&gt;</code>。</li><li><strong>padding 也必须是 <code>-100</code></strong>，否则模型会去学\"怎么补空格\"。</li></ol>\n<blockquote><p>「哪些 token 是 assistant 的」这件事，transformers 靠模板里的 <code>{% generation %}…{% endgeneration %}</code> 标记来判断。 Qwen3 的模板<strong>没有</strong>这对标记——直接调 <code>return_assistant_tokens_mask=True</code> 会得到<strong>全 0 的掩码</strong>（外加一条 warning）。 <abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr>的 <code>assistant_only_loss=True</code> 内部做的就是\"给已知模型家族的模板打补丁\"，脚本里 <code>patch_template()</code> 是同一个动作的最小实现。</p></blockquote>\n<h3 id=\"s5-h4\">5.4 阶段 4：拼成 batch（模型真正看到的东西）</h3>\n<p>两条样本 pad 到同一长度后：</p>\n<div class=\"codewrap\"><pre><code>  样本数：2   序列长度（pad 后）：650\n\n  input_ids         [2, 650]  int64   # pad=151643\n  attention_mask    [2, 650]  int64   # pad 处为 0\n  labels            [2, 650]  int64   # 不学的位置 = -100\n\n  第 1 条样本的头 12 个位置：\n   idx   input_ids      labels  attn\n     0      151644        -100     1\n     1        8948        -100     1      ← system\n     2         198        -100     1\n     3       56568        -100     1      你\n     4      101909        -100     1      是一个\n     ...</code></pre></div>\n<p>模型输出 <code>logits: [2, 650, 151936]</code>，框架内部把 logits 右移一位、按 <code>labels != -100</code> 求平均交叉熵。<strong>也就是说：loss 只由那 166 个位置决定，其余 484 个位置对梯度没有贡献。</strong></p>\n<h3 id=\"s5-h5\">5.5 一句话总结这四次变形</h3>\n<blockquote><p><strong>\"你在数据里写了什么，模型就学什么；你没写的（-100），它一律不学。\"</strong> 想让模型学会\"调用工具后等结果再继续\"，就必须让 <code>tool_call</code> 和它之后的 assistant 续写都落在监督段里。</p></blockquote>"
   },
   {
    "id": "s6",
    "title": "6. 损失怎么算（手算一遍）",
    "short": "损失怎么算（手算一遍）",
    "html": "<p>第 5 节讲的是「数据变成了什么」，这一节讲「这些数字最后怎么变成一个 loss」。 <code>python 01-监督微调-SFT/code/train_sft.py --explain-loss</code> 会把下面的表原样打印出来（不加载模型，1 秒跑完）。</p>\n<h3 id=\"s6-h1\">6.1 一个位置：交叉熵就是「正确 token 概率的负对数」</h3>\n<p>模型在每个位置吐出 151936 个分数（logits），softmax 之后变成一个概率分布。 我们只关心<strong>正确那个 token</strong> 拿到了多少概率 <code>p</code>：</p>\n<div class=\"codewrap\"><pre><code>  loss_这一个位置 = -ln(p)</code></pre></div>\n<div class=\"tablewrap\"><table><thead><tr><th>正确 token 的概率 <code>p</code></th><th><code>-ln(p)</code></th><th>直觉</th></tr></thead><tbody><tr><td class=\"num\">0.99</td><td class=\"num\">0.010</td><td>几乎确定 → 几乎不罚</td></tr><tr><td class=\"num\">0.90</td><td class=\"num\">0.105</td><td>很确定</td></tr><tr><td class=\"num\">0.50</td><td class=\"num\">0.693</td><td>在犹豫</td></tr><tr><td class=\"num\">0.20</td><td class=\"num\">1.609</td><td>猜错了</td></tr><tr><td class=\"num\">0.01</td><td class=\"num\">4.605</td><td>完全跑偏 → 罚得很重</td></tr></tbody></table></div>\n<p>这张表解释了 loss 的量级：<abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 正常的 loss 从 <strong>2 左右降到 0.3 左右</strong>，就是「正确 token 的平均概率从约 0.13 涨到约 0.74」。</p>\n<blockquote><p>想从「熵 → 交叉熵 → <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>」把这条线一次看全，见 <a class=\"il\" href=\"#/ch7\">第 6 章 · 理论串联</a>。</p></blockquote>\n<h3 id=\"s6-h2\">6.2 一条轨迹：166 个位置各算一次，再平均</h3>\n<p>假设某条轨迹里 5 个被监督的 token，模型给它们的概率分别是：</p>\n<div class=\"codewrap\"><pre><code>  token 1: p = 0.98   →   -ln(p) = 0.020\n  token 2: p = 0.95   →   -ln(p) = 0.051\n  token 3: p = 0.90   →   -ln(p) = 0.105\n  token 4: p = 0.80   →   -ln(p) = 0.223\n  token 5: p = 0.50   →   -ln(p) = 0.693\n  ─────────────────────────────────────────\n  平均 = (0.020+0.051+0.105+0.223+0.693)/5 = 0.218</code></pre></div>\n<p><strong>只有这 5 个位置参与</strong>。真实那条轨迹是 166 个位置，写成人话公式就是：</p>\n<div class=\"fxl\" data-fx=\"{&quot;title&quot;: &quot;SFT 的损失：一层层拆开&quot;, &quot;tex&quot;: &quot;\\\\mathcal{L}_{\\\\text{SFT}} = -\\\\frac{1}{|\\\\mathcal{T}|}\\\\sum_{t\\\\in\\\\mathcal{T}}\\\\log p_\\\\theta\\\\left(y_t \\\\mid y_{&lt;t}\\\\right)&quot;, &quot;note&quot;: &quot;整条轨迹上，模型给「正确 token」的概率越高，损失越小。&quot;, &quot;kids&quot;: [{&quot;label&quot;: &quot;\\\\mathcal{T}&quot;, &quot;name&quot;: &quot;监督位置集合&quot;, &quot;def&quot;: &quot;\\\\mathcal{T}=\\\\left\\\\{\\\\,t \\\\;:\\\\; \\\\text{label}_t \\\\neq -100\\\\,\\\\right\\\\}&quot;, &quot;note&quot;: &quot;只有 assistant 自己写的 token 才进这个集合，prompt 和工具返回被 -100 屏蔽。&quot;, &quot;kids&quot;: [{&quot;label&quot;: &quot;\\\\text{label}_t&quot;, &quot;name&quot;: &quot;每个位置的标签&quot;, &quot;def&quot;: &quot;\\\\text{label}_t = y_{t+1}&quot;, &quot;note&quot;: &quot;语言模型学的是「预测下一个 token」，所以标签是输入右移一位。&quot;, &quot;kids&quot;: []}, {&quot;label&quot;: &quot;-100&quot;, &quot;name&quot;: &quot;PyTorch 的忽略标记&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;交叉熵里 -100 的位置既不进分子也不进分母，等于没算。&quot;, &quot;kids&quot;: []}]}, {&quot;label&quot;: &quot;|\\\\mathcal{T}|&quot;, &quot;name&quot;: &quot;集合大小&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;本例 166；忘了屏蔽 prompt 就变成 650，loss 会凭空小一半，看着像学得很好。&quot;, &quot;kids&quot;: []}, {&quot;label&quot;: &quot;p_\\\\theta\\\\left(y_t \\\\mid y_{&lt;t}\\\\right)&quot;, &quot;name&quot;: &quot;正确 token 的概率&quot;, &quot;def&quot;: &quot;p_\\\\theta\\\\left(y_t\\\\mid y_{&lt;t}\\\\right)=\\\\frac{\\\\exp\\\\left(z_{t,y_t}\\\\right)}{\\\\sum_{v=1}^{V}\\\\exp\\\\left(z_{t,v}\\\\right)}&quot;, &quot;note&quot;: &quot;softmax 之后，取「正确答案那个词」对应的那一格。&quot;, &quot;kids&quot;: [{&quot;label&quot;: &quot;z_{t,v}&quot;, &quot;name&quot;: &quot;logits&quot;, &quot;def&quot;: &quot;z_{t,\\\\cdot}=f_\\\\theta\\\\left(y_{&lt;t}\\\\right)\\\\in\\\\mathbb{R}^{V}&quot;, &quot;note&quot;: &quot;模型在每个位置吐 V 个分数，softmax 之前它们不是概率、也不为正。&quot;, &quot;kids&quot;: []}, {&quot;label&quot;: &quot;V&quot;, &quot;name&quot;: &quot;词表大小&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;Qwen3 是 151936，所以一条 650 token 的轨迹，logits 是 650\\\\times151936 个数。&quot;, &quot;kids&quot;: []}]}, {&quot;label&quot;: &quot;\\\\log\\\\left(\\\\cdot\\\\right)&quot;, &quot;name&quot;: &quot;取对数&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;把概率翻译成代价：p=1 时代价 0，p=0.5 时代价 0.693，p=0.01 时代价 4.6。&quot;, &quot;kids&quot;: []}, {&quot;label&quot;: &quot;-\\\\frac{1}{|\\\\mathcal{T}|}\\\\sum_{t\\\\in\\\\mathcal{T}}&quot;, &quot;name&quot;: &quot;先平均、再取负&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;负号把「最小化损失」等价成「最大化正确 token 的概率」。&quot;, &quot;kids&quot;: []}]}\"><div class=\"fx-title\">SFT 的损失：一层层拆开</div><div class=\"fx-root math\" data-tex=\"\\mathcal{L}_{\\text{SFT}} = -\\frac{1}{|\\mathcal{T}|}\\sum_{t\\in\\mathcal{T}}\\log p_\\theta\\left(y_t \\mid y_{&lt;t}\\right)\"></div><p class=\"fx-hint\">点下面的胶囊，逐项拆到最底层。</p></div>\n<p><strong>逐符号拆解</strong>（<span class=\"imath\" data-tex=\"\\mathcal{T}\"></span> 读作「脚本体 T」，就是被监督的位置集合）：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>符号</th><th>含义</th><th>本例取值</th><th>为什么是这个值</th></tr></thead><tbody><tr><td><span class=\"imath\" data-tex=\"\\mathcal{L}_{\\text{SFT}}\"></span></td><td>这条样本的损失，一个标量</td><td class=\"num\">0.218</td><td>5 个 token 的平均</td></tr><tr><td><span class=\"imath\" data-tex=\"\\mathcal{T}\"></span></td><td>参与计算的位置集合</td><td>166 个位置</td><td>prompt（提示词）和工具结果被掩码成 −100，剔除了</td></tr><tr><td><span class=\"imath\" data-tex=\"\\lvert\\mathcal{T}\\rvert\"></span></td><td>集合大小，也就是分母</td><td class=\"num\">166</td><td><strong>不是 650</strong>（650 是序列长度）</td></tr><tr><td><span class=\"imath\" data-tex=\"p_\\theta(y_t \\mid y_{&lt;t})\"></span></td><td>模型在位置 t 对「正确 token」给出的概率</td><td>0.98 → 0.50</td><td>softmax 之后取正确那一格</td></tr><tr><td><span class=\"imath\" data-tex=\"-\\log(\\cdot)\"></span></td><td>负对数，把概率翻译成损失</td><td>0.020 → 0.693</td><td>概率越低罚得越重</td></tr></tbody></table></div>\n<p><strong>一步步算</strong>（对应上面那 5 个 token）：</p>\n<ol><li><strong>前向</strong>：一次喂进 <code>[1, 650]</code> 的 <code>input_ids</code>，模型吐出 <code>[1, 650, 151936]</code> 的 logits（151936 = 词表大小）。</li><li><strong>转概率</strong>：对第 3 维做 softmax，每个位置变成一组 151936 个概率，加起来等于 1。</li><li><strong>挑对的那一格</strong>：只取「这条轨迹里真正写下的那个 token」的概率，得到 <code>0.98 / 0.95 / 0.90 / 0.80 / 0.50</code>。</li><li><strong>逐个取负对数</strong>：<code>−ln</code> 之后是 <code>0.020 / 0.051 / 0.105 / 0.223 / 0.693</code>。</li><li><strong>求和再除以个数</strong>：<code>1.092 / 5 = 0.218</code>；真实训练里分母是 166，而且这五步全在 <abbr title=\"Graphics Processing Unit —— 图形处理器\">GPU</abbr> 上批量完成，不需要你写循环。</li></ol>\n<p>分母是 <strong>166 而不是 650</strong> —— 这就是 5.3 节那张掩码条的真正作用。分母搞错（比如忘了 <code>assistant_only_loss</code>）会让 loss 数值凭空小一半，看着像「学得特别好」。</p>\n<h3 id=\"s6-h3\">6.3 「右移一位」到底是什么意思</h3>\n<p>语言模型在位置 <code>t</code> 输出的是<strong>下一个</strong> token 的分布，所以算 loss 时要把 label 往左错一位：</p>\n<div class=\"codewrap\"><pre><code>  位置 0   输入 &lt;|im_start|&gt;       → 预测下一个：assistant\n  位置 1   输入 assistant          → 预测下一个：换行\n  位置 2   输入换行                → 预测下一个：先\n  位置 3   输入先                  → 预测下一个：调\n  位置 4   输入调                  → 预测下一个：用</code></pre></div>\n<p>所以 <code>labels[t]</code> 就是 <code>input_ids[t+1]</code>，整条 label 序列等于「输入左移一位、末尾补 -100」：</p>\n<div class=\"codewrap\"><pre><code>  input_ids :  &lt;|im_start|&gt;  assistant  换行  先  调  用  &lt;/tool_call&gt;  ...\n  labels    :  assistant     换行       先    调  用  &lt;/tool_call&gt;  ...  -100\n  loss_mask :  0             0          0     1   1   1          1       0</code></pre></div>\n<p>只有 <code>loss_mask = 1</code> 的位置进入损失；<code>0</code> 的位置（system、user、工具返回、padding）全部跳过。</p>\n<p>被 mask 的位置（prompt、tool 结果、padding）把 label 写成 <code>-100</code>，框架直接跳过它们 —— <strong>不参与求和，也不参与平均</strong>。</p>\n<h3 id=\"s6-h4\">6.4 整个 batch</h3>\n<p>一个 batch 里 2 条样本、每条 166 个监督位置：</p>\n<div class=\"codewrap\"><pre><code>  loss = ( Σ_{i=1..2} Σ_{t ∈ 监督段} -ln p_{i,t} ) / (2 × 166)</code></pre></div>\n<p>梯度是最朴素的那种：<strong>每个被监督的 token 各自把「自己这个 token 的概率」往上推一点</strong>，互不干扰。所以：</p>\n<ul><li>想让它学会某种 token 序列 → 那段必须是 <code>label != -100</code>；</li><li>不想让它学（比如工具返回的 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr>）→ 那段必须 <code>-100</code>；</li><li>数量少的片段（比如 3 个 token 的 <code>&lt;|im_end|&gt;</code>）在 166 个位置里权重很小，想让模型「学会停」，得靠足够多的样本重复。</li></ul>\n<h3 id=\"s6-h5\">6.5 一句话记住</h3>\n<blockquote><p><strong>loss = 「被监督的每个 token，模型给它的概率有多低」的平均。</strong> 掩码决定<strong>分子和分母里算哪些位置</strong>，右移决定<strong>每个位置在预测谁</strong>。</p></blockquote>"
   },
   {
    "id": "s7",
    "title": "7. 跑起来",
    "short": "跑起来",
    "html": "<p>脚本目录：<a class=\"il\" href=\"#\"><code>code/</code></a>（7 个文件，入口 <code>train_sft.py</code>，四个阶段 + 训练前/后评测全部可打印）</p>\n<h3 id=\"s7-h1\">7.1 两套数据，别混用</h3>\n<div class=\"tablewrap\"><table><thead><tr><th></th><th>本地解剖样本</th><th>官方训练集</th></tr></thead><tbody><tr><td>位置</td><td><code>data/sft_agent_trace.jsonl</code>（2 条）</td><td><code>--dataset trl-lib/Capybara</code>（1.6 万条对话）</td></tr><tr><td>用来看</td><td>模板长什么样、掩码打在哪、token 怎么变 label</td><td><strong>训练效果</strong></td></tr><tr><td>能不能训出能力</td><td>不能。2 条样本训 20 步只会把这 2 条背下来</td><td>能，配 held-out 评测就能看到 -ln p 下降</td></tr></tbody></table></div>\n<p>第 5 节那些数字（650 token / 166 监督 / 24.4%）都来自解剖样本，它的作用是让你<strong>看清数据处理</strong>，不是让你相信训练有效。 要看效果，就得用官方数据集或者你自己采集的上千条轨迹。</p>\n<blockquote><p><strong>Capybara 没有工具定义</strong>：它是通用对话数据（只有 <code>messages</code> 列，user/assistant 交替），所以跑起来会看到「这条没有工具定义」的提示——正常。 它的价值是先验证「管线 + 效果评估」这条链能跑通；要真练工具调用，就把你采集的 agent 轨迹按第 4 节的 <abbr title=\"JSON Lines —— 按行存 JSON 的文本格式\">JSONL</abbr> 格式写好，用 <code>--data</code> 指过去（带 <code>tools</code> 列和 <code>tool_calls</code>）。</p></blockquote>\n<h3 id=\"s7-h2\">7.2 命令</h3>\n<p><strong>所有命令都在仓库根目录执行</strong>（<code>Agentic-Post-training/</code> 那个目录，不需要 cd 进 <code>code/</code>）。</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># (1) 只跑数据链路：不需要 GPU、不需要 trl（只要 transformers），先确认数据没写错\npython 01-监督微调-SFT/code/train_sft.py --inspect\n\n# (1).5 不加载模型，把第 6 节的交叉熵手算打一遍\npython 01-监督微调-SFT/code/train_sft.py --explain-loss\n\n# (2) 用本地 2 条解剖样本跑通全流程（验证管线，不代表效果）\npython 01-监督微调-SFT/code/train_sft.py --epochs 1 --max-steps 20\n\n# (3) 真正训练：官方数据集 2000 条，留 100 条做 held-out 评测\npython 01-监督微调-SFT/code/train_sft.py --dataset trl-lib/Capybara --limit 2000 --eval-size 100\n\n# 单卡 24G 的稳妥配置\npython 01-监督微调-SFT/code/train_sft.py --dataset trl-lib/Capybara --limit 5000 \\\n    --eval-size 100 --model Qwen/Qwen3-0.6B --epochs 1 --gen-tokens 160</code></pre></div>\n<p>路径不受影响：脚本自己按文件位置算出章节目录，产物照样落在 <code>01-监督微调-SFT/runs/sft/</code> 和 <code>01-监督微调-SFT/ckpt/sft-agent/</code>。</p>\n<p><code>--limit</code> 取多少？先 2000 条跑通（约 20–40 分钟），确认 -ln p 在降，再加到 5000–20000。</p>\n<p>依赖（一次装完）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">pip install -i https://pypi.tuna.tsinghua.edu.cn/simple \\\n  \"trl&gt;=1.16.0\" transformers datasets accelerate</code></pre></div>\n<h4 id=\"s7-h3\">代码不是一个 600 行的文件</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>文件</th><th>负责什么</th></tr></thead><tbody><tr><td><code>code/train_sft.py</code></td><td>入口：解析参数、按顺序调用下面这些</td></tr><tr><td><code>code/common.py</code></td><td>仓库根路径、<code>runs/</code>·<code>ckpt/</code> 目录、打印、tokenizer 小工具</td></tr><tr><td><code>code/sft_data.py</code></td><td>阶段 1：读 <abbr title=\"JSON Lines —— 按行存 JSON 的文本格式\">JSONL</abbr> / 官方数据集、切 held-out</td></tr><tr><td><code>code/sft_template.py</code></td><td>阶段 2~4：套模板、打 generation 补丁、算掩码、看 batch</td></tr><tr><td><code>code/sft_trainer.py</code></td><td>阶段 5：SFTTrainer + 训练前后各测一次</td></tr><tr><td><code>code/sft_report.py</code></td><td><code>loss.svg</code> 曲线 + <code>01-监督微调-SFT/runs/sft/report.md</code></td></tr><tr><td><code>code/sft_loss.py</code></td><td>第 6 节那张交叉熵表（<code>--explain-loss</code>）</td></tr></tbody></table></div>\n<p>想改哪一段就只改那一个文件，入口文件基本不用动。</p>\n<div class=\"tablewrap\"><table><thead><tr><th>产物</th><th>内容</th></tr></thead><tbody><tr><td><code>01-监督微调-SFT/runs/sft/report.md</code></td><td>总报告：环境、held-out 前/后 -ln p、loss 曲线、loss 表、生成对比</td></tr><tr><td><code>01-监督微调-SFT/runs/sft/loss.svg</code></td><td>折线图（原始 loss + EMA），训练中每 20 步重画一次</td></tr><tr><td><code>01-监督微调-SFT/runs/sft/tokens.txt</code></td><td>全量 token / label / mask 表（解剖样本，650 行）</td></tr><tr><td><code>01-监督微调-SFT/runs/sft/loss.csv</code></td><td>每步 loss，可拿去画图</td></tr><tr><td><code>01-监督微调-SFT/ckpt/sft-agent/</code></td><td>训练好的权重，后面几步的起点</td></tr></tbody></table></div>\n<h3 id=\"s7-h4\">7.3 怎么判断「真的有效果」</h3>\n<p>别只看 loss 曲线，看这三个数（report.md 里都有）：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>指标</th><th>从哪来</th><th>健康</th></tr></thead><tbody><tr><td><strong>held-out -ln p</strong></td><td>100 条没参与训练的样本，训练前后各算一次</td><td>下降 15% 以上（如 2.1 → 1.4）</td></tr><tr><td><strong>token_acc</strong></td><td>训练日志</td><td>0.4 → 0.8 以上</td></tr><tr><td><strong>生成对比</strong></td><td>同样的 prompt，前后各生成一次</td><td>训练后能套上 <code>&lt;tool_call&gt;{…}&lt;/tool_call&gt;</code> 格式</td></tr></tbody></table></div>\n<p>前两个是数，第三个是眼睛；三个都变好才叫学会了。</p>\n<h3 id=\"s7-h5\">7.4 训练时终端长这样</h3>\n<p><code>--inspect</code> 之后进入训练，终端里是<strong>一行不断刷新的实时进度</strong>（<code>\\r</code> 原地覆盖，不会刷屏）：</p>\n<div class=\"codewrap\"><pre><code>step  273/ 714  38.2%  loss 1.1450  ema 1.1613  acc 0.696  lr 1.37e-05  eta 12:41  ▁▂▄▆▃▂</code></pre></div>\n<p>从左到右：第几步 / 总步数、百分比、当前 loss、<strong>EMA(0.9) 平滑值</strong>（这才是趋势）、 <code>token_acc</code>、学习率、<strong>ETA 预计剩余时间</strong>、最后那串方块是最近 28 步的走势（一眼看出在降还是在抖）。</p>\n<p>同时每 <code>--plot-every 20</code> 步会把 <code>runs/sft/loss.svg</code> 重画一次 —— 想看曲线就把它拖进浏览器， 或者用 <code>scp</code> 拉回本地双击打开；不想画图加 <code>--plot-every 0</code>。</p>\n<p>训练的每一行都要看三件事：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>信号</th><th>健康</th><th>不健康</th></tr></thead><tbody><tr><td><code>loss</code></td><td>单调下降后趋稳</td><td>抖动剧烈 → lr 太大；不降 → 掩码错了（全是 -100）</td></tr><tr><td><code>token_acc</code></td><td>稳步升（0.4 → 0.8+）</td><td>停在 0.3 附近 → 数据太少/太难</td></tr><tr><td><code>grad</code></td><td>平稳（0.1–5）</td><td>尖峰 &gt;20 → 梯度爆炸，开 <code>max_grad_norm</code> 或降 lr</td></tr></tbody></table></div>\n<h3 id=\"s7-h6\">7.5 损失图</h3>\n<p><code>report.md</code> 里就是一行图片语法（GitHub / VS Code / 浏览器都能直接显示，不用装 matplotlib）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-text\">![loss 曲线](loss.svg)</code></pre></div>\n<p>（<code>loss.svg</code> 是训练时生成的；没跑过训练之前这张图显示不出来，是正常的。）</p>\n<p>图里两条线：<strong>浅色 = 每一步的原始 loss</strong>（抖，正常），<strong>深色 = EMA(0.9)</strong>（趋势，看这条）。 判读就三句话：EMA 往下 → 在学；EMA 走平但 <code>token_acc</code> 还在涨 → 在学格式；两条都平 → 到瓶颈。</p>\n<h3 id=\"s7-h7\">7.5.0 为什么 TensorBoard 里的 loss 像噪声</h3>\n<p>先看一眼你的真实数字：held-out <code>1.5550 → 1.2988</code>（−16.5%），三个 epoch 的均值 <code>1.2637 / 1.1684 / 1.1392</code>。 <strong>它是在学的</strong>，只是「每一步的 loss」这个指标本身信噪比极低：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>为什么抖</th><th>具体原因</th></tr></thead><tbody><tr><td>一个 batch 只有 1 条轨迹</td><td><code>per_device_train_batch_size=1</code>，这一步只看了 8 条样本（grad_accum=8）</td></tr><tr><td>每条轨迹长度差 10 倍</td><td>短的 300 token、长的 2000 token，平均口径不一样</td></tr><tr><td>内容五花八门</td><td>Capybara 是通用对话，这一步在写代码、下一步在聊历史</td></tr></tbody></table></div>\n<p>所以单步 loss 在 1.0–1.4 之间来回跳是<strong>正常的</strong>，跳不出趋势不代表没学。</p>\n<p>四个能看出趋势的口径，按推荐顺序：</p>\n<ol><li><strong>TensorBoard 的 Smoothing 拖到 0.99</strong>（图上左上角那个滑块；截图里的深色线就是默认 0.6）。 顺手勾上「Ignore outliers in chart scaling」，曲线立刻变成一条干净的下降线。</li><li><strong>看 <code>train/loss_ema</code></strong>：脚本现在会额外写这条标量（同一根事件流里），它就是实时进度行里的 EMA， 不受平滑滑块影响，换台机器看也一样。</li><li><strong>看 <code>eval/loss</code></strong>：它只跑固定的 100 条 held-out，内容不变，<strong>才是最该盯着的那条</strong>。 注意两点：①必须 <code>--eval-size 100</code>（默认值）且不加 <code>--no-eval</code>；②默认每 epoch 只量一次， 3 轮就 3 个点，看着像\"没数据\"——想密一点加 <code>--eval-steps 50</code>（每 50 步量一次，714 步约 14 个点， 每次多花几十秒）。</li><li><strong>看 <code>token_acc</code></strong>：从 0.69 到 0.74，比 loss 更直观 —— 它是「下一个 token 猜对的概率」。</li></ol>\n<h3 id=\"s7-h8\">7.5.0.1 想要「肉眼可见的成就感」，跑一次过拟合</h3>\n<p>小数据 + 多轮，loss 形状会干净得不像话（这说明管线完全正常）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">python 01-监督微调-SFT/code/train_sft.py --limit 100 --epochs 30 --tensorboard</code></pre></div>\n<p>100 条样本、batch 1×8 → 一个 epoch 13 步，30 轮约 390 步。通常几百步内 loss 从 2.x 掉到 0.2–0.3， 曲线一眼可见地贴着地板走。<strong>但这是背答案，不是学会能力</strong> —— 它的价值是验证「数据→掩码→梯度→权重更新」 这条链路，看完就去跑正常规模。</p>\n<h3 id=\"s7-h9\">7.5.1 想在浏览器里看？开 TensorBoard</h3>\n<p><code>loss.svg</code> 是「拍快照」，TensorBoard 是「实时交互」。加一个开关就行：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">python 01-监督微调-SFT/code/train_sft.py --dataset trl-lib/Capybara --limit 2000 --tensorboard</code></pre></div>\n<p>日志写在 <code>01-监督微调-SFT/runs/sft/tb/</code>。云上用 AutoDL 的 AutoPanel 时，把它链到面板认的目录：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">ln -sfn /root/Agentic-Post-training/01-监督微调-SFT/runs/sft/tb /root/tf-logs/sft</code></pre></div>\n<p>然后 AutoDL 控制台 → AutoPanel → TensorBoard。完整步骤（含 2、3 章并排对比、看不到曲线怎么排查） 见 <code>00-开始之前/cloud-setup.md</code> §12.4。</p>\n<h3 id=\"s7-h10\">7.6 训练前后对比</h3>\n<p>同一批 prompt，训练前（基座）和训练后（<abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 完）各生成一次：</p>\n<div class=\"codewrap\"><pre><code>  ── 同一类任务（修 bug） ──\n  prompt（最后一句）：calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。\n  模型输出：\n    ...</code></pre></div>\n<p>怎么读这段对比：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>看什么</th><th>训练前（基座）</th><th>训练后（<abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr>）</th></tr></thead><tbody><tr><td>有没有 <code>&lt;tool_call&gt;</code></td><td>一般没有，或写成正文 Markdown</td><td>出现结构化 <code>&lt;tool_call&gt;</code></td></tr><tr><td>参数是不是 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr></td><td>常是自然语言</td><td><code>{\"path\": \"calculator.py\"}</code></td></tr><tr><td>会不会等工具结果</td><td>不会（没有\"轮\"的概念）</td><td>会先读再改，最后给结论</td></tr><tr><td>会不会停</td><td>继续瞎编</td><td>输出 <code>&lt;|im_end|&gt;</code> 收尾</td></tr></tbody></table></div>\n<p>读这段时的两个常见误会：</p>\n<ul><li><strong>训练后算错了</strong>（比如 <code>-50629795314827</code> 这种）：不是脚本的 bug，是 0.6B 本来就背不下来 14 位数字。要看算术别用 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 判，看第 3 章的 <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr>。</li><li><strong>训练后开头是空的 <code>&lt;think&gt;\\n\\n&lt;/think&gt;</code></strong>：Qwen3 非思考模式就是这个形态（第 5 节讲过），不是模板坏了。</li></ul>\n<blockquote><p>注意：<strong>2 条数据只能验证流水线通不通，不能真的教会能力。</strong> 想看到明显变化，至少 100+ 条同格式轨迹（见 00 章\"数据从哪来\"）。</p></blockquote>"
   },
   {
    "id": "s8",
    "title": "8. 参数速查",
    "short": "参数速查",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>参数</th><th>作用</th><th>建议</th></tr></thead><tbody><tr><td><code>assistant_only_loss</code></td><td>只在 assistant token 上算 loss</td><td>agent 轨迹<strong>必开</strong></td></tr><tr><td><code>packing</code></td><td>多条样本拼进一个序列</td><td>短样本多时开；默认关，方便\"一条轨迹=一条序列\"对照</td></tr><tr><td><code>max_length</code></td><td>单条序列上限</td><td>≥ 最长轨迹；截断会把 assistant 段截没（本脚本 4096）</td></tr><tr><td><code>loss_type=\"dft\"</code></td><td>只用\"模型本来就预测对的 token\"算 loss</td><td>怕过拟合时试</td></tr><tr><td><code>chat_template_path</code></td><td>指定带 <code>{% generation %}</code> 的自定义模板</td><td>模板缺标记、又不想让 <abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> 自动改时用</td></tr><tr><td><code>eos_token</code></td><td>终止符</td><td>Qwen2.5 系需设 <code>\"&lt;|im_end|&gt;\"</code></td></tr><tr><td><code>learning_rate</code></td><td>学习率</td><td>全参 1e-5~2e-5；<abbr title=\"Low-Rank Adaptation —— 低秩适配\">LoRA</abbr> 1e-4 量级</td></tr></tbody></table></div>\n<h3 id=\"s8-h1\">自己改 chat template 的话</h3>\n<p>在 Jinja 里把 assistant 那段包起来即可：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-jinja\">{%- elif message.role == \"assistant\" %}{%- generation %}\n    ...（角色头、内容、tool_calls、&lt;|im_end|&gt;）...\n{%- endgeneration %}{%- elif message.role == \"tool\" %}</code></pre></div>\n<p>（真实模板还要处理 <code>tools</code> 列表与 <code>tool_calls</code> 渲染，建议就在 Qwen3 模板上改这两处，脚本里的 <code>patch_template()</code> 就是这么干的。）</p>"
   },
   {
    "id": "s9",
    "title": "9. 产物与验收",
    "short": "产物与验收",
    "html": "<h3 id=\"s9-h1\">9.1 训练日志里看什么</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>指标</th><th>含义</th><th>健康表现</th></tr></thead><tbody><tr><td><code>loss</code></td><td>只覆盖 assistant token 的交叉熵</td><td>稳定下降；0.3~1.0 区间常见</td></tr><tr><td><code>mean_token_accuracy</code></td><td>模型 top-1 猜中的比例</td><td>随 loss 上升（60%→85%+）</td></tr><tr><td><code>entropy</code></td><td>输出分布熵</td><td>缓降；掉到 0 附近=过拟合/塌缩</td></tr><tr><td><code>num_tokens</code></td><td>累计训练 token 数</td><td>用来估\"每个 epoch 实际学了多少\"</td></tr><tr><td><code>grad_norm</code></td><td>梯度范数</td><td>别持续爆炸（&gt;10）</td></tr></tbody></table></div>\n<h3 id=\"s9-h2\">9.2 离线自测（比 loss 更可信）</h3>\n<div class=\"codewrap\"><pre><code>□ 格式：会不会正确输出 tool_call 结构（而不是把 JSON 写进正文）\n□ 顺序：会不会先读再改（而不是直接 write_file 瞎猜内容）\n□ 停止：会不会在该结束时输出终止符，而不是无限调用工具</code></pre></div>\n<h3 id=\"s9-h3\">9.3 产物</h3>\n<ul><li><code>01-监督微调-SFT/ckpt/sft-agent/</code>：可继续做蒸馏 / <abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr> 的<strong>起点模型</strong></li><li><code>01-监督微调-SFT/runs/sft/report.md</code>：这次训练的证据（loss、前后对比），也是排查问题的第一手材料</li></ul>"
   },
   {
    "id": "s10",
    "title": "10. 常见坑",
    "short": "常见坑",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>坑</th><th>症状</th><th>解法</th></tr></thead><tbody><tr><td class=\"num\">1</td><td>没传 <code>tools</code> 列</td><td>模型在正文里写 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr>，而不是结构化 tool_call</td><td>把工具 schema 放进 <code>tools</code> 列</td></tr><tr><td class=\"num\">2</td><td><code>arguments</code> 类型不对</td><td>模板渲染成 Python <code>repr</code>（单引号），解析失败</td><td>统一成 dict 或 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr> 字符串</td></tr><tr><td class=\"num\">3</td><td>模板没有 <code>{% generation %}</code></td><td><code>assistant_masks</code> 全 0，或者 loss 直接 0 / NaN</td><td>用 <code>patch_template()</code> 打补丁，或让 <abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> 自动补（<code>assistant_only_loss=True</code>）</td></tr><tr><td class=\"num\">4</td><td>把 <code>tool_response</code> 也算进 loss</td><td>模型开始\"编造工具输出\"</td><td>工具结果的 token 必须 <code>-100</code>（它是 user 轮）</td></tr><tr><td class=\"num\">5</td><td>padding 的 label 没设 <code>-100</code></td><td>loss 虚高、学出一堆空格</td><td>collator 里 pad 的 label 一律 <code>-100</code></td></tr><tr><td class=\"num\">6</td><td><code>max_length</code> 太小</td><td>整条 assistant 被截掉，loss 变 0/NaN</td><td>调大，或过滤超长样本</td></tr><tr><td class=\"num\">7</td><td>忘了 Qwen3 的空 <code>&lt;think&gt;</code> 块</td><td>训完模型先吐一个空 think 再回答——其实正常</td><td>训练数据与推理保持一致即可</td></tr><tr><td class=\"num\">8</td><td>数据只有成功轨迹</td><td>一遇错就崩（原文明确指出的 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 局限）</td><td>这是 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 的天花板，靠第 2/3 步解决</td></tr><tr><td class=\"num\">9</td><td>学不会停止</td><td>生成不收敛到 <abbr title=\"End Of Sequence —— 序列结束符\">EOS</abbr></td><td>确认 <code>&lt;|im_end|&gt;</code> 在监督段内，且每条轨迹都以它结尾</td></tr></tbody></table></div>"
   },
   {
    "id": "s11",
    "title": "11. 练习与自测",
    "short": "练习与自测",
    "html": "<ol><li><strong>看掩码</strong>：跑 <code>python 01-监督微调-SFT/code/train_sft.py --inspect</code>，打开 <code>01-监督微调-SFT/runs/sft/tokens.txt</code>，找到第 4 条消息（<code>tool_response</code>）——确认它的每一行都是 <code>0</code>。再找到最后一条 assistant 的 <code>&lt;think&gt;</code>——确认它被监督了。</li><li><strong>改数据</strong>：加第 3 条轨迹，让它<strong>先跑测试看到报错、再读文件</strong>（顺序与现有样例相反），重跑，看掩码条的形状有没有变、模型有没有学到这个顺序。</li><li><strong>对照实验</strong>：把 <code>assistant_only_loss=True</code> 改成 <code>False</code> 再训一次，用同一个 prompt 推理——你应该能直观看到\"复述用户问题\"的现象。</li><li><strong>算比例</strong>：把 <code>--epochs</code> 从 3 改成 1，比较 <code>num_tokens</code> 与 <code>166 × 2 × epoch</code>，确认你真的只学了该学的部分。</li></ol>"
   },

  "title": "02 · 蒸馏",
  "heading": "02 · 蒸馏（Distillation）",
  "subtitle": "用教师的概率当监督",
  "sections": [
   {
    "id": "s1",
    "title": "1. 一句话定义",
    "short": "一句话定义",
    "html": "<p><strong>没有标准答案：学生自己写一版，教师逐 token 告诉它「换了我，每个词该有多大概率」，学生去对齐这个概率分布。</strong></p>\n<p><abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr>给的是<strong>一个</strong>答案（硬标签）；蒸馏给的是<strong>一整张概率表</strong>（软标签）。所以同样的数据量，蒸馏的信号密度高得多。</p>"
   },
   {
    "id": "s2",
    "title": "2. 原文译文 · 2. Distillation",
    "short": "原文译文 · 2. Distillation",
    "html": "<blockquote><p>蒸馏（distillation）用教师的 token 或概率来训练学生模型，而不是用硬标签。因为教师给了每个 token 一个值（或者说一整条分布），每个样本携带的信号比 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 更多，所以蒸馏往往需要更少的数据。</p>\n<p>但它有三个代价：学生的上限被教师封住；每一步训练都要额外跑一次教师（更慢、更占显存）；而且必须是 <strong>on-policy</strong> 的——学生自己生成，教师在这些 token 上打分，否则学生在自己会走的路径上收不到纠正。</p></blockquote>\n<h3 id=\"s2-h1\">原文推荐资源</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>Watch</td><td><a href=\"https://www.youtube.com/watch?v=GZT_oNQnLV4\" target=\"_blank\" rel=\"noopener\">Training Agents 2: distillation</a>（<a href=\"https://huggingface.co/collections/merve/training-agents-6a47a62b9f09867dccf61e1e\" target=\"_blank\" rel=\"noopener\">代码合集</a>）</td></tr><tr><td>Read</td><td><a href=\"https://huggingface.co/blog/distillation-2026\" target=\"_blank\" rel=\"noopener\">A brief history of distillation in AI</a>、<a href=\"https://huggingface.co/blog/distillation-2026\" target=\"_blank\" rel=\"noopener\">Distillation</a></td></tr><tr><td>Docs</td><td><a href=\"https://huggingface.co/docs/trl/distillation_trainer\" target=\"_blank\" rel=\"noopener\">Distillation Trainer</a></td></tr></tbody></table></div>"
   },
   {
    "id": "s3",
    "title": "3. 三种蒸馏，别混",
    "short": "三种蒸馏，别混",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>数据从哪来</th><th>监督是什么</th><th>在 <abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> 里</th></tr></thead><tbody><tr><td><strong>离线蒸馏</strong></td><td>教师先批量写好答案</td><td>硬标签（token id）</td><td>其实就是 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr>（用教师产的数据）</td></tr><tr><td><strong>On-policy 蒸馏（<abbr title=\"Generalized Knowledge Distillation —— 广义知识蒸馏\">GKD</abbr>）</strong></td><td><strong>学生当场生成</strong></td><td>教师在<strong>学生生成的那串 token</strong> 上的完整分布</td><td><code>DistillationTrainer</code></td></tr><tr><td><strong>自蒸馏</strong></td><td>学生生成（教师=同一模型+更多上下文）</td><td>同上</td><td>同为 <code>DistillationTrainer</code>，教师换配置</td></tr></tbody></table></div>\n<p>本教程讲第二种，也是 <abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr>实现的那一种（<abbr title=\"Generalized Knowledge Distillation —— 广义知识蒸馏\">GKD</abbr>，论文 2306.13649）。</p>"
   },
   {
    "id": "s4",
    "title": "4. 训练信号从哪来",
    "short": "训练信号从哪来",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>环节</th><th>内容</th></tr></thead><tbody><tr><td><strong>输入</strong></td><td>只有 <code>prompt</code>（任务描述）</td></tr><tr><td><strong>学生产出</strong></td><td>自己生成的一条 completion</td></tr><tr><td><strong>教师产出</strong></td><td>在<strong>同一串 token</strong> 上，每个位置的完整词表分布 <code>p_T(·|prefix)</code></td></tr><tr><td><strong>监督信号</strong></td><td>学生分布 <code>p_S</code> 与教师分布 <code>p_T</code> 的<strong>逐 token 散度</strong></td></tr><tr><td><strong>损失</strong></td><td><code>L = β·<abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>(p_T‖p_M) + (1-β)·<abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>(p_S‖p_M)</code>，<code>p_M = (1-β)p_S + β·p_T</code></td></tr><tr><td><strong>产物</strong></td><td>分布上贴近教师的模型</td></tr></tbody></table></div>\n<div class=\"codewrap\"><pre><code>        prompt\n          │\n          ├──────────────▶ 学生：自回归生成 completion  y_1..y_T\n          │                        │\n          │                        ├──▶ 学生 forward → p_S(·|y_&lt;t)   [T × V]\n          │                        │\n          └──────────────▶ 教师：对同一串 y 做 forward\n                                   │\n                                   └──▶ 教师 forward → p_T(·|y_&lt;t)   [T × V]\n                                             │\n                                             ▼\n                             逐 token 散度 → 取平均 → loss</code></pre></div>\n<p><strong>关键点</strong>：教师不是\"重新写一遍\"，而是<strong>给学生写的那串 token 打分</strong>。所以师生必须共用一个 tokenizer。</p>"
   },
   {
    "id": "s5",
    "title": "5. 全链路实拍：蒸馏一条样本，发生五件事",
    "short": "全链路实拍：蒸馏一条样本，发生五件事",
    "html": "<div class=\"codewrap\"><pre><code>JSONL（只有 prompt）\n   ──chat template (add_generation_prompt=True)──►  一段以「&lt;|im_start|&gt;assistant\\n」结尾的文本\n   ──tokenize──►  prompt 的 token id\n   ──学生 generate──►  completion（on-policy 的那一步）\n   ──学生/教师各 forward 一次──►  每个位置上两张概率表 ──► 散度 ──► loss</code></pre></div>\n<p>下面每段都是 <code>python 02-蒸馏/code/train_distill.py --inspect</code> / <code>python 02-蒸馏/code/train_distill.py</code> 会打印的内容。</p>\n<blockquote><p><strong>说明</strong>：带具体数字的段落是<strong>预期的示意值</strong>——脚本打印的字段与结构就是这些，数字随模型、采样和卡而变。 你跑完把 <code>02-蒸馏/runs/distill/report.md</code> 发我，我会把这里全部换成你的实测输出。</p></blockquote>\n<h3 id=\"s5-h1\">5.1 阶段 1：读 <abbr title=\"JSON Lines —— 按行存 JSON 的文本格式\">JSONL</abbr></h3>\n<div class=\"codewrap\"><pre><code>  文件：.../02-蒸馏/data/distill_prompts.jsonl\n  行数：3\n\n  ── 第 1 条  (2 条消息) ──\n    [system] 你是一个编程 agent。你可以读文件、写文件、跑测试。\n    [user] calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。</code></pre></div>\n<p><strong>没有 <code>completion</code>、没有 <code>answer</code>、没有 <code>ground_truth</code>。</strong> 这是蒸馏与 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 最根本的区别：</p>\n<div class=\"tablewrap\"><table><thead><tr><th></th><th><abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr></th><th>蒸馏</th></tr></thead><tbody><tr><td>数据里有答案吗</td><td>有（完整正确轨迹）</td><td><strong>没有</strong></td></tr><tr><td>一条数据训练几次</td><td>1 次（同一份答案）</td><td>每次都用新生成的 completion</td></tr><tr><td>数据量需求</td><td>大</td><td>小（prompt 少也能学）</td></tr></tbody></table></div>\n<h3 id=\"s5-h2\">5.2 阶段 2：套模板（结尾留白给模型）</h3>\n<p><code>add_generation_prompt=True</code> 渲染出来是（<code>▸</code> 标出角色分隔符）：</p>\n<div class=\"codewrap\"><pre><code>▸ &lt;|im_start|&gt;system\n  你是一个编程 agent。你可以读文件、写文件、跑测试。&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;user\n  calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;assistant</code></pre></div>\n<p>注意最后那个 <strong><code>▸ &lt;|im_start|&gt;assistant</code> 后面是空的</strong>——它在等学生往下写。这个\"留白位\"就是模型的起点。</p>\n<blockquote><p>对照 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr>：<abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 的数据里 assistant 后面<strong>已经写满了</strong>；蒸馏的数据里 assistant 后面<strong>是空的</strong>。</p></blockquote>\n<h3 id=\"s5-h3\">5.3 阶段 3：tokenize（只有 prompt）</h3>\n<div class=\"codewrap\"><pre><code>  prompt token 数：58\n\n   idx  token_id  token\n  ----------------------------\n     0    151644  &lt;|im_start|&gt;\n     1      8948  system\n     2       198  \\n\n     3     56568  你\n     ...\n    55    151645  &lt;|im_end|&gt;\n    56    151644  &lt;|im_start|&gt;\n    57     77091  assistant</code></pre></div>\n<p>到这里为止，和 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 的输入完全一样。<strong>区别从下一步开始。</strong></p>\n<h3 id=\"s5-h4\">5.4 阶段 4：学生自己生成 completion</h3>\n<div class=\"codewrap\"><pre><code>  学生：Qwen/Qwen2.5-0.5B-Instruct\n  采样：temperature=1.0  max_new_tokens=160\n\n  生成 137 个 token：\n  --------------------------------------------------------------------------\n  先看代码和测试。\n  &lt;tool_call&gt;\n  {\"name\": \"read_file\", \"arguments\": {\"path\": \"calculator.py\"}}\n  &lt;/tool_call&gt;\n  ...\n  --------------------------------------------------------------------------</code></pre></div>\n<p>这段文字<strong>没有标准答案可以对照</strong>：它可能对、可能错、可能中途跑偏。教师不改它，只是告诉它\"换了我，每个位置会怎么分布\"。</p>\n<p>于是训练样本变成 <code>prompt_ids + gen_ids</code>（58 + 137 = 195 个 token），<strong>loss 只算后 137 个位置</strong>——和 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 的掩码逻辑一模一样，只不过掩码不是\"数据规定的\"，而是\"学生自己写出来的那段\"。</p>\n<h3 id=\"s5-h5\">5.5 阶段 5：教师 vs 学生，逐 token 比分布</h3>\n<p>两个模型吃同一串 195 个 token，各输出 <code>[195, 151936]</code> 的 logits。取 completion 段的每个位置：</p>\n<div class=\"codewrap\"><pre><code>  i   学生写的词    p_学生   p_教师   教师首选      p_首选\n  --------------------------------------------------------------\n  0   先            0.412    0.637    先            0.637\n  1   看            0.588    0.771    看            0.771\n  2   代码          0.310    0.502    代码          0.502\n  3   和            0.244    0.398    和            0.398\n  ...\n  12  {\"            0.083    0.245    &lt;tool_call&gt;   0.551   ← 分歧最大的地方</code></pre></div>\n<p>最后一行是典型现象：<strong>学生想直接写 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr>，教师想先写 <code>&lt;tool_call&gt;</code> 标签</strong>。这个 token 的分布差会变成一份更大的梯度，把学生往教师那边拽。</p>\n<p>把每个位置的散度平均起来，就是这一步的 loss：</p>\n<div class=\"codewrap\"><pre><code>  平均散度  D(p_T‖p_S) = 0.1832      ← 195 个位置里 completion 那 137 个的平均\n  β = 0.5 时的蒸馏损失    = 0.0911</code></pre></div>\n<blockquote><p>训练时 <code>DistillationTrainer</code> 每步都做这件事，且是<strong>分块</strong>算的： 一次性物化 <code>[seq, 151936]</code> 的 float32 是 195×151936×4 ≈ 118MB，序列一长就 OOM， 所以它按 chunk 算 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>，再累加。</p></blockquote>\n<h3 id=\"s5-h6\">5.6 损失怎么算：一个 token 的 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>，手算</h3>\n<p>上面那张表只给了「p_学生 / p_教师」，但那只是分布里的<strong>一个格子</strong>。真正的损失要看<strong>整个词表 151936 个格子</strong>怎么对不上。下面把词表砍到 4 个词，手算一遍。</p>\n<p><strong>① 两个分布</strong>（同一个位置，学生 vs 教师）</p>\n<div class=\"tablewrap\"><table><thead><tr><th>词</th><th>教师 p_T</th><th>学生 p_S</th></tr></thead><tbody><tr><td><code>先</code></td><td class=\"num\">0.60</td><td class=\"num\">0.50</td></tr><tr><td><code>看</code></td><td class=\"num\">0.30</td><td class=\"num\">0.30</td></tr><tr><td><code>&lt;tool_call&gt;</code></td><td class=\"num\">0.08</td><td class=\"num\">0.15</td></tr><tr><td><code>{\"</code></td><td class=\"num\">0.02</td><td class=\"num\">0.05</td></tr></tbody></table></div>\n<p>学生把本该给 <code>&lt;tool_call&gt;</code> 的 0.10 概率挪给了 <code>{\"</code> —— 典型的「想直接写 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr>」毛病。</p>\n<p><strong>② 每个词贡献多少</strong>：<code>p_T · ln(p_T / p_S)</code></p>\n<div class=\"tablewrap\"><table><thead><tr><th>词</th><th>p_T·ln(p_T/p_S)</th><th>说明</th></tr></thead><tbody><tr><td><code>先</code></td><td>0.60 × ln(1.20) = <strong>+0.1094</strong></td><td>学生低估了 → 正贡献</td></tr><tr><td><code>看</code></td><td>0.30 × ln(1.00) = <strong>0</strong></td><td>一致 → 无贡献</td></tr><tr><td><code>&lt;tool_call&gt;</code></td><td>0.08 × ln(0.533) = <strong>−0.0503</strong></td><td>学生高估了 → 负贡献</td></tr><tr><td><code>{\"</code></td><td>0.02 × ln(0.40) = <strong>−0.0183</strong></td><td>同上</td></tr><tr><td><strong>合计</strong></td><td><strong>0.0408</strong></td><td>这个位置的散度</td></tr></tbody></table></div>\n<p>三个规律：</p>\n<ul><li>只有<strong>教师认为可能</strong>的词（<code>p_T &gt; 0</code>）才进求和 —— 学生瞎猜的分布空间不会被惩罚，这是 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> 的不对称性。</li><li>学生<strong>低估</strong>教师看好的词 → 正贡献（把学生往上拽）。</li><li>学生<strong>高估</strong>教师不看好的词 → 负贡献（把它压下去）。</li><li>两边完全一致时，每一项都是 0。</li></ul>\n<p><strong>③ 换成反方向呢</strong>：<code>p_S · ln(p_S / p_T)</code></p>\n<div class=\"tablewrap\"><table><thead><tr><th>词</th><th>p_S·ln(p_S/p_T)</th></tr></thead><tbody><tr><td><code>先</code></td><td>0.50 × ln(0.833) = −0.0912</td></tr><tr><td><code>看</code></td><td class=\"num\">0</td></tr><tr><td><code>&lt;tool_call&gt;</code></td><td>0.15 × ln(1.875) = +0.0943</td></tr><tr><td><code>{\"</code></td><td>0.05 × ln(2.5) = +0.0458</td></tr><tr><td><strong>合计</strong></td><td><strong>0.0489</strong></td></tr></tbody></table></div>\n<p>数值不同（0.0408 vs 0.0489）—— <strong><abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> 不对称</strong>，这就是 β 存在的理由：你可以选往哪边偏。</p>\n<p><strong>④ β 混合后</strong>（β = 0.5）：先把两个分布掺成中间的 <span class=\"imath\" data-tex=\"p_M = (1-\\beta)p_S + \\beta p_T\"></span>，再各算一次「到 <span class=\"imath\" data-tex=\"p_M\"></span>」的 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>：</p>\n<div class=\"fxl\" data-fx=\"{&quot;title&quot;: &quot;蒸馏的损失：在两种 KL 之间滑动&quot;, &quot;tex&quot;: &quot;L_\\\\beta = \\\\begin{cases} \\\\mathrm{KL}\\\\left(p_T \\\\,\\\\|\\\\, p_S\\\\right) &amp; \\\\beta=0 \\\\\\\\[2pt] \\\\mathrm{KL}\\\\left(p_S \\\\,\\\\|\\\\, p_T\\\\right) &amp; \\\\beta=1 \\\\\\\\[2pt] \\\\beta\\\\cdot\\\\mathrm{KL}\\\\left(p_T \\\\,\\\\|\\\\, p_M\\\\right)+(1-\\\\beta)\\\\cdot\\\\mathrm{KL}\\\\left(p_S \\\\,\\\\|\\\\, p_M\\\\right) &amp; 0&lt;\\\\beta&lt;1 \\\\end{cases}&quot;, &quot;note&quot;: &quot;学生自己生成句子，教师在同这句话的每个 token 上给一整套分布，学生去对齐它。&quot;, &quot;kids&quot;: [{&quot;label&quot;: &quot;\\\\mathrm{KL}\\\\left(p_T \\\\,\\\\|\\\\, p_S\\\\right)&quot;, &quot;name&quot;: &quot;前向 KL（β=0）&quot;, &quot;def&quot;: &quot;\\\\mathrm{KL}\\\\left(p\\\\|q\\\\right)=\\\\sum_{x}p(x)\\\\log\\\\frac{p(x)}{q(x)}&quot;, &quot;note&quot;: &quot;教师认为可能的词，学生也必须留概率，否则这一项爆炸——所以学生会被摊平。&quot;, &quot;kids&quot;: [{&quot;label&quot;: &quot;p(x)\\\\log\\\\frac{p(x)}{q(x)}&quot;, &quot;name&quot;: &quot;单个词的贡献&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;教师 0.60 / 学生 0.50 → +0.1094；教师 0.02 / 学生 0.05 → -0.0183。&quot;, &quot;kids&quot;: []}, {&quot;label&quot;: &quot;\\\\log\\\\frac{p(x)}{q(x)}&quot;, &quot;name&quot;: &quot;对数比&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;低估教师看好的词时为正，高估时为负；四项相加就是这一位置的散度。&quot;, &quot;kids&quot;: []}]}, {&quot;label&quot;: &quot;\\\\mathrm{KL}\\\\left(p_S \\\\,\\\\|\\\\, p_T\\\\right)&quot;, &quot;name&quot;: &quot;反向 KL（β=1）&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;反过来，只惩罚「学生押注了教师不认可的词」，学生容易塌进教师的主模式。&quot;, &quot;kids&quot;: []}, {&quot;label&quot;: &quot;p_M&quot;, &quot;name&quot;: &quot;掺出来的中间分布&quot;, &quot;def&quot;: &quot;p_M=(1-\\\\beta)\\\\,p_S+\\\\beta\\\\,p_T&quot;, &quot;note&quot;: &quot;β=0.5 时取两者平均，这正是 JSD 的定义。&quot;, &quot;kids&quot;: []}, {&quot;label&quot;: &quot;\\\\beta&quot;, &quot;name&quot;: &quot;往教师偏多少&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;0 = 纯前向 KL，1 = 纯反向 KL，0.5 = 对称 JSD；注意 TRL 的 DistillationConfig 默认是 1.0。&quot;, &quot;kids&quot;: [{&quot;label&quot;: &quot;\\\\beta\\\\to 1&quot;, &quot;name&quot;: &quot;端点附近的线性行为&quot;, &quot;def&quot;: &quot;L_\\\\beta \\\\approx (1-\\\\beta)\\\\cdot\\\\mathrm{KL}\\\\left(p_S\\\\|p_T\\\\right)&quot;, &quot;note&quot;: &quot;所以 β=1 打印 0.0000、β=0.99 打印 ≈0.0005，斜率才是那条 KL。&quot;, &quot;kids&quot;: []}]}, {&quot;label&quot;: &quot;p_T \\\\,/\\\\, p_S&quot;, &quot;name&quot;: &quot;教师 / 学生分布&quot;, &quot;def&quot;: &quot;&quot;, &quot;note&quot;: &quot;都在同一个 151936 维词表上，逐 token 算一次，一条 completion 有 137 个位置。&quot;, &quot;kids&quot;: []}]}\"><div class=\"fx-title\">蒸馏的损失：在两种 KL 之间滑动</div><div class=\"fx-root math\" data-tex=\"L_\\beta = \\begin{cases} \\mathrm{KL}\\left(p_T \\,\\|\\, p_S\\right) &amp; \\beta=0 \\\\[2pt] \\mathrm{KL}\\left(p_S \\,\\|\\, p_T\\right) &amp; \\beta=1 \\\\[2pt] \\beta\\cdot\\mathrm{KL}\\left(p_T \\,\\|\\, p_M\\right)+(1-\\beta)\\cdot\\mathrm{KL}\\left(p_S \\,\\|\\, p_M\\right) &amp; 0&lt;\\beta&lt;1 \\end{cases}\"></div><p class=\"fx-hint\">点下面的胶囊，逐项拆到最底层。</p></div>\n<p><strong>为什么端点是分开写的？</strong> 因为中间那个式子在端点上会自己退化成 0：</p>\n<ul><li>β = 1 时 <span class=\"imath\" data-tex=\"p_M = p_T\"></span>，于是 <span class=\"imath\" data-tex=\"\\mathrm{KL}(p_T\\|p_M)=0\"></span>，而 <span class=\"imath\" data-tex=\"(1-\\beta)\"></span> 这个权重也是 0 —— 两项都没了。</li><li>β = 0 时 <span class=\"imath\" data-tex=\"p_M = p_S\"></span>，同理。</li></ul>\n<p>也就是说，中间式只在 <span class=\"imath\" data-tex=\"0&lt;\\beta&lt;1\"></span> 区间内是\"散度\"；<strong>两个端点要单独定义成那条 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr></strong>。这也正是 <code>trl/experimental/gkd/gkd_trainer.py</code> 里 <code>generalized_jsd_loss()</code> 写成 <code>if beta == 0 … elif beta == 1 … else …</code> 三个分支的原因（源码 278–297 行）。</p>\n<p>端点附近中间式并不是真的\"没有梯度\"，它是<strong>线性趋于 0</strong>：</p>\n<div class=\"math\" data-tex=\"\\begin{aligned}\n\\beta \\to 1:\\quad &amp; L_\\beta \\approx (1-\\beta)\\cdot \\mathrm{KL}(p_S\\|p_T) = (1-\\beta)\\times 0.0489 \\\\\n\\beta \\to 0:\\quad &amp; L_\\beta \\approx \\beta\\cdot \\mathrm{KL}(p_T\\|p_S) = \\beta\\times 0.0408\n\\end{aligned}\"></div>\n<p>所以 β=1 时你看到 <code>L = 0.0000</code>、β=0.99 时看到 <code>L ≈ 0.0005</code>，斜率才是那条 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>。这也解释了为什么<strong>不同 β 之间的 loss 数值不能直接比大小</strong>（见下面第 ⑤ 条）。</p>\n<div class=\"tablewrap\"><table><thead><tr><th>符号</th><th>含义</th><th>本例取值</th></tr></thead><tbody><tr><td><span class=\"imath\" data-tex=\"p_T\"></span></td><td>教师在该位置的概率分布（词表上的一个向量）</td><td><code>[0.60, 0.30, 0.08, 0.02]</code></td></tr><tr><td><span class=\"imath\" data-tex=\"p_S\"></span></td><td>学生<strong>自己生成</strong>这句话时给出的分布</td><td><code>[0.50, 0.30, 0.15, 0.05]</code></td></tr><tr><td><span class=\"imath\" data-tex=\"p_M\"></span></td><td>掺起来的中间分布 <span class=\"imath\" data-tex=\"(1-\\beta)p_S+\\beta p_T\"></span></td><td>β=0.5 → <code>[0.55, 0.30, 0.115, 0.035]</code></td></tr><tr><td><span class=\"imath\" data-tex=\"\\mathrm{KL}(p\\|q)\"></span></td><td><span class=\"imath\" data-tex=\"\\sum_v p_v \\ln\\frac{p_v}{q_v}\"></span>，两项分布差多远</td><td>0.0120（对教师）、0.0100（对学生）</td></tr><tr><td><span class=\"imath\" data-tex=\"\\beta\"></span></td><td>往教师偏多少：0 = 纯前向 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>，1 = 纯反向 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr>，0.5 = <abbr title=\"Jensen-Shannon Divergence —— JSD 散度\">JSD</abbr></td><td><code>DistillationConfig.beta</code>（<strong>默认 1.0</strong>）</td></tr></tbody></table></div>\n<p>代入数字：</p>\n<div class=\"math\" data-tex=\"L_{0.5} = 0.5 \\times 0.0120 + 0.5 \\times 0.0100 = 0.0110\"></div>\n<p><strong>为什么它不是两个 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> 的平均</strong>：<span class=\"imath\" data-tex=\"p_M\"></span> 本身随 <span class=\"imath\" data-tex=\"\\beta\"></span> 移动，所以 <span class=\"imath\" data-tex=\"\\beta\"></span> 一变，两个 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> 的靶子也变；β=0.5 时它恰好等于 <abbr title=\"Jensen-Shannon Divergence —— JSD 散度\">JSD</abbr>（对称、有界，上限 <span class=\"imath\" data-tex=\"\\ln 2 \\approx 0.693\"></span>）。</p>\n<p>β=0.5 时比单独用任一边都小（0.0110 vs 0.0408 / 0.0489）—— 因为 <span class=\"imath\" data-tex=\"p_M\"></span> 在两者中间，两边都「够近」。<abbr title=\"Jensen-Shannon Divergence —— JSD 散度\">JSD</abbr> 的名字就是这么来的。但<strong>这个更小不代表拟合更好</strong>：分子里的靶子变了，不是同一个量。</p>\n<blockquote><p>想从「熵 → 交叉熵 → <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> → JS」把这条线一次看全，见 <a class=\"il\" href=\"#/ch7\">第 6 章 · 理论串联</a>。</p></blockquote>\n<p><strong>⑤ 最后怎么变成一个数</strong></p>\n<div class=\"codewrap\"><pre><code>  loss = 1/|completion| · Σ_{t ∈ completion}  L_t</code></pre></div>\n<ul><li><strong>只对 completion 的 token 求平均</strong>，prompt 段 <code>mask=0</code>（和 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 完全一样的规矩）。</li><li>每个 <code>L_t</code> 又是对整个词表求和 —— 所以真正算的时候是 <code>[137, 151936]</code> 的张量一次性算完，再按 mask 平均。</li><li>数字看着小（0.011、0.04）是正常的：分布越接近，值越趋近 0；两个分布完全错开时才会到 1 以上。</li></ul>\n<blockquote><p><code>code/train_distill.py --explain-loss</code> 会把这段原样打印出来（含每一行的乘法）。</p></blockquote>\n<h3 id=\"s5-h7\">5.7 一个训练步里的张量（形状速查）</h3>\n<div class=\"codewrap\"><pre><code>  input_ids       [1, 195]              # prompt(58) + completion(137)\n  completion_mask [1, 195]              # 前 58 个 0，后 137 个 1\n  student_logits  [1, 195, 151936]      # 学生前向\n  teacher_logits  [1, 195, 151936]      # 教师前向（多一份显存）\n  loss            scalar                # 只在 mask=1 的位置上平均</code></pre></div>\n<p><strong>显存账</strong>：比 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 多一整个教师的权重 + 一次教师前向的激活。0.5B 学生 + 1.5B 教师，24GB 卡上 <code>max_completion_length=1024</code> 很宽松。</p>"
   },

    "id": "s6",
    "title": "6. 跑起来",
    "short": "跑起来",
    "html": "<p>脚本目录：<a class=\"il\" href=\"#\"><code>code/</code></a>（8 个文件，入口 <code>train_distill.py</code>）</p>\n<h3 id=\"s6-h1\">6.1 两套数据，别混用</h3>\n<div class=\"tablewrap\"><table><thead><tr><th></th><th>本地解剖样本</th><th>官方训练集</th></tr></thead><tbody><tr><td>位置</td><td><code>data/distill_prompts.jsonl</code>（3 条 prompt）</td><td><code>--dataset trl-lib/ultrafeedback-prompt</code>（6.4 万条 prompt）</td></tr><tr><td>用来看</td><td>模板怎么套、教师与学生的分布差在哪（5.7 节那张表）</td><td><strong>蒸馏效果</strong>：held-out 平均前向 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> 有没有下降</td></tr><tr><td>能不能训出东西</td><td>不能。3 条 prompt 训 20 步只是把教师在这 3 条上的输出背下来</td><td>能</td></tr></tbody></table></div>\n<p>蒸馏的训练集<strong>只需要 prompt</strong>——这是它比 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 省数据的地方（<abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 每条都要人工/强模型写完整轨迹，蒸馏只要问题）。 本地这 3 条的作用是把「教师怎么打分」摊开给你看。</p>\n<h3 id=\"s6-h2\">6.2 命令</h3>\n<p><strong>所有命令都在仓库根目录执行</strong>（不需要 cd 进 <code>code/</code>）。</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># (1) 只跑数据链路（只要 tokenizer，不需要 GPU）\npython 02-蒸馏/code/train_distill.py --inspect\n\n# (1).5 不加载模型，把 5.6 节的 KL / JSD 手算打一遍（纯数学）\npython 02-蒸馏/code/train_distill.py --explain-loss\n\n# (2) 本地 3 条 prompt 跑通全流程（验证管线，不代表效果）\npython 02-蒸馏/code/train_distill.py --max-steps 20 --gen-tokens 96\n\n# (3) 真正蒸馏：官方数据集 3000 条 prompt，留 100 条算 held-out KL\npython 02-蒸馏/code/train_distill.py --dataset trl-lib/ultrafeedback-prompt --limit 3000 --eval-size 100\n\n# 变体\npython 02-蒸馏/code/train_distill.py --beta 0.0                  # 前向 KL（只学教师分布的面）\npython 02-蒸馏/code/train_distill.py --beta 1.0                  # 反向 KL（学生更集中）\npython 02-蒸馏/code/train_distill.py --temperature 1.5           # 更软的教师分布\npython 02-蒸馏/code/train_distill.py --teacher Qwen/Qwen2.5-7B-Instruct   # 换更强的老师（显存要够）</code></pre></div>\n<p>依赖：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">pip install -i https://pypi.tuna.tsinghua.edu.cn/simple \\\n  \"trl&gt;=1.16.0\" transformers datasets accelerate</code></pre></div>\n<h4 id=\"s6-h3\">代码不是一个 700 行的文件</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>文件</th><th>负责什么</th></tr></thead><tbody><tr><td><code>code/train_distill.py</code></td><td>入口：解析参数、按顺序调用下面这些</td></tr><tr><td><code>code/common.py</code></td><td>仓库根路径、<code>02-蒸馏/runs/distill</code>·<code>02-蒸馏/ckpt/distill-agent</code>、学生/教师默认名、设备与 dtype</td></tr><tr><td><code>code/distill_data.py</code></td><td>阶段 1：读 prompt（本地 jsonl / 官方数据集）、切 held-out</td></tr><tr><td><code>code/distill_prompt.py</code></td><td>阶段 2~3：<code>add_generation_prompt</code> 模板、tokenize</td></tr><tr><td><code>code/distill_probe.py</code></td><td>阶段 4~5：学生生成、教师分布对比、held-out <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> 探针</td></tr><tr><td><code>code/distill_trainer.py</code></td><td>阶段 6：DistillationTrainer + 训练前后各测一次 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr></td></tr><tr><td><code>code/distill_report.py</code></td><td><code>loss.svg</code> 曲线 + <code>02-蒸馏/runs/distill/report.md</code></td></tr><tr><td><code>code/distill_loss.py</code></td><td>5.6 节那张 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> / <abbr title=\"Jensen-Shannon Divergence —— JSD 散度\">JSD</abbr> 手算表（<code>--explain-loss</code>）</td></tr></tbody></table></div>\n<div class=\"tablewrap\"><table><thead><tr><th>产物</th><th>内容</th></tr></thead><tbody><tr><td><code>02-蒸馏/runs/distill/report.md</code></td><td><strong>把这份发我</strong>：分布表、held-out <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> 前/后、loss 曲线、loss 表</td></tr><tr><td><code>02-蒸馏/runs/distill/tokens.txt</code></td><td>全量 token 表</td></tr><tr><td><code>02-蒸馏/runs/distill/loss.csv</code></td><td>每步 loss</td></tr><tr><td><code>02-蒸馏/ckpt/distill-agent/</code></td><td>蒸馏后的学生</td></tr></tbody></table></div>\n<h3 id=\"s6-h4\">6.3 训练时终端长这样</h3>\n<div class=\"codewrap\"><pre><code>  学生参数：494M\n  教师参数：1544M\n  训练前 held-out 平均 KL：0.812   （100 条）\n\n  step   1  loss 0.4213  lr 3.3e-07  grad 2.881  ent 1.42  len 118  clip 0.00\n  step   2  loss 0.3702  lr 6.7e-07  grad 2.104  ent 1.35  len 124  clip 0.00\n  step   3  loss 0.3511  lr 1.0e-06  grad 1.933  ent 1.31  len 121  clip 0.00\n  ...\n  训练后 held-out 平均 KL：0.281   （100 条）</code></pre></div>\n<h3 id=\"s6-h5\">6.4 损失图</h3>\n<p>训练中每 20 步重画 <code>02-蒸馏/runs/distill/loss.svg</code>，<code>report.md</code> 里直接 <code>![loss 曲线](loss.svg)</code> 引用它（<strong>没跑过训练时这张图不存在，属正常</strong>）； 终端里同步显示一行实时进度（含 EMA 与最近 28 步的方块走势）。</p>\n<h3 id=\"s6-h6\">6.5 训练前后对比</h3>\n<div class=\"codewrap\"><pre><code>  ── 用例 1（held-out 里取一条）──\n  prompt：calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。\n  蒸馏前（基座学生）：……\n  蒸馏后：……</code></pre></div>\n<p>判断蒸馏有没有起效，别只看 loss（它永远降不到 0），看这三个：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>看什么</th><th>训练前</th><th>训练后</th></tr></thead><tbody><tr><td><strong>held-out 平均前向 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr></strong></td><td>0.8 左右</td><td>下降 40% 以上</td></tr><tr><td>有没有按教师的<strong>结构</strong>写（<code>&lt;tool_call&gt;</code>）</td><td>直接写 <abbr title=\"JavaScript Object Notation —— JS 对象表示法\">JSON</abbr> / 写自然语言</td><td>出现结构化标签</td></tr><tr><td>生成长度</td><td>一句话就结束、或跑到上限被截</td><td>落在合理区间、能正常收尾</td></tr></tbody></table></div>"

    "id": "s7",
    "title": "7. 参数速查",
    "short": "参数速查",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>参数</th><th>作用</th><th>默认</th><th>建议</th></tr></thead><tbody><tr><td><code>beta</code></td><td>散度选择器（见下表）</td><td><code>1.0</code></td><td>先 <code>0.5</code></td></tr><tr><td><code>temperature</code></td><td><strong>同时</strong>给生成与损失用</td><td><code>1.0</code></td><td>1.0~2.0；越高教师分布越软、信息越多也越抖</td></tr><tr><td><code>max_completion_length</code></td><td>学生单条生成上限</td><td><code>512</code></td><td>多轮工具调用要调大；本脚本默认 160</td></tr><tr><td><code>teacher_model</code></td><td>教师</td><td>必填</td><td>比学生大 1 个量级即可</td></tr><tr><td><code>use_vllm</code> / <code>vllm_mode</code></td><td>用 vLLM 生成学生 rollout</td><td><code>False</code> / <code>colocate</code></td><td>规模上来后必开</td></tr><tr><td><code>max_tool_calling_iterations</code></td><td>允许的最多工具轮数</td><td>—</td><td>多轮 agent 时设</td></tr><tr><td><code>remove_unused_columns</code></td><td>是否删掉数据集多余列</td><td><code>False</code></td><td>蒸馏里保持 <code>False</code></td></tr></tbody></table></div>\n<h3 id=\"s7-h1\">β 的三个取值</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>β</th><th>公式</th><th>直觉</th><th>什么时候用</th></tr></thead><tbody><tr><td><code>0.0</code></td><td><code>D_KL[p_T ‖ p_S]</code></td><td><strong>前向 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr></strong>：教师有概率处学生也必须有 → 学生\"铺得开\"</td><td>想保留多样性</td></tr><tr><td><code>1.0</code>（<abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> 默认）</td><td><code>D_KL[p_S ‖ p_T]</code></td><td><strong>反向 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr></strong>：学生只学教师最确定的部分 → \"学得尖\"</td><td>想要确定的学生</td></tr><tr><td><code>0.5</code>（脚本默认）</td><td>标准 <abbr title=\"Jensen-Shannon Divergence —— JSD 散度\">JSD</abbr></td><td>折中、数值稳</td><td>通用首选</td></tr></tbody></table></div>\n<blockquote><p>⚠️ <code>DistillationConfig.beta</code> 和 <code>GRPOConfig.beta</code> <strong>同名但完全不同</strong>： 这里是\"用哪种散度\"，<abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr>里是\"对参考模型的 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> 惩罚系数\"。别抄错。</p></blockquote>\n<blockquote><p>小细节：<code>DistillationConfig</code> 的默认值与 <code>TrainingArguments</code> 不同—— <code>logging_steps=10</code>、<code>gradient_checkpointing=True</code>、未设 <code>fp16</code> 时 <code>bf16=True</code>、<code>lr=1e-6</code>。</p></blockquote>"

    "title": "8. 产物与验收",
    "short": "产物与验收",
    "html": "<h3 id=\"s8-h1\">8.1 日志指标</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>指标</th><th>含义</th><th>健康表现</th></tr></thead><tbody><tr><td><code>loss</code></td><td>散度均值</td><td>下降，但<strong>不会降到 0</strong>（学生追不上教师）</td></tr><tr><td><code>num_tokens</code></td><td>累计 token</td><td>估吞吐</td></tr><tr><td><code>step_time</code></td><td>每步耗时</td><td>明显高于 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr>（多一次教师前向）</td></tr><tr><td><code>completions/mean_length</code></td><td>学生平均生成长度</td><td>别一路顶到上限（说明不会停）</td></tr><tr><td><code>completions/mean_terminated_length</code></td><td>正常以 <abbr title=\"End Of Sequence —— 序列结束符\">EOS</abbr> 结束的平均长度</td><td>与上面接近才健康</td></tr><tr><td><code>completions/clipped_ratio</code></td><td>被截断的比例</td><td>长期 &gt;0.2 就调大 <code>max_completion_length</code></td></tr><tr><td><code>tools/call_frequency</code></td><td>平均每次生成调用几次工具</td><td>从 0 涨起来说明学会了用工具</td></tr><tr><td><code>tools/failure_frequency</code></td><td>工具调用失败率</td><td>应下降</td></tr><tr><td><code>entropy</code></td><td>输出分布熵</td><td>缓降；掉到 0 附近=塌缩</td></tr></tbody></table></div>\n<h3 id=\"s8-h2\">8.2 判断\"蒸馏成功\"的三个问题</h3>\n<ol><li>学生生成的<strong>结构</strong>像教师了吗（<code>&lt;tool_call&gt;</code>、<code>&lt;think&gt;</code>、收尾）？</li><li>同样的 prompt，学生的答案<strong>稳定性</strong>提高了吗（多采几次看方差）？</li><li>学生在<strong>自己容易犯错的那些位置</strong>上，<code>p_教师 - p_学生</code> 缩小了吗？（看 §5.5 那张表前后对比）</li></ol>\n<h3 id=\"s8-h3\">8.3 产物</h3>\n<ul><li><code>02-蒸馏/ckpt/distill-agent/</code>：可以做 <abbr title=\"Reinforcement Learning —— 强化学习\">RL</abbr>的起点（通常比 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 版更\"会写\"）</li><li><code>02-蒸馏/runs/distill/report.md</code>：这次蒸馏的证据</li></ul>"

    "short": "常见坑",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>坑</th><th>症状</th><th>解法</th></tr></thead><tbody><tr><td class=\"num\">1</td><td>师生 tokenizer 不一致</td><td>蒸馏完全学不动（token 下标错位）</td><td>用同一个 tokenizer / 同一个词表</td></tr><tr><td class=\"num\">2</td><td>把 <code>beta</code> 当成 <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr> 的 <abbr title=\"Kullback-Leibler divergence —— KL 散度\">KL</abbr> 系数</td><td>调了没反应，或学生塌缩</td><td>这里 beta 是\"选散度\"，不是惩罚</td></tr><tr><td class=\"num\">3</td><td><code>max_completion_length</code> 太小</td><td><code>clipped_ratio</code> 高，学生学不会收尾</td><td>调大；多轮时要按整 episode 预算</td></tr><tr><td class=\"num\">4</td><td><code>temperature</code> 只调了生成没调损失</td><td>前后不一致，分布对不上</td><td><abbr title=\"Transformer Reinforcement Learning —— TRL 库\">TRL</abbr> 里同一个 temperature 两处都用；自己实现时注意</td></tr><tr><td class=\"num\">5</td><td>数据里塞了 <code>completion</code></td><td>被当成普通列忽略，或者报字段错</td><td>蒸馏数据集<strong>只放 prompt</strong></td></tr><tr><td class=\"num\">6</td><td>教师太大、学生太小</td><td>loss 降不下去（容量差太多）</td><td>教师大 1 个量级即可</td></tr><tr><td class=\"num\">7</td><td>以为 loss 到 0 才算成功</td><td>永远等不到</td><td>学生追不上教师是常态，看结构与稳定性</td></tr></tbody></table></div>"

    "id": "s2",
    "title": "1. 一句话定义",
    "short": "一句话定义",
    "html": "<p>给同一个问题采样 G 个答案，逐条打分，然后<strong>让「比组内平均分高」的答案更可能出现、比平均分低的更不可能</strong>。</p>\n<p>不需要教师模型，也不需要标准答案轨迹 —— 只需要一个能判断对错的东西。这是从「抄」转向「练」的分水岭。</p>"

    "id": "s3",
    "title": "2. 原文译文 · 3. Reinforcement learning (RL)",
    "short": "原文译文 · 3. Reinforcement learning (RL)",
    "html": "<blockquote><p>在强化学习中，模型从对自己输出的一个分数里学习。它写一个答案，奖励函数给它打分，训练让高分答案变得更可能。这样就不再需要教师 —— 只要能校验答案就够了。</p>\n<p>这一步用的算法是 <strong><abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr>（Group Relative Policy Optimization）</strong>。对每个 prompt，它采样若干个答案，给它们全部打分，然后提高那些得分高于组内平均的答案的概率。在组内比较答案，就告诉了模型哪些尝试更好，而不需要另外训练一个模型来估计这件事（这正是它相对 <abbr title=\"Proximal Policy Optimization —— 近端策略优化\">PPO</abbr> 省掉 critic 的地方）。</p>\n<p>这个信号比蒸馏弱：整条答案只有一分数，而不是每个 token 一个值，所以模型需要很多次尝试才能学到东西。用普通奖励函数时，每个答案只有一轮、只打一次分。而环境让模型可以行动多次，并看到每个动作的结果。</p></blockquote>\n<p><strong>原文推荐资源</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>Watch</td><td><a href=\"https://huggingface.co/collections/merve/training-agents-3-reinforcement-learning-6ad6aa71050342629dd0e3ec\" target=\"_blank\" rel=\"noopener\">Training Agents 3: reinforcement learning</a>（合集）</td></tr><tr><td>Read</td><td><a href=\"https://huggingface.co/blog/merve/agentic-rl-2026\" target=\"_blank\" rel=\"noopener\">How frontier models train on outcomes in 2026</a></td></tr><tr><td>Project</td><td><a href=\"https://huggingface.co/spaces/merve/grpo-with-trl-ifstruct\" target=\"_blank\" rel=\"noopener\">Fine-tuning a 350M model for structured outputs in 100 <abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr> steps</a></td></tr><tr><td>Docs</td><td><a href=\"https://huggingface.co/docs/trl/grpo_trainer\" target=\"_blank\" rel=\"noopener\"><abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr> Trainer</a></td></tr></tbody></table></div>"

    "title": "3. 训练信号从哪来",
    "short": "训练信号从哪来",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>环节</th><th>内容</th></tr></thead><tbody><tr><td>输入</td><td>prompt + <strong>判分依据</strong>（标准答案、单测、正则…）</td></tr><tr><td>模型产出</td><td>G 条完整答案 + 每条的分数</td></tr><tr><td>监督信号</td><td><strong>每条答案一个标量</strong> <code>r_i</code>，组内归一化成优势 <code>A_i</code></td></tr><tr><td>损失</td><td>策略梯度：提高 <code>A&gt;0</code> 的 token 概率、压低 <code>A&lt;0</code> 的</td></tr><tr><td>和 <abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 的差别</td><td><abbr title=\"Supervised Fine-Tuning —— 监督微调\">SFT</abbr> 学「这个 token 一定对」；<abbr title=\"Group Relative Policy Optimization —— 组相对策略优化\">GRPO</abbr> 只学「这条路整体更好」</td></tr></tbody></table></div>\n<p><strong>信号密度对比</strong>（这就是原文说的「比蒸馏弱」）：</p>\n<div class=\"codewrap\"><pre><code>SFT        : 166 个 token，每个都有确定答案        → 强、稳，但只会模仿\n蒸馏        : 每 token 一个教师分布（几千维）        → 最强，但要教师\nGRPO       : 整条 1 个数（group 内相对比较）        → 弱、稀疏，但可以超越教师</code></pre></div>"

    "html": "<p><code>data/grpo_prompts.jsonl</code>：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-json\">{\"prompt\": [{\"role\": \"system\", \"content\": \"你是一个数学解题助手。先想，再答。\"},\n            {\"role\": \"user\", \"content\": \"23 × 47 = ?\\n请把最终答案写在 &lt;answer&gt;&lt;/answer&gt; 里。\"}],\n \"ground_truth\": \"1081\"}</code></pre></div>\n<p>逐字段：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>字段</th><th>类型</th><th>作用</th><th>注意</th></tr></thead><tbody><tr><td><code>prompt</code></td><td><code>list[dict]</code></td><td>送进模型的对话（最后一条是 user）</td><td>对话格式，训练时自动套 chat template</td></tr><tr><td><code>ground_truth</code></td><td><code>str</code></td><td>判分用</td><td>名字随你定，会被当作 kwargs 传给奖励函数</td></tr><tr><td><code>tools</code>（可选）</td><td><code>list[dict]</code></td><td>工具 schema</td><td>需要多轮工具时才加</td></tr><tr><td><code>environment</code>（可选）</td><td><code>str</code></td><td>多环境时的路由键</td><td>见第 4 章</td></tr></tbody></table></div>\n<p><strong>关键区别</strong>：这里<strong>没有 <code>completion</code> 字段</strong>。答案由模型自己写，写 8 次就是 8 条不同的样本。</p>"

    "title": "5. 奖励函数：唯一的「老师」",
    "short": "奖励函数：唯一的「老师」",
    "html": "<p>奖励函数就是一个普通 Python 函数：收一批 completion，返回<strong>同样长度的 <code>list[float]</code></strong>。</p>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">def accuracy_reward(completions, ground_truth=None, **kwargs):\n    scores = []\n    for comp, gt in zip(completions, ground_truth or [None] * len(completions)):\n        content = comp[0][\"content\"] if isinstance(comp, (list, tuple)) else comp\n        m = re.search(r\"&lt;answer&gt;\\s*(.*?)\\s*&lt;/answer&gt;\", content, re.S)\n        got = m.group(1).strip() if m else \"\"\n        scores.append(1.0 if got == str(gt).strip() else 0.0)\n    return scores</code></pre></div>\n<p><strong>三条契约</strong>（违反任何一条都会静默训坏）：</p>\n<ol><li>返回 <code>list[float]</code>，长度 = completion 条数，<strong>顺序一一对应</strong> —— 返回单个 float 或标量会被当成「所有答案同分」。</li><li>数据集里除 <code>prompt</code> 外的列会<strong>按列名</strong>传进函数（<code>ground_truth=...</code>）；签名里写 <code>**kwargs</code> 最安全。</li><li>可以 sync，也可以 <code>async def</code>（多个异步奖励会并发跑）。</li></ol>\n<p>可用的关键字参数：<code>prompts</code>、<code>completions</code>、<code>completion_ids</code>、<code>trainer_state</code>、<code>log_extra(col, values)</code>、<code>log_metric(name, value)</code>、<code>environments</code>，以及数据集的其它列。</p>"
