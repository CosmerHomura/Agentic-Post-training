<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic 后训练教程 · 从 SFT 到 Harness</title>
<script>try{if(localStorage.getItem("apc:theme")==="dark"){document.documentElement.dataset.theme="dark"}}catch(e){}</script>
<style>
:root{
  --bg:#f5f4ef; --paper:#fffefb; --ink:#1c2025; --muted:#6b7280; --line:#e5e1d7;
  --accent:#3f51d6; --accent-soft:#eceefe; --ok:#12703f; --ok-soft:#e7f5ec; --ok-line:#b9e0c6;
  --code-bg:#f4f2ec; --shadow:0 1px 2px rgba(24,28,40,.05),0 8px 24px -12px rgba(24,28,40,.18);
  --side:#fbfaf6;
}
html[data-theme="dark"]{
  --bg:#0f1115; --paper:#171a20; --ink:#e7e9ee; --muted:#98a0ad; --line:#282d36;
  --accent:#8f9dff; --accent-soft:#1d2235; --ok:#5fd39a; --ok-soft:#13251d; --ok-line:#245439;
  --code-bg:#11141a; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px #000;
  --side:#12151b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.78 ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,pre,kbd{font-family:ui-monospace,"Cascadia Code","SF Mono",Consolas,"Liberation Mono",monospace}

/* ---------------- layout ---------------- */
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}
aside{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--side);border-right:1px solid var(--line);padding:20px 16px 28px;
  display:flex;flex-direction:column;gap:14px;
}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 0}
.brand .logo{
  width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),#7c3aed);color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 4px 12px -6px var(--accent);
}
.brand h1{font-size:15px;margin:0;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.3px}

.searchbox{position:relative}
.searchbox input{
  width:100%;padding:9px 12px 9px 32px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:13.5px;outline:none;
}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.qres{
  max-height:300px;overflow:auto;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:4px;box-shadow:var(--shadow);margin-top:-6px;
}
.qres a{display:block;padding:7px 9px;border-radius:7px;color:var(--ink);font-size:13px}
.qres a:hover{background:var(--accent-soft);text-decoration:none}
.qres small{color:var(--muted);margin-right:6px;font-size:11px}
.qres .empty{color:var(--muted);font-size:12.5px;padding:8px 10px}

.progress{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.progress .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.progress .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ok),#4ec98a);transition:width .35s ease}

nav.toc{display:flex;flex-direction:column;gap:2px}
.ch{--pad:0}
.ch>a.chl{
  display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;color:var(--ink);
  font-size:13.5px;font-weight:600;line-height:1.35;position:relative;
}
.ch>a.chl:hover{background:var(--accent-soft);text-decoration:none}
.ch>a.chl .num{
  flex:none;min-width:26px;height:20px;padding:0 5px;border-radius:5px;background:var(--line);
  color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center;letter-spacing:.4px;
  font-variant-numeric:tabular-nums;
}
.ch.act>a.chl{background:var(--accent-soft);color:var(--accent)}
.ch.act>a.chl .num{background:var(--accent);color:#fff}
.ch>a.chl .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch>a.chl .pct{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.ch.done>a.chl .pct{color:var(--ok)}
.secs{display:none;margin:2px 0 8px 22px;border-left:1px solid var(--line);padding-left:9px}
.ch.act .secs,.ch.open .secs{display:block}
a.sl{
  display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;
  color:var(--muted);font-size:12.5px;line-height:1.5;
}
a.sl:hover{background:var(--accent-soft);color:var(--ink);text-decoration:none}
a.sl.act{color:var(--accent);font-weight:600}
a.sl .box{
  flex:none;width:13px;height:13px;margin-top:3px;border:1.5px solid var(--line);border-radius:4px;
  display:grid;place-items:center;font-size:9px;color:transparent;line-height:1;background:var(--paper);
}
a.sl.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
a.sl.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
a.sl.act.done{color:var(--accent)}

.sidefoot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.sidefoot button{
  flex:1 1 auto;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--paper);
  color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;
}
.sidefoot button:hover{color:var(--ink);border-color:var(--accent)}
.tip{font-size:11px;color:var(--muted);line-height:1.6;padding:0 2px}

/* ---------------- main ---------------- */
main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 28px;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.topbar .crumb{font-size:12.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .crumb b{color:var(--ink);font-weight:600}
.tbtn{
  padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn:disabled:hover{border-color:var(--line);color:var(--ink)}

article{width:100%;max-width:900px;margin:0 auto;padding:34px 32px 80px}
.chead{margin:0 0 26px}
.chead .kicker{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:700}
.chead h1{font-size:31px;line-height:1.3;margin:8px 0 8px;letter-spacing:-.3px}
.chead .sub{color:var(--muted);font-size:14.5px;margin:0}
.chead .meta{display:flex;gap:14px;align-items:center;margin-top:16px;flex-wrap:wrap}
.chead .meta .m{font-size:12.5px;color:var(--muted)}
.chead .meta .bar{width:150px;flex:none}

.sec{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 30px 28px;
  margin:0 0 18px;box-shadow:var(--shadow);scroll-margin-top:74px;position:relative;
}
.sec.done{border-color:var(--ok-line)}
.sec.done::after{
  content:"已学";position:absolute;top:0;right:0;font-size:11px;color:var(--ok);
  background:var(--ok-soft);border-bottom-left-radius:10px;padding:3px 10px;letter-spacing:.5px;
}
.sechead{display:flex;align-items:flex-start;gap:14px;margin:0 0 14px}
.sechead h2{flex:1;font-size:20px;line-height:1.45;margin:0;letter-spacing:-.2px}
.sechead h2 .anchor{opacity:0;margin-left:6px;font-weight:400;color:var(--muted);font-size:15px}
.sechead:hover h2 .anchor{opacity:1}
.mark{
  flex:none;display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:12px;cursor:pointer;
  font-family:inherit;margin-top:2px;
}
.mark .dot{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:9px;color:transparent}
.mark:hover{border-color:var(--ok);color:var(--ok)}
.mark[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.mark[aria-pressed="true"] .dot{background:var(--ok);border-color:var(--ok);color:#fff}

.sec p{margin:0 0 14px}
.sec>*:last-child{margin-bottom:0}
.sec h3{font-size:16.5px;margin:26px 0 10px;letter-spacing:-.1px}
.sec h3:first-child{margin-top:0}
.sec h4{font-size:14.5px;margin:20px 0 8px;color:var(--muted)}
.sec ul,.sec ol{margin:0 0 14px;padding-left:22px}
.sec li{margin:5px 0}
.sec li::marker{color:var(--muted)}
.sec li.task{list-style:none;position:relative;padding-left:24px;margin:7px 0}
.sec li.task::before{content:"";position:absolute;left:1px;top:.42em;width:13px;height:13px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper)}
.sec li.task.done::before{background:var(--ok);border-color:var(--ok)}
.sec strong{font-weight:650}
.sec hr{border:none;border-top:1px dashed var(--line);margin:22px 0}
.sec blockquote{
  margin:0 0 16px;padding:4px 0 4px 18px;border-left:3px solid var(--accent);
  color:var(--ink);background:linear-gradient(90deg,var(--accent-soft),transparent 70%);
  border-radius:0 8px 8px 0;
}
.sec blockquote p:last-child{margin-bottom:0}
.sec code{background:var(--code-bg);padding:.15em .38em;border-radius:5px;font-size:.9em;border:1px solid var(--line)}
.codewrap{
  margin:0 0 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg);
}
.codewrap pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:12.9px;line-height:1.65}
.codewrap code{background:none;border:none;padding:0;font-size:inherit}
.tablewrap{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.6px;line-height:1.6}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);background:color-mix(in srgb,var(--bg) 60%,var(--paper));font-weight:650;font-size:12.8px;letter-spacing:.2px;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--accent-soft);background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td code,th code{white-space:normal;overflow-wrap:anywhere}

.pager{display:flex;gap:12px;margin-top:26px}
.pager a{
  flex:1;display:flex;flex-direction:column;gap:3px;padding:14px 18px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);
}
.pager a:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-1px)}
.pager a small{color:var(--muted);font-size:11.5px}
.pager a b{font-size:14px}
.pager a.next{text-align:right;align-items:flex-end}
.pager a.ghost{visibility:hidden}

footer.ft{max-width:900px;margin:0 auto;padding:0 32px 60px;color:var(--muted);font-size:12.5px;line-height:1.8}
footer.ft kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;background:var(--paper)}

#up{
  position:fixed;right:22px;bottom:22px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--paper);color:var(--muted);font-size:15px;cursor:pointer;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(6px);
}
#up.on{opacity:1;pointer-events:auto;transform:none}
#up:hover{color:var(--accent);border-color:var(--accent)}

#burger{display:none}
#scrim{display:none;position:fixed;inset:0;background:rgba(12,14,18,.42);z-index:55;backdrop-filter:blur(1px)}
body.nav-open #scrim{display:block}
body.nav-open #burger{position:relative;z-index:57}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;z-index:60;width:290px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow)}
  body.nav-open aside{transform:none}
  #burger{display:inline-block}
  article{padding:24px 16px 70px}
  .topbar{padding:9px 14px;gap:8px}
  .crumb{font-size:12px}
  .sec{padding:20px 18px 22px;border-radius:12px}
  .chead h1{font-size:25px;letter-spacing:-.2px}
  .sechead{gap:10px}
  .mark{padding:4px 9px}
}
@media print{
  aside,.topbar,.pager,#up,.mark{display:none!important}
  .app{display:block}
  .sec{box-shadow:none;break-inside:avoid;border-color:#ddd}
  body{background:#fff}
}
</style>
</head>
<body>
<div id="scrim"></div>
<div class="app">
  <aside id="side">
    <div class="brand">
      <div class="logo">A↑</div>
      <div>
        <h1>Agentic 后训练教程</h1>
        <p>SFT → 蒸馏 → GRPO → 环境 → Harness</p>
      </div>
    </div>

    <div class="searchbox">
      <span class="icon">⌕</span>
      <input id="q" type="search" placeholder="搜索小节…（/）" autocomplete="off" spellcheck="false">
    </div>
    <div id="qres" class="qres" hidden></div>

    <div class="progress">
      <div class="row"><span>学习进度</span><b id="ptext">0 / 0</b></div>
      <div class="bar"><i id="pfill"></i></div>
    </div>

    <nav class="toc" id="toc"></nav>

    <div class="sidefoot">
      <button id="theme" type="button">深色模式</button>
      <button id="expand" type="button">展开目录</button>
      <button id="reset" type="button">重置进度</button>
    </div>
    <div class="tip">勾选右侧「已学」即记在本机浏览器里；页面可加书签，链接会带你回到具体小节。</div>
  </aside>

  <main>
    <div class="topbar">
      <button class="tbtn" id="burger" type="button" aria-label="目录">☰ 目录</button>
      <div class="crumb" id="crumb"></div>
      <button class="tbtn" id="prev" type="button">← 上一章</button>
      <button class="tbtn" id="next" type="button">下一章 →</button>
    </div>
    <article id="doc"></article>
    <footer class="ft">
      快捷键：<kbd>←</kbd> <kbd>→</kbd> 切换章节 · <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 关闭搜索。
      进度保存在当前浏览器（localStorage），换浏览器或清理数据会重置。
    </footer>
  </main>
</div>

<button id="up" type="button" aria-label="回到顶部">↑</button>

<script>
const DATA = [
 {
  "id": "ch0",
  "num": "目",
  "title": "总目录",
  "heading": "Agent 后训练学习教程",
  "subtitle": "怎么用这份教程",
  "sections": [
   {
    "id": "s1",
    "title": "引言",
    "short": "引言",
    "html": "<blockquote><p>对照 Hugging Face 官方课程页 <strong>《A curriculum for post-training agents》</strong> 原文：<a href=\"https://huggingface.co/blog/huggingface/train-agents\" target=\"_blank\" rel=\"noopener\">https://huggingface.co/blog/huggingface/train-agents</a> 本教程：全文中文翻译 + 每一步的<strong>数据格式</strong>、<strong>输入输出</strong>、<strong>可运行代码骨架</strong>、<strong>踩坑清单</strong> 整理日期：2026-10-28 ｜ 对应文档版本：TRL v1.16.0</p></blockquote>"
   },
   {
    "id": "s2",
    "title": "0. 这份教程是什么",
    "short": "这份教程是什么",
    "html": "<p>Hugging Face 那篇课程页是一张\"<strong>学习地图</strong>\"：它把 agent 后训练拆成 5 步，每步给你「一张方法图 + 一场直播 + 一篇博客 + 官方文档」。 但它本身<strong>不告诉你每一步的数据长什么样、喂给模型的是什么、模型吐出来的是什么</strong>——这些细节散落在 TRL 文档各个角落。</p>\n<p>这份教程补上这一块：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>你会得到</th><th>在哪</th></tr></thead><tbody><tr><td>原文的完整中文翻译（逐节对应）</td><td>各章 README 的「原文译文」小节</td></tr><tr><td>每一步的<strong>数据格式</strong>（JSONL 逐字段）</td><td>各章 <code>data/</code> 示例文件 + README 表格</td></tr><tr><td>每一步的<strong>模型输入输出</strong>（token / mask 视角）</td><td>各章 README 的「输入输出」小节</td></tr><tr><td>可运行代码骨架（改路径就能跑）</td><td>各章 <code>code/</code> 目录</td></tr><tr><td>训练成败的判断依据（看哪些指标）</td><td>各章 README 的「产物与验收」小节</td></tr><tr><td>目录导航、学习路线、资源总表</td><td>本文件</td></tr></tbody></table></div>\n<p><strong>网页版</strong>：仓库里的 <code>index.html</code> 是整份教程的单文件网页（左边目录、小节可打勾、链接可加书签、自动记进度）。<strong>下载下来双击就能看</strong>，不需要服务器、不需要联网。打勾存在你自己浏览器的 localStorage 里，所以谁下载谁记自己的，互不影响；想清空就点页面左下角「重置进度」。</p>\n<p><strong>一句话主线</strong>：后训练就是\"换监督信号\"。 从「抄一遍正确答案」（SFT）→「抄老师的概率分布」（蒸馏）→「按评分改自己」（RL）→「在环境里按结果改自己」（RL 环境）→「在真实 agent 里按结果改自己」（Harness）。 <strong>监督信号越来越稀疏，但越来越贴近你真正想要的能力。</strong></p>"
   },
   {
    "id": "s3",
    "title": "1. 原文译文 · 引言",
    "short": "原文译文 · 引言",
    "html": "<blockquote><p>后训练（post-training）指的是预训练之后的那些训练阶段，例如监督微调、蒸馏和强化学习。这些阶段把一个预训练模型变成会遵循指令、会使用工具、能解决特定任务的模型。</p>\n<p>当模型作为 agent 工作时，它要在很多轮里行动：调用工具、读取结果、决定下一步做什么。<strong>Agentic 后训练</strong>就是把这些阶段用在 agent 上——于是训练必须考虑整条多轮交互的序列，而不是单个回答。</p></blockquote>\n<blockquote><p>本页组织为五个步骤，前面有一段导言。每一步都包含：方法示意图、一场直播或幻灯片、一篇解释思路的博客，以及相关文档。部分步骤还附了用该方法构建的示例项目。下面的表格总结了每一步：模型从什么信号中学习、用哪个 TRL trainer、你需要准备什么。</p></blockquote>\n<blockquote><p>这些步骤的顺序沿袭直播系列 <strong>Training Agents</strong>（Hugging Face 的 YouTube 频道）。每一期讲一种后训练方法，并始终以\"训练一个编程 agent\"作为贯穿全程的示例。播放列表 <a href=\"https://www.youtube.com/playlist?list=PLo2EIpI_JMQvQZm-kVlz4wY1vWF0LBcf5\" target=\"_blank\" rel=\"noopener\">Post-training Agents</a> 包含四期节目加两场相关 workshop。</p></blockquote>"
   },
   {

    "title": "2. 五步一图看懂",
    "short": "五步一图看懂",
    "html": "<div class=\"codewrap\"><pre><code>   ┌────────────────────────────────────────────────────────────────────┐\n   │                       同一个模型，五种监督信号                      │\n   └────────────────────────────────────────────────────────────────────┘\n\n   ① SFT          数据：(prompt, 完整正确轨迹)      信号：每个 token 的硬标签\n      模仿          ─────────────────────────────▶  loss = 交叉熵\n\n   ② 蒸馏         数据：(prompt)  学生自己生成      信号：教师每个 token 的分布\n      对齐分布      ─────────────────────────────▶  loss = JSD(p_学生 ‖ p_教师)\n\n   ③ RL/GRPO      数据：(prompt, 可验证答案)        信号：整条回答一个分数\n      试错优化      ─────────────────────────────▶  loss = 组内相对优势 × 策略梯度\n\n   ④ RL 环境      数据：(任务) + 有状态环境        信号：多轮交互后的最终结果\n      行动学习      ─────────────────────────────▶  同上，但轨迹由环境决定长度\n\n   ⑤ Harness      数据：(任务) + 真实 agent + 沙箱  信号：真实 agent 跑完的结果\n      规模化        ─────────────────────────────▶  同上，但生成与训练解耦并行\n\n        监督密度：  密集(每token) ────────────────▶ 稀疏(每个 episode 一个数)\n        真实程度：  离线数据   ────────────────▶ 生产环境里的同一个 agent</code></pre></div>\n<h3 id=\"s4-h1\">原文「Steps at a glance」表格（译文）</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>模型从什么学习</th><th>TRL trainer</th><th>你需要准备</th></tr></thead><tbody><tr><td>1. SFT</td><td>来自更强模型的 agent 轨迹</td><td><code>SFTTrainer</code></td><td>一个 agent 轨迹数据集</td></tr><tr><td>2. 蒸馏</td><td>教师的 token 或概率</td><td><code>DistillationTrainer</code></td><td>prompts + 一个教师模型</td></tr><tr><td>3. RL</td><td>每个回答的得分</td><td><code>GRPOTrainer</code></td><td>prompts + 一个奖励函数</td></tr><tr><td>4. RL 环境</td><td>在环境中行动的结果</td><td><code>GRPOTrainer</code></td><td>任务 + 一个环境（OpenEnv）</td></tr><tr><td>5. Harness 与规模化</td><td>真实 agent 的完整运行</td><td><code>AsyncGRPOTrainer</code></td><td>任务 + 环境 + 一个 agent harness</td></tr></tbody></table></div>\n<h3 id=\"s4-h2\">换一种说法：每一步的输入 / 输出 / 产物</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>你喂给 trainer 的</th><th>模型（或环境）产出的</th><th>训练后你拿到</th></tr></thead><tbody><tr><td>1 SFT</td><td><code>messages</code>（含 <code>tool_calls</code>）</td><td>每个 token 的预测 → 交叉熵</td><td>会模仿轨迹的模型</td></tr><tr><td>2 蒸馏</td><td>只有 <code>prompt</code></td><td>学生自己写的回答 + 师生两组分布</td><td>分布上贴近教师的模型</td></tr><tr><td>3 GRPO</td><td><code>prompt</code> + <code>ground_truth</code></td><td>G 条回答 + G 个分数</td><td>会得高分的模型</td></tr><tr><td>4 环境</td><td>任务（可由环境自采样）</td><td>多轮 obs/action 序列 + 最终奖励</td><td>会\"用工具完成任务\"的模型</td></tr><tr><td>5 Harness</td><td>任务 + agent 配置</td><td>真实 agent 的完整 transcript + 验证器打分</td><td>在真实 harness 里变强的模型</td></tr></tbody></table></div>"

    "title": "2. 原文译文 · 引言",
    "short": "原文译文 · 引言",
    "html": "<blockquote><p>后训练指的是预训练之后的那些训练阶段，例如监督微调、蒸馏和强化学习。这些阶段把一个预训练模型变成会遵循指令、会使用工具、能解决特定任务的模型。</p>\n<p>当模型作为 agent 工作时，它要在很多轮里行动：调用工具、读取结果、决定下一步做什么。<strong>Agentic 后训练</strong>就是把这些阶段用在 agent 上——于是训练必须考虑整条多轮交互的序列，而不是单个回答。</p></blockquote>\n<blockquote><p>本页组织为五个步骤，前面有一段导言。每一步都包含：方法示意图、一场直播或幻灯片、一篇解释思路的博客，以及相关文档。部分步骤还附了用该方法构建的示例项目。下面的表格总结了每一步：模型从什么信号中学习、用哪个 TRL trainer、你需要准备什么。</p>\n<p>这些步骤的顺序沿袭直播系列 <strong>Training Agents</strong>（Hugging Face 的 YouTube 频道）。每一期讲一种后训练方法，并始终以\"训练一个编程 agent\"作为贯穿全程的示例。播放列表 <a href=\"https://www.youtube.com/playlist?list=PLo2EIpI_JMQvQZm-kVlz4wY1vWF0LBcf5\" target=\"_blank\" rel=\"noopener\">Post-training Agents</a> 包含四期节目加两场相关 workshop。</p></blockquote>\n<blockquote><p><strong>原文「Before you start」</strong>：如果你对 agent 不熟，建议先读 <em><a href=\"https://huggingface.co/blog/agent-glossary\" target=\"_blank\" rel=\"noopener\">Harness, Scaffold, and the AI Agent Terms Worth Getting Right</a></em>。如果你对后训练整体还不熟，<a href=\"https://huggingface.co/learn/llm-course\" target=\"_blank\" rel=\"noopener\">LLM Course</a> 覆盖了这些方法背后的基础。想看总览，就看 <em>Train the agent, not just the model</em> 幻灯片。</p></blockquote>"
   },
   {
    "id": "s3",
    "title": "3. 六个词，一次说清",
    "short": "六个词，一次说清",
    "html": "<p>教程里所有混乱都来自这六个词。下面是我给的\"人话定义 + 反例\"。</p>\n<div class=\"tablewrap\"><table><thead><tr><th>词</th><th>人话定义</th><th>反面例子（别这么理解）</th></tr></thead><tbody><tr><td><strong>agent</strong></td><td>能<strong>多轮</strong>调用工具、看结果、再决定下一步的模型</td><td>一次性吐一段长文本的聊天模型（那是 chat，不是 agent）</td></tr><tr><td><strong>harness</strong>（外部壳/脚手架）</td><td>驱动 agent 的那套程序：决定何时调工具、怎么拼上下文、什么时候停</td><td>不是模型的一部分，是包在模型外面的循环</td></tr><tr><td><strong>scaffold</strong></td><td>与 harness 近义，更偏\"模型之外的工程结构\"</td><td>不是训练框架（TRL 是 trainer，不是 scaffold）</td></tr><tr><td><strong>environment</strong></td><td>有状态的\"世界\"：能执行动作、记住变化、最后给结果</td><td>不是一个静态数据集；它有 <code>reset()</code> 和 <code>step()</code></td></tr><tr><td><strong>rollout</strong></td><td>一次完整采样：从初始状态到结束的一整条轨迹</td><td>不是\"一条 completion\"，是<strong>整个 episode</strong></td></tr><tr><td><strong>trace</strong></td><td>rollout 的记录：每轮的 token id、logprob、loss mask</td><td>不是纯文本日志，是<strong>能反传梯度的张量记录</strong></td></tr></tbody></table></div>\n<h3 id=\"s3-h1\">最容易混的一对：harness vs environment</h3>\n<div class=\"codewrap\"><pre><code>       ┌──────────────────────────────────────────┐\n       │  harness（壳）：决定\"下一步做什么\"        │\n       │   · 把工具列表塞进上下文                 │\n       │   · 解析模型输出里的 tool_call            │\n       │   · 把工具结果拼回上下文                  │\n       │   · 判断结束条件、压缩历史                │\n       └───────────────┬──────────────────────────┘\n                       │ 调用工具\n                       ▼\n       ┌──────────────────────────────────────────┐\n       │  environment（环境）：决定\"做了会怎样\"    │\n       │   · 维护状态（文件系统、数据库、游戏盘面）│\n       │   · 执行动作、返回观测                    │\n       │   · 判定成败、给 reward                   │\n       └──────────────────────────────────────────┘</code></pre></div>\n<p>一句话：<strong>harness 是\"大脑的外壳\"，environment 是\"身体所在的世界\"</strong>。 在 TRL 里：<code>environment_factory</code> 给你 environment；<code>HarnessRolloutWorker</code> 给你 harness。</p>"
   },
   {
    "id": "s4",
    "title": "4. 全景图：一次 agent rollout 到底发生了什么",
    "short": "全景图：一次 agent rollout 到底发生了什么",
    "html": "<div class=\"codewrap\"><pre><code>任务 prompt\n   │\n   ▼\n┌──────────────┐   ① 模型输出 tool_call    ┌──────────────┐\n│   模型 actor  │ ────────────────────────▶ │   harness    │\n│ (要训练的权重)│                           │  (循环控制)   │\n└──────────────┘ ◀──────────────────────── └──────┬───────┘\n   ▲            ② 工具结果拼回上下文              │ 执行\n   │                                              ▼\n   │                                       ┌──────────────┐\n   │                                       │ environment  │\n   │                                       │ (有状态世界)  │\n   │                                       └──────┬───────┘\n   │                                              │\n   └──────── ③ 继续下一轮 / 直到结束 ◀────────────┘\n                        │\n                        ▼\n              ④ 整条轨迹 + 一个结果\n                        │\n        ┌───────────────┴────────────────┐\n        ▼                                ▼\n   有标准答案？                     只有分数？\n   → SFT / 蒸馏                     → GRPO</code></pre></div>\n<p><strong>关键认知</strong>：后训练算法本身没变（还是交叉熵、还是策略梯度）。 变的是<strong>\"监督信号从哪来\"</strong>，以及<strong>\"一条样本有多长\"</strong>（从 1 个回答 → 几十轮交互）。</p>"
   },
   {
    "id": "s5",
    "title": "5. 监督信号的谱系",
    "short": "监督信号的谱系",
    "html": "<p>这是整份教程最重要的一张表。五步就是在沿着这张表往右下走。</p>\n<div class=\"tablewrap\"><table><thead><tr><th></th><th>监督信号</th><th>密度</th><th>需要什么</th><th>学不到什么</th></tr></thead><tbody><tr><td>SFT</td><td>每个 token 的<strong>硬标签</strong></td><td>最密（每 token 1 个）</td><td>正确轨迹</td><td>不会纠错、不会探索</td></tr><tr><td>蒸馏</td><td>每个 token 的<strong>概率分布</strong></td><td>密（每 token 1 个分布）</td><td>教师模型</td><td>不会超过教师</td></tr><tr><td>GRPO</td><td>每条回答<strong>一个分数</strong></td><td>稀（每序列 1 个）</td><td>奖励函数</td><td>需要大量采样</td></tr><tr><td>RL 环境</td><td>每次 <strong>episode 一个结果</strong></td><td>更稀（多轮 1 个）</td><td>环境 + 验证器</td><td>rollout 慢</td></tr><tr><td>Harness</td><td>真实 agent 跑完的<strong>结果</strong></td><td>最稀、最真实</td><td>harness + 沙箱</td><td>工程复杂、成本高</td></tr></tbody></table></div>\n<blockquote><p>一个直觉：<strong>信号越稀，模型越要靠自己\"试\"；信号越密，模型越只是在\"抄\"。</strong> 抄得快但不鲁棒，试得慢但能超越数据——这就是为什么真实流水线是 1 → 2 → 3/4 → 5 串起来的。</p></blockquote>"
   },
   {
    "id": "s6",
    "title": "6. 环境准备",
    "short": "环境准备",
    "html": "<h3 id=\"s6-h1\">6.1 依赖</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">python -m venv .venv &amp;&amp; source .venv/bin/activate    # Windows: .venv\\Scripts\\activate\n\npip install \"trl&gt;=1.16.0\" transformers datasets accelerate\npip install trl[vllm]              # 想用 vLLM 加速生成（3/4/5 步强烈建议）\npip install openenv-core           # 第 4 步：环境</code></pre></div>\n<blockquote><p>版本提示：第 4 步的 <code>environment_factory</code> 要求 <code>transformers&gt;=5.2.0</code>； 第 5 步的异步 rollout 走 NCCL 权重同步，vLLM 版本别太旧。</p></blockquote>\n<h3 id=\"s6-h2\">6.2 硬件</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>最小可行</th><th>舒服</th></tr></thead><tbody><tr><td>1 SFT</td><td>1×16GB（0.5B + QLoRA）</td><td>1×A100</td></tr><tr><td>2 蒸馏</td><td>1×24GB（学生 0.5B + 教师 1.5B）</td><td>1×A100</td></tr><tr><td>3 GRPO</td><td>1×24GB（0.5B，G=8）</td><td>4–8×A100</td></tr><tr><td>4 环境</td><td>同 3，但要留 rollout 时间</td><td>8×A100</td></tr><tr><td>5 Harness</td><td><strong>≥2 卡</strong>（vLLM 与 trainer 分卡）</td><td>多机 + 沙箱配额</td></tr></tbody></table></div>\n<blockquote><p>手上没有 24GB 以上的卡？本章第 <strong>9～15 节</strong>是完整的云端方案：怎么选机器、代码怎么送上去（git / rsync）、开机器后的初始化脚本、单卡与双卡的具体命令、四个云上专属的坑、以及一次走完大概花多少钱。</p></blockquote>\n<h3 id=\"s6-h3\">6.3 三条命令先跑通</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 1) 确认能加载 chat template 和工具 schema\npython -c \"from transformers import AutoTokenizer; t=AutoTokenizer.from_pretrained('Qwen/Qwen3-0.6B'); print(t.chat_template[:200])\"\n\n# 2) 确认 TRL 装好\npython -c \"import trl; print(trl.__version__)\"\n\n# 3) 确认 GPU 可见\npython -c \"import torch; print(torch.cuda.device_count(), torch.cuda.get_device_name(0))\"</code></pre></div>"
   },
   {
    "id": "s7",
    "title": "7. 本教程的贯穿示例",
    "short": "本教程的贯穿示例",
    "html": "<p>为了让五步能横向对比，我们始终用<strong>同一个任务族</strong>：一个会读文件、改文件、跑测试的<strong>编程 agent</strong>。</p>\n<div class=\"codewrap\"><pre><code>工具集（tools）：\n  read_file(path: str) -&gt; str          读文件\n  write_file(path: str, content: str)  写文件\n  run_tests() -&gt; str                   跑测试，返回通过/失败\n\n任务：修好 calculator.py 里失败的测试</code></pre></div>\n<div class=\"tablewrap\"><table><thead><tr><th>步骤</th><th>这个任务怎么用</th></tr></thead><tbody><tr><td>1 SFT</td><td>一条\"人类/强模型修好了\"的完整 transcript</td></tr><tr><td>2 蒸馏</td><td>只给任务描述，学生自己修，教师逐 token 打分</td></tr><tr><td>3 GRPO</td><td>换成单轮可验证数学题（先学会奖励函数怎么写）</td></tr><tr><td>4 环境</td><td>真给一个有文件系统的环境，多轮交互，测试通过才得分</td></tr><tr><td>5 Harness</td><td>真跑 mini-swe-agent / claude-code，在沙箱里跑完整循环</td></tr></tbody></table></div>"
   },

    "title": "8. 怎么用这份教程",

   {
    "id": "s9",
    "title": "9. 先选机器",
    "short": "先选机器",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>你要做的事</th><th>机器</th><th>大致价格</th><th>说明</th></tr></thead><tbody><tr><td>跑通 ① SFT、② 蒸馏</td><td>1×RTX 4090 24G</td><td>¥1.5–2 / 小时</td><td>0.5–0.6B 全参够用</td></tr><tr><td>跑通 ③ GRPO（小规模）</td><td>1×RTX 4090 24G</td><td>同上</td><td><code>num_generations</code> 降到 4～8</td></tr><tr><td>跑通 ④ 环境（长 episode）</td><td>1×A100 40G</td><td>¥5–6 / 小时</td><td>8k token 预算不容易爆</td></tr><tr><td>⑤ Harness（模型 ≤1.7B）</td><td>2×RTX 4090 24G</td><td>¥3–4 / 小时</td><td>vLLM 与 trainer 分卡</td></tr><tr><td>⑤ Harness（<code>Qwen3-4B</code>）</td><td>1×A800 80G 或 2×A100</td><td>¥9 / 小时 起</td><td>trainer 侧全参要 48–64GB 显存</td></tr></tbody></table></div>\n<p>选择的三个要点：</p>\n<ol><li><strong>先单卡，再双卡</strong>。前四步单卡全包，别为了\"以后要用\"多付双卡的钱。</li><li><strong>显存优先于算力</strong>。这些实验是显存敏感、算力不敏感；4090 比同价位的 A10 划算。</li><li><strong>能用子集就别用全量</strong>。<code>trl-lib/DeepMath-103K</code> 全量跑一轮，官方口径是 8×A100 约一天；你裁到 3k 条 prompt，单卡几小时就够看曲线动。</li></ol>"

   {
    "id": "s10",
    "title": "10. 把代码送上去",
    "short": "把代码送上去",
    "html": "<p>三条路，按省事程度排：</p>\n<h3 id=\"s10-h1\">10.1 git（推荐：改一次推一次，云上 <code>git pull</code> 就同步）</h3>\n<p>本地仓库（第一次）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">cd \"F:\\study\\AI\\Agentic Post-training\"     # 或你的实际路径\ngit init -b main\ngit add -A\ngit commit -m \"agentic post-training 教程：5 步 + 网页版\"\ngit remote add origin https://github.com/&lt;你的账号&gt;/agentic-post-training.git\ngit push -u origin main</code></pre></div>\n<p>云上：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">git clone https://github.com/&lt;你的账号&gt;/agentic-post-training.git\ncd agentic-post-training</code></pre></div>\n<p>私有仓库用 HTTPS 时要输 <strong>Personal Access Token</strong>（GitHub：Settings → Developer settings → Tokens，勾 <code>repo</code>），不是登录密码；或者配 SSH key（<code>ssh-keygen -t ed25519</code>，把 <code>~/.ssh/id_ed25519.pub</code> 贴进 GitHub → SSH keys）。</p>\n<h3 id=\"s10-h2\">10.2 scp / rsync（不建仓库，一次拷完）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">rsync -avz --exclude ckpt --exclude .venv --exclude __pycache__ \\\n  ./ root@&lt;云主机IP&gt;:/root/work/agentic/</code></pre></div>\n<p>Windows 没装 rsync 就用 <code>scp -r</code>，或者 WinSCP 拖文件夹。</p>\n<h3 id=\"s10-h3\">10.3 云平台自带的上传（最省事，适合一次性）</h3>\n<p>AutoDL / 阿里云 PAI / 恒源云的控制台都有 JupyterLab，直接把整个文件夹压成 zip 拖上去，在终端 <code>unzip</code> 即可。</p>\n<h3 id=\"s10-h4\">10.4 仓库里别提交什么</h3>\n<p><code>ckpt/</code>（几百 MB 到几十 GB）、<code>.venv/</code>、<code>__pycache__/</code>、模型缓存、<code>_site/_preview.html</code> 这类临时件。工作区根目录已经放了 <code>.gitignore</code>，覆盖这些。</p>\n<blockquote><p>仓库真正的体积只有约 400KB —— 8 个 README + 16 个示例文件 + 一个 148KB 的单文件网页。<code>index.html</code> 一起提交，但不依赖任何托管服务：想要网页版的人自己下载 <code>index.html</code>，双击就能看，不需要服务器、不需要联网。</p>\n<p>学习进度（打勾）存在各自浏览器的 localStorage 里，<strong>天然按人分开</strong>：你把 <code>index.html</code> 发给十个人，十个人各自记各自的进度，互不影响，也不需要账号。想重来就点页面左下角「重置进度」。</p></blockquote>"
   },
   {
    "id": "s11",
    "title": "11. 开机器后 10 分钟",
    "short": "开机器后 10 分钟",
    "html": "<p>每台新实例照抄这一段，四步走完就能开跑。</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># ① conda 环境（为什么必须建，见 11.1）\nconda create -n postrl python=3.11 -y\nconda activate postrl\n\n# ② 镜像与缓存（国内直连 huggingface.co 基本必失败）\nexport HF_ENDPOINT=https://hf-mirror.com\nexport HF_HOME=/root/autodl-tmp/hf          # 系统盘通常只有 30G，模型别放那儿\n\n# ③ 依赖（清华源，装进 postrl 环境）\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple -U pip\npip install -i https://pypi.tuna.tsinghua.edu.cn/simple \\\n  \"trl&gt;=1.16.0\" transformers datasets accelerate trl[vllm] openenv-core\n\n# ④ 自检，三行都要过\npython -c \"import torch;print(torch.__version__, torch.version.cuda, torch.cuda.is_available())\"\npython -c \"import transformers, trl;print(transformers.__version__, trl.__version__)\"\npython -c \"from transformers import AutoTokenizer;t=AutoTokenizer.from_pretrained('Qwen/Qwen3-0.6B');print('template ok', len(t.chat_template))\"</code></pre></div>\n<p>第 4 步的 <code>environment_factory</code> 要求 <code>transformers&gt;=5.2.0</code>，④ 报版本不够时再单独升一行 <code>pip install -U \"transformers&gt;=5.2.0\"</code>。</p>\n<p>新终端会丢两样东西（环境和镜像），一次性写进 <code>~/.bashrc</code> 就不必每次重敲：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">echo 'source /root/miniconda3/etc/profile.d/conda.sh &amp;&amp; conda activate postrl' &gt;&gt; ~/.bashrc\necho 'export HF_ENDPOINT=https://hf-mirror.com' &gt;&gt; ~/.bashrc\necho 'export HF_HOME=/root/autodl-tmp/hf' &gt;&gt; ~/.bashrc</code></pre></div>\n<p>漏掉第一行的症状是 <code>pip install</code> 装进了 base（<code>which python</code> 指到 <code>/usr/bin</code> 或 conda base），漏掉后两行的症状是模型下载 <code>ConnectionError</code> / <code>Timeout</code>。</p>\n<h3 id=\"s11-h1\">11.1 为什么必须建环境</h3>\n<ol><li><strong><code>trl[vllm]</code> 会顺手换掉 torch</strong>。vLLM 对 torch 版本卡得很死，pip 装它时会覆盖镜像里那份预编译的 torch+CUDA，症状是上面 ④ 里 <code>torch.cuda.is_available()</code> 变成 <code>False</code>，或 NCCL 报 <code>unhandled cuda error</code>。真遇到了就<strong>降 vllm 版本去匹配镜像 torch</strong>，别反过来升 torch。</li><li><strong>依赖会打架</strong>：教程要较新的 <code>transformers</code>，你别的项目可能锁在旧版本。</li><li><strong>实例一换就没了</strong>，有 conda 环境 + <code>requirements.txt</code>（<code>pip freeze &gt; requirements.txt</code>）才谈得上复现。</li></ol>\n<p>conda 建的是空环境，torch 要按镜像的 CUDA 版本重装一份（<code>pip install torch --index-url https://download.pytorch.org/whl/cu121</code> 之类），代价是几 GB 下载；好处是完全隔离，同机跑多个互斥项目也不打架。</p>\n<p>本地 Windows / macOS 同样用 conda：<code>conda create -n postrl python=3.11 -y &amp;&amp; conda activate postrl</code>。</p>\n<h3 id=\"s11-h2\">11.2 AutoDL 学术加速：开与关</h3>\n<p>AutoDL 的「学术加速」是一个只会对 <strong>github.com / githubusercontent.com / githubassets.com / huggingface.co</strong> 生效的代理，用来解决 <code>git clone</code> 和直连 HF 慢的问题。</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 开（只对当前这个终端有效，新开终端要重新执行）\nsource /etc/network_turbo\n\n# 关\nunset http_proxy &amp;&amp; unset https_proxy</code></pre></div>\n<p>两点要注意：</p>\n<ol><li><strong>它是环境变量代理</strong>：<code>source</code> 之后 <code>env | grep -i proxy</code> 能看到 <code>http_proxy</code> / <code>https_proxy</code>，新终端失效需重新 <code>source</code>。</li><li><strong>只在需要 <code>git clone</code> 时开，用完就关</strong>：官方说过它会影响正常网络，留着它跑 <code>pip install</code>（清华源）或 <code>scp</code> 反而变慢甚至失败；拉模型走 ② 的 <code>HF_ENDPOINT</code> 镜像就够了，两个别同时开。</li></ol>\n<p>如果执行 <code>source /etc/network_turbo</code> 报 <code>No such file or directory</code>，说明你所在区域不支持该代理，那就走镜像站 + <code>ghproxy.link</code>（地址会变，进站点看当前可用的）。</p>"
   },
   {
    "id": "s12",
    "title": "12. 每一步怎么跑",
    "short": "每一步怎么跑",
    "html": "<h3 id=\"s12-h1\">12.1 单卡（①～④）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">cd 01-监督微调-SFT/code &amp;&amp; python train_sft.py\ncd 02-蒸馏/code        &amp;&amp; python train_distill.py\ncd 03-强化学习-GRPO/code &amp;&amp; python train_grpo.py\ncd 04-RL环境/code      &amp;&amp; python train_grpo_env.py</code></pre></div>\n<p>脚本里的数据路径是 <code>../data/xxx.jsonl</code>，所以<strong>必须先进到 <code>code/</code> 目录</strong>再执行；在仓库根目录跑会报文件不存在。</p>\n<h3 id=\"s12-h2\">12.2 用 tmux 防断线</h3>\n<p>网页终端一断，前台进程就死。所有超过 5 分钟的任务都这样开：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">tmux new -s train          # 新建会话\npython train_grpo.py       # 在里面跑\n# Ctrl+B 然后 D 脱离；下次 tmux attach -t train 回到现场</code></pre></div>\n<p>临时任务用 <code>nohup python train_grpo.py &gt; log.txt 2&gt;&amp;1 &amp;</code> 也行。</p>\n<h3 id=\"s12-h3\">12.3 双卡（⑤ Harness）</h3>\n<p>开两个 tmux 窗口：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 窗口 1：vLLM 生成服务，占 0 号卡\nCUDA_VISIBLE_DEVICES=0 VLLM_SERVER_DEV_MODE=1 \\\nvllm serve Qwen/Qwen3-0.6B \\\n  --max-model-len 4096 \\\n  --logprobs-mode processed_logprobs \\\n  --weight-transfer-config '{\"backend\":\"nccl\"}'</code></pre></div>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\"># 窗口 2：训练，占 1 号卡\ncd 05-Harness与规模化/code\nCUDA_VISIBLE_DEVICES=1 accelerate launch train_async_grpo.py</code></pre></div>\n<p>脚本里的 <code>vllm_server_url</code> 默认就是 <code>http://localhost:8000</code>（见 <code>train_async_grpo.py</code> 顶部注释），换成别的端口要同步改。</p>"
   },
   {
    "id": "s13",
    "title": "13. 云上四个坑",
    "short": "云上四个坑",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>现象</th><th>原因</th><th>处理</th></tr></thead><tbody><tr><td>下载模型 <code>ConnectionError</code> / <code>Timeout</code></td><td>没设 <code>HF_ENDPOINT</code>，或设了但没重开终端</td><td><code>export HF_ENDPOINT=https://hf-mirror.com</code>，写进 <code>~/.bashrc</code></td></tr><tr><td>第 5 步 NCCL 初始化卡住或报 P2P 错</td><td>消费级 4090 走 PCIe，没有 NVLink/P2P</td><td>能跑但慢：把 <code>weight_sync_steps</code> 调大（少同步几次）；实在不行换 A100/A800</td></tr><tr><td><code>openenv</code> / Harbor 连不上沙箱</td><td>e2b、Daytona 要注册并绑卡</td><td>学习阶段先用 <code>sandbox=None</code> + 本地 Docker，只保留\"完整 agent 循环\"这一点</td></tr><tr><td>磁盘写满，训练中途报 <code>No space left</code></td><td>系统盘 30G，模型 + checkpoint 一下就满</td><td><code>HF_HOME</code> 指到数据盘；<code>save_strategy</code> 别用 <code>steps</code> 高频存</td></tr></tbody></table></div>\n<p>排错时先看这三条：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">df -h                                  # 磁盘\nnvidia-smi                             # 显存有没有被别人占、是不是掉卡\ntail -f log.txt                        # 有没有 HF_ENDPOINT 相关的报错</code></pre></div>"
   },
   {
    "id": "s14",
    "title": "14. 花多少钱",
    "short": "花多少钱",
    "html": "<p>按上面的价格，一个人完整走一遍的账单大概是这样：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>阶段</th><th>机器</th><th>时长</th><th>费用</th></tr></thead><tbody><tr><td>①～④ 跑通示例（本仓库的小数据）</td><td>1×4090</td><td>1–2 小时</td><td>¥3–5</td></tr><tr><td>①～④ 换成自己的真数据（几千条）</td><td>1×4090</td><td>6–10 小时</td><td>¥15–25</td></tr><tr><td>⑤ 双卡跑 0.6B/1.7B，摸通异步流程</td><td>2×4090</td><td>6–8 小时</td><td>¥25–35</td></tr><tr><td>⑤ 双卡 A100 + 4B 模型</td><td>2×A100</td><td>1 天</td><td>¥250–400</td></tr></tbody></table></div>\n<p>省钱的四个习惯：</p>\n<ol><li><strong>先小后大</strong>：先用示例数据确认脚本能跑通，再换真数据；别一上来就全量数据集。</li><li><strong>随时存 checkpoint</strong>：<code>save_strategy=\"epoch\"</code> + 手动 <code>trainer.save_model()</code>，机器被回收也不白跑。</li><li><strong>用完就关</strong>：按量计费关机不再收 GPU 费（只收少量存储费），别让它空转一夜。</li><li><strong>模型选小的</strong>：<code>Qwen3-0.6B</code> 和 <code>Qwen2.5-0.5B</code> 足以看清 loss、奖励、<code>mean_token_accuracy</code> 的变化趋势；4B 只在你想验证\"规模化后行为是否还一致\"时再上。</li></ol>"
   },
   {
    "id": "s15",
    "title": "15. 上线前检查清单",
    "short": "上线前检查清单",
    "html": "<ul><li class=\"task\"><code>nvidia-smi</code> 能看到卡，显存 ≥ 24GB（双卡时两张都在）</li><li class=\"task\"><code>HF_ENDPOINT</code> 已设且在 <code>~/.bashrc</code> 里</li><li class=\"task\"><code>HF_HOME</code> 指向数据盘，<code>df -h</code> 剩余 ≥ 50GB</li><li class=\"task\"><code>trl</code>、<code>transformers</code> 版本符合（第 4 步要 <code>transformers&gt;=5.2.0</code>）</li><li class=\"task\">在 <code>code/</code> 目录里能读到 <code>../data/*.jsonl</code></li><li class=\"task\">长任务都在 <code>tmux</code> 里</li><li class=\"task\">知道 checkpoint 会存在哪、怎么拉回本地（<code>scp -r root@&lt;ip&gt;:/path/ckpt .</code>）</li><li class=\"task\">知道这次跑完大概花多少钱、什么时候该关机</li></ul>"
   }
  ]
 },
 {
  "id": "ch2",
  "num": "01",
  "title": "01 · 监督微调 SFT",
  "heading": "01 · 监督微调（SFT）",
  "subtitle": "把正确轨迹背下来",
  "sections": [
   {
    "id": "s1",
    "title": "1. 一句话定义",
    "short": "一句话定义",
    "html": "<p><strong>把\"一个更强的模型是怎样一步步解决任务\"的完整录像，当成标准答案让它背下来。</strong></p>\n<p>这是整条后训练流水线的<strong>第 1 步</strong>，也是后面所有步骤的地基：没有 SFT，模型连\"工具调用\"的格式都不会写，RL 阶段根本无从采样。</p>"
   },
   {
    "id": "s2",
    "title": "2. 原文译文 · 1. Supervised fine-tuning (SFT)",
    "short": "原文译文 · 1. Supervised fine-tuning (SFT)",
    "html": "<blockquote><p>模型学会复制 <strong>agent 轨迹</strong>——也就是 agent 解决一个任务的过程记录，其中包含每一次工具调用及其结果，通常由更强的模型产生。这一步便宜且稳定。</p>\n<p>模型只会见到<strong>正确的</strong>轨迹，永远见不到它自己的尝试。当它在解题过程中犯了错，它并没有学过如何从错误中恢复。<strong>On-policy 蒸馏</strong>和 <strong>RL</strong> 通过在模型自己的输出上训练来解决这个问题。</p></blockquote>\n<h3 id=\"s2-h1\">原文推荐资源</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>Watch</td><td><a href=\"https://www.youtube.com/watch?v=rNgUoH7Wbv8\" target=\"_blank\" rel=\"noopener\">Training Agents 1: fine-tune a coding agent</a>（<a href=\"https://huggingface.co/burtenshaw/gemma4-pi-mono-youtube-livestream-1-scripts\" target=\"_blank\" rel=\"noopener\">代码</a>）</td></tr><tr><td>Read</td><td><a href=\"https://x.com/ben_burtenshaw/status/2067615361428545566\" target=\"_blank\" rel=\"noopener\">Training Agents: Class 1, SFT from scratch</a></td></tr><tr><td>Docs</td><td><a href=\"https://huggingface.co/docs/trl/sft_trainer\" target=\"_blank\" rel=\"noopener\">SFT Trainer</a></td></tr></tbody></table></div>"
   },
   {
    "id": "s3",
    "title": "3. 训练信号从哪来",
    "short": "训练信号从哪来",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>环节</th><th>内容</th></tr></thead><tbody><tr><td><strong>输入</strong></td><td><code>(system prompt + 工具列表 + 用户任务 + 完整正确轨迹)</code></td></tr><tr><td><strong>模型产出</strong></td><td>每个位置的下一个 token 分布</td></tr><tr><td><strong>监督信号</strong></td><td>数据里那一个<strong>确定的 token</strong>（硬标签，one-hot）</td></tr><tr><td><strong>损失</strong></td><td>只在 assistant 的 token 上算的交叉熵：<code>-Σ log p(y_t)</code></td></tr><tr><td><strong>产物</strong></td><td>一个会模仿该轨迹（格式、顺序、风格）的模型</td></tr></tbody></table></div>\n<div class=\"codewrap\"><pre><code>数据：   \"先 read_file → 看到 bug → write_file → run_tests → 通过\"\n                    │\n                    ▼\n训练：   强制模型在每个位置都预测出数据里的那个 token\n                    │\n                    ▼\n效果：   模型学会「这个任务该按这个顺序、用这些工具、这样写参数」\n         但没学会「如果我刚才猜错了怎么办」（因为数据里从没有错误）</code></pre></div>"
   },
   {
    "id": "s4",
    "title": "4. 数据格式：一条 agent 轨迹长什么样",
    "short": "数据格式：一条 agent 轨迹长什么样",
    "html": "<h3 id=\"s4-h1\">4.1 SFTTrainer 支持的 4 种数据集格式</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>格式</th><th>列</th><th>适用</th></tr></thead><tbody><tr><td>标准 LM</td><td><code>text</code></td><td>纯文本续写</td></tr><tr><td>对话 LM</td><td><code>messages</code></td><td><strong>agent 轨迹就用这个</strong>（角色 + 工具调用都在里面）</td></tr><tr><td>标准 prompt-completion</td><td><code>prompt</code>, <code>completion</code></td><td>单轮问答</td></tr><tr><td>对话 prompt-completion</td><td><code>prompt</code>(messages), <code>completion</code>(messages)</td><td>单轮、要求只对 completion 算 loss</td></tr></tbody></table></div>\n<blockquote><p>agent 轨迹必须用 <strong>对话格式 + <code>tools</code> 列</strong>，因为一条轨迹里有多轮 assistant/tool 交替，单一 <code>completion</code> 表达不了。</p></blockquote>\n<h3 id=\"s4-h2\">4.2 逐字段说明（对话格式）</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>字段</th><th>类型</th><th>含义</th><th>注意</th></tr></thead><tbody><tr><td><code>messages</code></td><td><code>list[dict]</code></td><td>完整对话</td><td>每项 <code>{\"role\": ..., \"content\": ...}</code></td></tr><tr><td><code>messages[].role</code></td><td><code>system</code> / <code>user</code> / <code>assistant</code> / <code>tool</code></td><td>谁在说话</td><td><code>tool</code> 消息带上 <code>name</code> 便于自己溯源（Qwen3 模板不读它）</td></tr><tr><td><code>messages[].content</code></td><td><code>str</code></td><td>文本</td><td>assistant 只调工具时可以写 <code>\"\"</code></td></tr><tr><td><code>messages[].tool_calls</code></td><td><code>list[dict]</code></td><td>assistant 发起的工具调用</td><td><code>{\"type\":\"function\",\"function\":{\"name\",\"arguments\"}}</code></td></tr><tr><td><code>messages[].name</code></td><td><code>str</code></td><td>工具名</td><td>仅 <code>role=\"tool\"</code> 时用</td></tr><tr><td><code>tools</code></td><td><code>list[dict]</code></td><td><strong>工具 schema 列表</strong></td><td>会被渲染进 <strong>system</strong> 消息，告诉模型有哪些工具</td></tr></tbody></table></div>\n<h3 id=\"s4-h3\">4.3 真实示例：<code>data/sft_agent_trace.jsonl</code>（第 1 行，节选）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-json\">{\n  \"tools\": [\n    {\"type\": \"function\", \"function\": {\n      \"name\": \"read_file\",\n      \"description\": \"读取仓库中某个文件的完整内容。\",\n      \"parameters\": {\"type\": \"object\",\n                     \"properties\": {\"path\": {\"type\": \"string\"}},\n                     \"required\": [\"path\"]}}}\n  ],\n  \"messages\": [\n    {\"role\": \"system\", \"content\": \"你是一个编程 agent。你可以读文件、写文件、跑测试……\"},\n    {\"role\": \"user\",   \"content\": \"calculator.py 里的测试失败了，请修好它。\"},\n    {\"role\": \"assistant\", \"content\": \"先看代码和测试。\",\n     \"tool_calls\": [{\"type\": \"function\", \"function\": {\n        \"name\": \"read_file\", \"arguments\": {\"path\": \"calculator.py\"}}}]},\n    {\"role\": \"tool\", \"name\": \"read_file\",\n     \"content\": \"def divide(a, b):\\n    return a / b\\n\"},\n    {\"role\": \"assistant\", \"content\": \"\", \"tool_calls\": [\n        {\"type\": \"function\", \"function\": {\"name\": \"read_file\",\n                                          \"arguments\": {\"path\": \"test_calculator.py\"}}}]},\n    {\"role\": \"tool\", \"name\": \"read_file\", \"content\": \"from calculator import divide\\n...\"},\n    {\"role\": \"assistant\", \"content\": \"除零没有抛 ValueError，改掉。\", \"tool_calls\": [\n        {\"type\": \"function\", \"function\": {\"name\": \"write_file\",\n          \"arguments\": {\"path\": \"calculator.py\", \"content\": \"def divide(a, b):\\n    ...\"}}}]},\n    {\"role\": \"tool\", \"name\": \"write_file\", \"content\": \"written 96 bytes to calculator.py\"},\n    {\"role\": \"assistant\", \"content\": \"\", \"tool_calls\": [\n        {\"type\": \"function\", \"function\": {\"name\": \"run_tests\", \"arguments\": {}}}]},\n    {\"role\": \"tool\", \"name\": \"run_tests\", \"content\": \"2 passed in 0.31s\"},\n    {\"role\": \"assistant\", \"content\": \"在 divide 中增加了除零检查，两个测试都通过了。\"}\n  ]\n}</code></pre></div>\n<blockquote><p>一行 JSONL = 一条完整 episode。assistant 有两类消息：<strong>带 <code>tool_calls</code> 的</strong>（决定下一步动作）和<strong>纯文本的</strong>（总结、推理），两种都要出现在数据里。</p></blockquote>\n<h3 id=\"s4-h4\">4.4 用代码生成 <code>tools</code> 列（避免手写 schema 出错）</h3>\n<div class=\"codewrap\"><pre><code class=\"lang-python\">from transformers.utils import get_json_schema\n\ndef read_file(path: str) -&gt; str:\n    \"\"\"读取仓库中某个文件的完整内容。\n\n    Args:\n        path: 相对仓库根目录的文件路径。\n    \"\"\"\n    ...\n\ntools = [{\"type\": \"function\", \"function\": get_json_schema(read_file)}]</code></pre></div>"
   },
   {
    "id": "s5",
    "title": "5. 全链路实拍：一条轨迹进模型前，变四次形",
    "short": "全链路实拍：一条轨迹进模型前，变四次形",
    "html": "<div class=\"codewrap\"><pre><code>JSONL 记录 ──chat template──► 一段纯文本 ──tokenizer──► token id 序列\n    ──打掩码──► labels（学的保留 id，不学的 -100）──collate──► batch 张量 ──► loss</code></pre></div>\n<p>下面就按这个顺序，把 <code>python train_sft.py --inspect</code> 的真实输出贴出来（模型 <code>Qwen/Qwen3-0.6B</code>，数据 <code>data/sft_agent_trace.jsonl</code> 第 1 条）。<strong>这些数字都可以在你自己机器上复现。</strong></p>\n<h3 id=\"s5-h1\">5.1 阶段 1：读 JSONL</h3>\n<div class=\"codewrap\"><pre><code>  文件：.../01-监督微调-SFT/data/sft_agent_trace.jsonl\n  行数：2\n\n   #  role         content 长度  tool_calls\n  --------------------------------------------------------------\n   0  system               46  -\n   1  user                 52  -\n   2  assistant             8  read_file\n   3  tool                 35  -\n   4  assistant             0  read_file\n   5  tool                223  -\n   6  assistant            20  write_file\n   7  tool                 33  -\n   8  assistant             0  run_tests\n   9  tool                 17  -\n  10  assistant            49  -\n\n  第 1 条记录的 tools 列（渲染进 system 消息里的函数签名）：\n    - read_file(path)     # 读取仓库中某个文件的完整内容。\n    - write_file(path, content)  # 把内容写入仓库中的文件，覆盖原内容。\n    - run_tests()         # 运行仓库的 pytest 测试套件。</code></pre></div>\n<p>看出结构了：<strong>user 只出现 1 次，assistant 出现 5 次</strong>——中间 4 次是\"调工具\"，最后 1 次是\"给结论\"。</p>\n<h3 id=\"s5-h2\">5.2 阶段 2：套 chat template（JSON → 纯文本）</h3>\n<p><code>tokenizer.apply_chat_template(messages, tools=...)</code> 渲染出 <strong>2447 个字符</strong>。原样打印（<code>▸</code> 是脚本加的标记，表示模板插入的角色分隔符）：</p>\n<div class=\"codewrap\"><pre><code>▸ &lt;|im_start|&gt;system\n  你是一个编程 agent。你可以读文件、写文件、跑测试。修好失败的测试后，用一句话总结改动。\n\n  # Tools\n\n  You may call one or more functions to assist with the user query.\n\n  You are provided with function signatures within &lt;tools&gt;&lt;/tools&gt; XML tags:\n  &lt;tools&gt;\n  {\"type\": \"function\", \"function\": {\"name\": \"read_file\", \"description\": \"读取仓库中某个文件的完整内容。\", \"parameters\": {...}}}\n  {\"type\": \"function\", \"function\": {\"name\": \"write_file\", \"description\": \"把内容写入仓库中的文件，覆盖原内容。\", \"parameters\": {...}}}\n  {\"type\": \"function\", \"function\": {\"name\": \"run_tests\", \"description\": \"运行仓库的 pytest 测试套件。\", \"parameters\": {\"type\": \"object\", \"properties\": {}}}}\n  &lt;/tools&gt;\n\n  For each function call, return a json object with function name and arguments within &lt;tool_call&gt;&lt;/tool_call&gt; XML tags:\n  &lt;tool_call&gt;\n  {\"name\": &lt;function-name&gt;, \"arguments\": &lt;args-json-object&gt;}\n  &lt;/tool_call&gt;&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;user\n  calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;assistant\n  先看代码和测试。\n  &lt;tool_call&gt;\n  {\"name\": \"read_file\", \"arguments\": {\"path\": \"calculator.py\"}}\n  &lt;/tool_call&gt;&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;user            ← 注意！工具结果在 Qwen3 模板里是 user 轮\n  &lt;tool_response&gt;\n  def divide(a, b):\n      return a / b\n\n  &lt;/tool_response&gt;&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;assistant\n  &lt;tool_call&gt;\n  {\"name\": \"read_file\", \"arguments\": {\"path\": \"test_calculator.py\"}}\n  &lt;/tool_call&gt;&lt;|im_end|&gt;\n  ...\n▸ &lt;|im_start|&gt;assistant\n  &lt;think&gt;\n\n  &lt;/think&gt;\n\n  在 divide 中增加了除零检查，b == 0 时抛出 ValueError，两个测试都通过了。&lt;|im_end|&gt;</code></pre></div>\n<p>这里有 <strong>四个必须亲眼看到</strong>的事实，每一个都会影响训练结果：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>事实</th><th>后果</th></tr></thead><tbody><tr><td class=\"num\">1</td><td><code>tools</code> 不是单独一段，是被塞进 <strong>system 消息</strong>（<code># Tools</code> + <code>&lt;tools&gt;</code> JSON + 一段调用格式说明）</td><td>换模型就得换写法；工具描述写得含糊，模型就选错工具</td></tr><tr><td class=\"num\">2</td><td><code>role=\"tool\"</code> 被渲染成 <strong><code>&lt;|im_start|&gt;user</code> + <code>&lt;tool_response&gt;…&lt;/tool_response&gt;</code></strong>，不是 <code>&lt;|im_start|&gt;tool</code></td><td>想靠\"只学 user 轮之后\"来打掩码会错；工具结果天然属于\"上下文\"</td></tr><tr><td class=\"num\">3</td><td>assistant 的 <code>tool_calls</code> 被渲染成 <code>&lt;tool_call&gt;{\"name\":…,\"arguments\":…}&lt;/tool_call&gt;</code>，<strong>参数是 JSON</strong></td><td>训练数据里 <code>arguments</code> 必须是 dict（或合法 JSON 串），写成 Python <code>repr</code> 就学成单引号</td></tr><tr><td class=\"num\">4</td><td>最后一条 assistant 前面被插了 <strong>空的 <code>&lt;think&gt;\\n\\n&lt;/think&gt;</code></strong></td><td>Qwen3 的\"非思考模式\"就是用空 think 块表示；训练数据保持一致即可，别指望它凭空学会思考</td></tr></tbody></table></div>\n<h3 id=\"s5-h3\">5.3 阶段 3：tokenize → 打掩码 → labels</h3>\n<p>把上面的文本切成 token，共 <strong>650 个</strong>。然后回答一个问题：<strong>这 650 个 token，哪些该学？</strong></p>\n<div class=\"codewrap\"><pre><code>  已给模板打 generation 补丁\n  总 token：650    需要学的 token：166（25.5%）\n\n  掩码条（█ = 要学，· = 不学，每行 100 个 token）：\n       0 ····································································································\n     100 ····································································································\n     200 ····································································································\n     300 ··············································████████████████████████████··················\n     400 ·····████████████████████████··································································█████\n     500 ██████████████████████████████████████████████████████████████····················█████████████████·\n     600 ····················██████████████████████████████</code></pre></div>\n<p><strong>为什么前面 300 多个 token 全是 <code>·</code>？</strong> 因为那是 system + 工具 schema + 用户提问——全是\"给定上下文\"，让模型去预测它们只会教它复述用户。</p>\n<p>掩码翻转的精确位置（表里第 1 列是下标，第 3 列是 label）：</p>\n<div class=\"codewrap\"><pre><code>   idx  token_id     label  学   token\n  ----------------------------------------------------------\n   348      1773      -100  ·   。\n   349    151645      -100  ·   &lt;|im_end|&gt;\n   350       198      -100  ·   \\n\n   351    151644      -100  ·   &lt;|im_start|&gt;     ← assistant 的角色头，不算\n   352     77091      -100  ·   assistant       ← 同上\n   353       198      -100  ·   \\n              ← 同上\n   354     60726     60726  █   先              ← 从这里开始学\n   355     50930     50930  █   看\n   356     46100     46100  █   代码\n   357     33108     33108  █   和\n   358     81705     81705  █   测试\n   359      8997      8997  █   。\\n\n   360    151657    151657  █   &lt;tool_call&gt;     ← 工具调用的结构也要学\n   361       198       198  █   \\n\n   362      4913      4913  █   {\"\n   363       606       606  █   name\n   ...\n   647      1773      1773  █   。\n   648    151645    151645  █   &lt;|im_end|&gt;     ← 学会停下来\n   649       198       198  █   \\n</code></pre></div>\n<p>三条规则：</p>\n<ol><li><strong>system / user / 工具 schema / <code>tool_response</code> → <code>-100</code></strong>，不算 loss。</li><li><strong>assistant 轮的全部 token → 保留原 id</strong>，包括 <code>&lt;tool_call&gt;</code> 结构、参数 JSON、结尾的 <code>&lt;|im_end|&gt;</code>。</li><li><strong>padding 也必须是 <code>-100</code></strong>，否则模型会去学\"怎么补空格\"。</li></ol>\n<blockquote><p>「哪些 token 是 assistant 的」这件事，transformers 靠模板里的 <code>{% generation %}…{% endgeneration %}</code> 标记来判断。 Qwen3 的模板<strong>没有</strong>这对标记——直接调 <code>return_assistant_tokens_mask=True</code> 会得到<strong>全 0 的掩码</strong>（外加一条 warning）。 TRL 的 <code>assistant_only_loss=True</code> 内部做的就是\"给已知模型家族的模板打补丁\"，脚本里 <code>patch_template()</code> 是同一个动作的最小实现。</p></blockquote>\n<h3 id=\"s5-h4\">5.4 阶段 4：拼成 batch（模型真正看到的东西）</h3>\n<p>两条样本 pad 到同一长度后：</p>\n<div class=\"codewrap\"><pre><code>  样本数：2   序列长度（pad 后）：650\n\n  input_ids         [2, 650]  int64   # pad=151643\n  attention_mask    [2, 650]  int64   # pad 处为 0\n  labels            [2, 650]  int64   # 不学的位置 = -100\n\n  第 1 条样本的头 12 个位置：\n   idx   input_ids      labels  attn\n     0      151644        -100     1\n     1        8948        -100     1      ← system\n     2         198        -100     1\n     3       56568        -100     1      你\n     4      101909        -100     1      是一个\n     ...</code></pre></div>\n<p>模型输出 <code>logits: [2, 650, 151936]</code>，框架内部把 logits 右移一位、按 <code>labels != -100</code> 求平均交叉熵。<strong>也就是说：loss 只由那 166 个位置决定，其余 484 个位置对梯度没有贡献。</strong></p>\n<h3 id=\"s5-h5\">5.5 一句话总结这四次变形</h3>\n<blockquote><p><strong>\"你在数据里写了什么，模型就学什么；你没写的（-100），它一律不学。\"</strong> 想让模型学会\"调用工具后等结果再继续\"，就必须让 <code>tool_call</code> 和它之后的 assistant 续写都落在监督段里。</p></blockquote>"
   },
   {
    "id": "s6",
    "title": "6. 跑起来",
    "short": "跑起来",
    "html": "<p>脚本：<a class=\"il\" href=\"#\"><code>code/train_sft.py</code></a>（约 500 行，四个阶段全部可打印）</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">cd 01-监督微调-SFT/code\n\n# ① 只跑数据链路：不需要 GPU、不需要 trl（只要 transformers），先确认数据没写错\npython train_sft.py --inspect\n\n# ② 完整流程：数据链路 + 训练 + 训练前后对比 + 写报告\npython train_sft.py\n\n# 常用变体\npython train_sft.py --epochs 1 --max-steps 20        # 先冒烟跑通\npython train_sft.py --model Qwen/Qwen3-1.7B          # 换基座\npython train_sft.py --no-eval                        # 跳过生成对比（省时间）</code></pre></div>\n<p>依赖（一次装完）：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">pip install -i https://pypi.tuna.tsinghua.edu.cn/simple \\\n  \"trl&gt;=1.16.0\" transformers datasets accelerate</code></pre></div>\n<div class=\"tablewrap\"><table><thead><tr><th>产物</th><th>内容</th></tr></thead><tbody><tr><td><code>runs/sft/report.md</code></td><td>总报告：环境、loss 表、ASCII 损失图、训练前后对比</td></tr><tr><td><code>runs/sft/tokens.txt</code></td><td>全量 650 行 token / label / mask 表</td></tr><tr><td><code>runs/sft/loss.csv</code></td><td>每步 loss，可拿去画图</td></tr><tr><td><code>ckpt/sft-agent/</code></td><td>训练好的权重，下一章/下一章 RL 的起点</td></tr></tbody></table></div>\n<h3 id=\"s6-h1\">6.1 训练时终端长这样</h3>\n<p><code>--inspect</code> 之后进入训练，每个 logging 步打印一行（<code>logging_steps=1</code>）：</p>\n<div class=\"codewrap\"><pre><code>  模型：Qwen/Qwen3-0.6B   参数量：596M\n  device：cuda:0   bf16：True\n\n  step   1  loss 2.1743  lr 3.3e-07  grad 4.512  token_acc 0.412\n  step   2  loss 1.9806  lr 6.7e-07  grad 3.221  token_acc 0.488\n  step   3  loss 1.8122  lr 1.0e-06  grad 2.884  token_acc 0.531\n  ...</code></pre></div>\n<p>&lt;!-- 待回填：把 report.md 里真实的 loss 表 / 损失图贴到这里 --&gt;</p>\n<p>训练的每一行都要看三件事：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>信号</th><th>健康</th><th>不健康</th></tr></thead><tbody><tr><td><code>loss</code></td><td>单调下降后趋稳</td><td>抖动剧烈 → lr 太大；不降 → 掩码错了（全是 -100）</td></tr><tr><td><code>token_acc</code></td><td>稳步升（0.4 → 0.8+）</td><td>停在 0.3 附近 → 数据太少/太难</td></tr><tr><td><code>grad</code></td><td>平稳（0.1–5）</td><td>尖峰 &gt;20 → 梯度爆炸，开 <code>max_grad_norm</code> 或降 lr</td></tr></tbody></table></div>\n<h3 id=\"s6-h2\">6.2 损失图（终端里也能看）</h3>\n<p><code>report.md</code> 里会附一张 ASCII 走势图，不装 matplotlib 也能判断\"到底在不在学\"：</p>\n<div class=\"codewrap\"><pre><code>  loss 走势 (min 0.412 / max 2.174)\n   2.174 |●\n   1.881 | ●\n   1.587 |  ●\n   1.294 |   ●●\n   1.000 |     ●●\n   0.706 |       ●●\n   0.412 |         ●●●\n         +----------------------------------------------\n          step 1 → 36</code></pre></div>\n<p>&lt;!-- 待回填：真实损失图 --&gt;</p>\n<h3 id=\"s6-h3\">6.3 训练前后对比</h3>\n<p>同一批 prompt，训练前（基座）和训练后（SFT 完）各生成一次：</p>\n<div class=\"codewrap\"><pre><code>  ── 同一类任务（修 bug） ──\n  prompt（最后一句）：calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。\n  模型输出：\n    ...</code></pre></div>\n<p>&lt;!-- 待回填：report.md 里 before/after 两段原文 --&gt;</p>\n<p>怎么读这段对比：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>看什么</th><th>训练前（基座）</th><th>训练后（SFT）</th></tr></thead><tbody><tr><td>有没有 <code>&lt;tool_call&gt;</code></td><td>一般没有，或写成正文 Markdown</td><td>出现结构化 <code>&lt;tool_call&gt;</code></td></tr><tr><td>参数是不是 JSON</td><td>常是自然语言</td><td><code>{\"path\": \"calculator.py\"}</code></td></tr><tr><td>会不会等工具结果</td><td>不会（没有\"轮\"的概念）</td><td>会先读再改，最后给结论</td></tr><tr><td>会不会停</td><td>继续瞎编</td><td>输出 <code>&lt;|im_end|&gt;</code> 收尾</td></tr></tbody></table></div>\n<blockquote><p>注意：<strong>2 条数据只能验证流水线通不通，不能真的教会能力。</strong> 想看到明显变化，至少 100+ 条同格式轨迹（见 00 章\"数据从哪来\"）。</p></blockquote>"
   },
   {
    "id": "s7",
    "title": "7. 参数速查",
    "short": "参数速查",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>参数</th><th>作用</th><th>建议</th></tr></thead><tbody><tr><td><code>assistant_only_loss</code></td><td>只在 assistant token 上算 loss</td><td>agent 轨迹<strong>必开</strong></td></tr><tr><td><code>packing</code></td><td>多条样本拼进一个序列</td><td>短样本多时开；默认关，方便\"一条轨迹=一条序列\"对照</td></tr><tr><td><code>max_length</code></td><td>单条序列上限</td><td>≥ 最长轨迹；截断会把 assistant 段截没（本脚本 4096）</td></tr><tr><td><code>loss_type=\"dft\"</code></td><td>只用\"模型本来就预测对的 token\"算 loss</td><td>怕过拟合时试</td></tr><tr><td><code>chat_template_path</code></td><td>指定带 <code>{% generation %}</code> 的自定义模板</td><td>模板缺标记、又不想让 TRL 自动改时用</td></tr><tr><td><code>eos_token</code></td><td>终止符</td><td>Qwen2.5 系需设 <code>\"&lt;|im_end|&gt;\"</code></td></tr><tr><td><code>learning_rate</code></td><td>学习率</td><td>全参 1e-5~2e-5；LoRA 1e-4 量级</td></tr></tbody></table></div>\n<h3 id=\"s7-h1\">自己改 chat template 的话</h3>\n<p>在 Jinja 里把 assistant 那段包起来即可：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-jinja\">{%- elif message.role == \"assistant\" %}{%- generation %}\n    ...（角色头、内容、tool_calls、&lt;|im_end|&gt;）...\n{%- endgeneration %}{%- elif message.role == \"tool\" %}</code></pre></div>\n<p>（真实模板还要处理 <code>tools</code> 列表与 <code>tool_calls</code> 渲染，建议就在 Qwen3 模板上改这两处，脚本里的 <code>patch_template()</code> 就是这么干的。）</p>"
   },
   {
    "id": "s8",
    "title": "8. 产物与验收",
    "short": "产物与验收",
    "html": "<h3 id=\"s8-h1\">8.1 训练日志里看什么</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>指标</th><th>含义</th><th>健康表现</th></tr></thead><tbody><tr><td><code>loss</code></td><td>只覆盖 assistant token 的交叉熵</td><td>稳定下降；0.3~1.0 区间常见</td></tr><tr><td><code>mean_token_accuracy</code></td><td>模型 top-1 猜中的比例</td><td>随 loss 上升（60%→85%+）</td></tr><tr><td><code>entropy</code></td><td>输出分布熵</td><td>缓降；掉到 0 附近=过拟合/塌缩</td></tr><tr><td><code>num_tokens</code></td><td>累计训练 token 数</td><td>用来估\"每个 epoch 实际学了多少\"</td></tr><tr><td><code>grad_norm</code></td><td>梯度范数</td><td>别持续爆炸（&gt;10）</td></tr></tbody></table></div>\n<h3 id=\"s8-h2\">8.2 离线自测（比 loss 更可信）</h3>\n<div class=\"codewrap\"><pre><code>□ 格式：会不会正确输出 tool_call 结构（而不是把 JSON 写进正文）\n□ 顺序：会不会先读再改（而不是直接 write_file 瞎猜内容）\n□ 停止：会不会在该结束时输出终止符，而不是无限调用工具</code></pre></div>\n<h3 id=\"s8-h3\">8.3 产物</h3>\n<ul><li><code>ckpt/sft-agent/</code>：可继续做蒸馏 / RL 的<strong>起点模型</strong></li><li><code>runs/sft/report.md</code>：这次训练的证据（loss、前后对比），也是排查问题的第一手材料</li></ul>"
   },
   {
    "id": "s9",
    "title": "9. 常见坑",
    "short": "常见坑",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>坑</th><th>症状</th><th>解法</th></tr></thead><tbody><tr><td class=\"num\">1</td><td>没传 <code>tools</code> 列</td><td>模型在正文里写 JSON，而不是结构化 tool_call</td><td>把工具 schema 放进 <code>tools</code> 列</td></tr><tr><td class=\"num\">2</td><td><code>arguments</code> 类型不对</td><td>模板渲染成 Python <code>repr</code>（单引号），解析失败</td><td>统一成 dict 或 JSON 字符串</td></tr><tr><td class=\"num\">3</td><td>模板没有 <code>{% generation %}</code></td><td><code>assistant_masks</code> 全 0，或者 loss 直接 0 / NaN</td><td>用 <code>patch_template()</code> 打补丁，或让 TRL 自动补（<code>assistant_only_loss=True</code>）</td></tr><tr><td class=\"num\">4</td><td>把 <code>tool_response</code> 也算进 loss</td><td>模型开始\"编造工具输出\"</td><td>工具结果的 token 必须 <code>-100</code>（它是 user 轮）</td></tr><tr><td class=\"num\">5</td><td>padding 的 label 没设 <code>-100</code></td><td>loss 虚高、学出一堆空格</td><td>collator 里 pad 的 label 一律 <code>-100</code></td></tr><tr><td class=\"num\">6</td><td><code>max_length</code> 太小</td><td>整条 assistant 被截掉，loss 变 0/NaN</td><td>调大，或过滤超长样本</td></tr><tr><td class=\"num\">7</td><td>忘了 Qwen3 的空 <code>&lt;think&gt;</code> 块</td><td>训完模型先吐一个空 think 再回答——其实正常</td><td>训练数据与推理保持一致即可</td></tr><tr><td class=\"num\">8</td><td>数据只有成功轨迹</td><td>一遇错就崩（原文明确指出的 SFT 局限）</td><td>这是 SFT 的天花板，靠第 2/3 步解决</td></tr><tr><td class=\"num\">9</td><td>学不会停止</td><td>生成不收敛到 EOS</td><td>确认 <code>&lt;|im_end|&gt;</code> 在监督段内，且每条轨迹都以它结尾</td></tr></tbody></table></div>"
   },

    "id": "s10",
    "title": "10. 练习与自测",
    "short": "练习与自测",
    "html": "<ol><li><strong>看掩码</strong>：跑 <code>python train_sft.py --inspect</code>，打开 <code>runs/sft/tokens.txt</code>，找到第 4 条消息（<code>tool_response</code>）——确认它的每一行都是 <code>0</code>。再找到最后一条 assistant 的 <code>&lt;think&gt;</code>——确认它被监督了。</li><li><strong>改数据</strong>：加第 3 条轨迹，让它<strong>先跑测试看到报错、再读文件</strong>（顺序与现有样例相反），重跑，看掩码条的形状有没有变、模型有没有学到这个顺序。</li><li><strong>对照实验</strong>：把 <code>assistant_only_loss=True</code> 改成 <code>False</code> 再训一次，用同一个 prompt 推理——你应该能直观看到\"复述用户问题\"的现象。</li><li><strong>算比例</strong>：把 <code>--epochs</code> 从 3 改成 1，比较 <code>num_tokens</code> 与 <code>166 × 2 × epoch</code>，确认你真的只学了该学的部分。</li></ol>"

 {
  "id": "ch3",
  "num": "02",
  "title": "02 · 蒸馏",
  "heading": "02 · 蒸馏（Distillation）",
  "subtitle": "用教师的概率当监督",
  "sections": [
   {
    "id": "s1",
    "title": "1. 一句话定义",
    "short": "一句话定义",
    "html": "<p><strong>没有标准答案：学生自己写一版，教师逐 token 告诉它「换了我，每个词该有多大概率」，学生去对齐这个概率分布。</strong></p>\n<p>SFT 给的是<strong>一个</strong>答案（硬标签）；蒸馏给的是<strong>一整张概率表</strong>（软标签）。所以同样的数据量，蒸馏的信号密度高得多。</p>"
   },
   {
    "id": "s2",
    "title": "2. 原文译文 · 2. Distillation",
    "short": "原文译文 · 2. Distillation",
    "html": "<blockquote><p>蒸馏（distillation）用教师的 token 或概率来训练学生模型，而不是用硬标签。因为教师给了每个 token 一个值（或者说一整条分布），每个样本携带的信号比 SFT 更多，所以蒸馏往往需要更少的数据。</p>\n<p>但它有三个代价：学生的上限被教师封住；每一步训练都要额外跑一次教师（更慢、更占显存）；而且必须是 <strong>on-policy</strong> 的——学生自己生成，教师在这些 token 上打分，否则学生在自己会走的路径上收不到纠正。</p></blockquote>\n<h3 id=\"s2-h1\">原文推荐资源</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>链接</th></tr></thead><tbody><tr><td>Watch</td><td><a href=\"https://www.youtube.com/watch?v=GZT_oNQnLV4\" target=\"_blank\" rel=\"noopener\">Training Agents 2: distillation</a>（<a href=\"https://huggingface.co/collections/merve/training-agents-6a47a62b9f09867dccf61e1e\" target=\"_blank\" rel=\"noopener\">代码合集</a>）</td></tr><tr><td>Read</td><td><a href=\"https://huggingface.co/blog/distillation-2026\" target=\"_blank\" rel=\"noopener\">A brief history of distillation in AI</a>、<a href=\"https://huggingface.co/blog/distillation-2026\" target=\"_blank\" rel=\"noopener\">Distillation</a></td></tr><tr><td>Docs</td><td><a href=\"https://huggingface.co/docs/trl/distillation_trainer\" target=\"_blank\" rel=\"noopener\">Distillation Trainer</a></td></tr></tbody></table></div>"
   },
   {
    "id": "s3",
    "title": "3. 三种蒸馏，别混",
    "short": "三种蒸馏，别混",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>类型</th><th>数据从哪来</th><th>监督是什么</th><th>在 TRL 里</th></tr></thead><tbody><tr><td><strong>离线蒸馏</strong></td><td>教师先批量写好答案</td><td>硬标签（token id）</td><td>其实就是 SFT（用教师产的数据）</td></tr><tr><td><strong>On-policy 蒸馏（GKD）</strong></td><td><strong>学生当场生成</strong></td><td>教师在<strong>学生生成的那串 token</strong> 上的完整分布</td><td><code>DistillationTrainer</code></td></tr><tr><td><strong>自蒸馏</strong></td><td>学生生成（教师=同一模型+更多上下文）</td><td>同上</td><td>同为 <code>DistillationTrainer</code>，教师换配置</td></tr></tbody></table></div>\n<p>本教程讲第二种，也是 TRL 实现的那一种（GKD，论文 2306.13649）。</p>"
   },
   {
    "id": "s4",
    "title": "4. 训练信号从哪来",
    "short": "训练信号从哪来",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>环节</th><th>内容</th></tr></thead><tbody><tr><td><strong>输入</strong></td><td>只有 <code>prompt</code>（任务描述）</td></tr><tr><td><strong>学生产出</strong></td><td>自己生成的一条 completion</td></tr><tr><td><strong>教师产出</strong></td><td>在<strong>同一串 token</strong> 上，每个位置的完整词表分布 <code>p_T(·|prefix)</code></td></tr><tr><td><strong>监督信号</strong></td><td>学生分布 <code>p_S</code> 与教师分布 <code>p_T</code> 的<strong>逐 token 散度</strong></td></tr><tr><td><strong>损失</strong></td><td><code>L = β·KL(p_T‖p_M) + (1-β)·KL(p_S‖p_M)</code>，<code>p_M = (1-β)p_S + β·p_T</code></td></tr><tr><td><strong>产物</strong></td><td>分布上贴近教师的模型</td></tr></tbody></table></div>\n<div class=\"codewrap\"><pre><code>        prompt\n          │\n          ├──────────────▶ 学生：自回归生成 completion  y_1..y_T\n          │                        │\n          │                        ├──▶ 学生 forward → p_S(·|y_&lt;t)   [T × V]\n          │                        │\n          └──────────────▶ 教师：对同一串 y 做 forward\n                                   │\n                                   └──▶ 教师 forward → p_T(·|y_&lt;t)   [T × V]\n                                             │\n                                             ▼\n                             逐 token 散度 → 取平均 → loss</code></pre></div>\n<p><strong>关键点</strong>：教师不是\"重新写一遍\"，而是<strong>给学生写的那串 token 打分</strong>。所以师生必须共用一个 tokenizer。</p>"
   },
   {
    "id": "s5",
    "title": "5. 全链路实拍：蒸馏一条样本，发生五件事",
    "short": "全链路实拍：蒸馏一条样本，发生五件事",
    "html": "<div class=\"codewrap\"><pre><code>JSONL（只有 prompt）\n   ──chat template (add_generation_prompt=True)──►  一段以「&lt;|im_start|&gt;assistant\\n」结尾的文本\n   ──tokenize──►  prompt 的 token id\n   ──学生 generate──►  completion（on-policy 的那一步）\n   ──学生/教师各 forward 一次──►  每个位置上两张概率表 ──► 散度 ──► loss</code></pre></div>\n<p>下面每段都是 <code>python train_distill.py --inspect</code> / <code>python train_distill.py</code> 会打印的内容。</p>\n<blockquote><p><strong>说明</strong>：带具体数字的段落是<strong>预期的示意值</strong>——脚本打印的字段与结构就是这些，数字随模型、采样和卡而变。 你跑完把 <code>runs/distill/report.md</code> 发我，我会把这里全部换成你的实测输出。</p></blockquote>\n<h3 id=\"s5-h1\">5.1 阶段 1：读 JSONL</h3>\n<div class=\"codewrap\"><pre><code>  文件：.../02-蒸馏/data/distill_prompts.jsonl\n  行数：3\n\n  ── 第 1 条  (2 条消息) ──\n    [system] 你是一个编程 agent。你可以读文件、写文件、跑测试。\n    [user] calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。</code></pre></div>\n<p><strong>没有 <code>completion</code>、没有 <code>answer</code>、没有 <code>ground_truth</code>。</strong> 这是蒸馏与 SFT 最根本的区别：</p>\n<div class=\"tablewrap\"><table><thead><tr><th></th><th>SFT</th><th>蒸馏</th></tr></thead><tbody><tr><td>数据里有答案吗</td><td>有（完整正确轨迹）</td><td><strong>没有</strong></td></tr><tr><td>一条数据训练几次</td><td>1 次（同一份答案）</td><td>每次都用新生成的 completion</td></tr><tr><td>数据量需求</td><td>大</td><td>小（prompt 少也能学）</td></tr></tbody></table></div>\n<h3 id=\"s5-h2\">5.2 阶段 2：套模板（结尾留白给模型）</h3>\n<p><code>add_generation_prompt=True</code> 渲染出来是（<code>▸</code> 标出角色分隔符）：</p>\n<div class=\"codewrap\"><pre><code>▸ &lt;|im_start|&gt;system\n  你是一个编程 agent。你可以读文件、写文件、跑测试。&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;user\n  calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。&lt;|im_end|&gt;\n▸ &lt;|im_start|&gt;assistant</code></pre></div>\n<p>注意最后那个 <strong><code>▸ &lt;|im_start|&gt;assistant</code> 后面是空的</strong>——它在等学生往下写。这个\"留白位\"就是模型的起点。</p>\n<blockquote><p>对照 SFT：SFT 的数据里 assistant 后面<strong>已经写满了</strong>；蒸馏的数据里 assistant 后面<strong>是空的</strong>。</p></blockquote>\n<h3 id=\"s5-h3\">5.3 阶段 3：tokenize（只有 prompt）</h3>\n<div class=\"codewrap\"><pre><code>  prompt token 数：58\n\n   idx  token_id  token\n  ----------------------------\n     0    151644  &lt;|im_start|&gt;\n     1      8948  system\n     2       198  \\n\n     3     56568  你\n     ...\n    55    151645  &lt;|im_end|&gt;\n    56    151644  &lt;|im_start|&gt;\n    57     77091  assistant</code></pre></div>\n<p>到这里为止，和 SFT 的输入完全一样。<strong>区别从下一步开始。</strong></p>\n<h3 id=\"s5-h4\">5.4 阶段 4：学生自己生成 completion</h3>\n<div class=\"codewrap\"><pre><code>  学生：Qwen/Qwen2.5-0.5B-Instruct\n  采样：temperature=1.0  max_new_tokens=160\n\n  生成 137 个 token：\n  --------------------------------------------------------------------------\n  先看代码和测试。\n  &lt;tool_call&gt;\n  {\"name\": \"read_file\", \"arguments\": {\"path\": \"calculator.py\"}}\n  &lt;/tool_call&gt;\n  ...\n  --------------------------------------------------------------------------</code></pre></div>\n<p>这段文字<strong>没有标准答案可以对照</strong>：它可能对、可能错、可能中途跑偏。教师不改它，只是告诉它\"换了我，每个位置会怎么分布\"。</p>\n<p>于是训练样本变成 <code>prompt_ids + gen_ids</code>（58 + 137 = 195 个 token），<strong>loss 只算后 137 个位置</strong>——和 SFT 的掩码逻辑一模一样，只不过掩码不是\"数据规定的\"，而是\"学生自己写出来的那段\"。</p>\n<h3 id=\"s5-h5\">5.5 阶段 5：教师 vs 学生，逐 token 比分布</h3>\n<p>两个模型吃同一串 195 个 token，各输出 <code>[195, 151936]</code> 的 logits。取 completion 段的每个位置：</p>\n<div class=\"codewrap\"><pre><code>  i   学生写的词    p_学生   p_教师   教师首选      p_首选\n  --------------------------------------------------------------\n  0   先            0.412    0.637    先            0.637\n  1   看            0.588    0.771    看            0.771\n  2   代码          0.310    0.502    代码          0.502\n  3   和            0.244    0.398    和            0.398\n  ...\n  12  {\"            0.083    0.245    &lt;tool_call&gt;   0.551   ← 分歧最大的地方</code></pre></div>\n<p>最后一行是典型现象：<strong>学生想直接写 JSON，教师想先写 <code>&lt;tool_call&gt;</code> 标签</strong>。这个 token 的分布差会变成一份更大的梯度，把学生往教师那边拽。</p>\n<p>把每个位置的散度平均起来，就是这一步的 loss：</p>\n<div class=\"codewrap\"><pre><code>  平均前向 KL  D_KL(p_T‖p_S) = 0.1832\n  β = 0.5 时的蒸馏损失        = 0.0911</code></pre></div>\n<blockquote><p>训练时 <code>DistillationTrainer</code> 每步都做这件事，且是<strong>分块</strong>算的： 一次性物化 <code>[seq, 151936]</code> 的 float32 是 195×151936×4 ≈ 118MB，序列一长就 OOM， 所以它按 chunk 算 KL，再累加。</p></blockquote>\n<h3 id=\"s5-h6\">5.6 一个训练步里的张量（形状速查）</h3>\n<div class=\"codewrap\"><pre><code>  input_ids       [1, 195]              # prompt(58) + completion(137)\n  completion_mask [1, 195]              # 前 58 个 0，后 137 个 1\n  student_logits  [1, 195, 151936]      # 学生前向\n  teacher_logits  [1, 195, 151936]      # 教师前向（多一份显存）\n  loss            scalar                # 只在 mask=1 的位置上平均</code></pre></div>\n<p><strong>显存账</strong>：比 SFT 多一整个教师的权重 + 一次教师前向的激活。0.5B 学生 + 1.5B 教师，24GB 卡上 <code>max_completion_length=1024</code> 很宽松。</p>"
   },
   {
    "id": "s6",
    "title": "6. 跑起来",
    "short": "跑起来",
    "html": "<p>脚本：<a class=\"il\" href=\"#\"><code>code/train_distill.py</code></a></p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">cd 02-蒸馏/code\n\n# ① 只跑数据链路（只要 tokenizer，不需要 GPU）\npython train_distill.py --inspect\n\n# ② 完整流程：学生生成 → 分布对比 → 训练 → 损失图 → 前后对比 → 写报告\npython train_distill.py\n\n# 常用变体\npython train_distill.py --max-steps 20 --gen-tokens 96   # 冒烟\npython train_distill.py --beta 0.0                       # 前向 KL\npython train_distill.py --temperature 1.5                # 更软的教师分布</code></pre></div>\n<p>依赖：</p>\n<div class=\"codewrap\"><pre><code class=\"lang-bash\">pip install -i https://pypi.tuna.tsinghua.edu.cn/simple \\\n  \"trl&gt;=1.16.0\" transformers datasets accelerate</code></pre></div>\n<div class=\"tablewrap\"><table><thead><tr><th>产物</th><th>内容</th></tr></thead><tbody><tr><td><code>runs/distill/report.md</code></td><td><strong>把这份发我</strong>：分布表、loss 表、损失图、前后对比</td></tr><tr><td><code>runs/distill/tokens.txt</code></td><td>全量 token 表</td></tr><tr><td><code>runs/distill/loss.csv</code></td><td>每步 loss</td></tr><tr><td><code>ckpt/distill-agent/</code></td><td>蒸馏后的学生</td></tr></tbody></table></div>\n<h3 id=\"s6-h1\">6.1 训练时终端长这样</h3>\n<div class=\"codewrap\"><pre><code>  学生参数：494M\n  教师参数：1544M\n\n  step   1  loss 0.4213  lr 3.3e-07  grad 2.881  ent 1.42  len 118  clip 0.00\n  step   2  loss 0.3702  lr 6.7e-07  grad 2.104  ent 1.35  len 124  clip 0.00\n  step   3  loss 0.3511  lr 1.0e-06  grad 1.933  ent 1.31  len 121  clip 0.00</code></pre></div>\n<p>&lt;!-- 待回填：真实 loss 表 + 损失图（跑完把 report.md 发我） --&gt;</p>\n<h3 id=\"s6-h2\">6.2 损失图</h3>\n<div class=\"codewrap\"><pre><code>  loss 走势 (min 0.351 / max 0.421)\n   0.421 |●\n   0.404 | ●\n   0.386 |  ●\n   0.369 |   ●●\n   0.351 |     ●●●\n         +--------------------------------------\n          step 1 → 6</code></pre></div>\n<p>&lt;!-- 待回填：真实损失图 --&gt;</p>\n<h3 id=\"s6-h3\">6.3 训练前后对比</h3>\n<div class=\"codewrap\"><pre><code>  ── 用例 1 ──\n  prompt：calculator.py 里的测试失败了，请修好它。测试文件是 test_calculator.py。\n  蒸馏前（基座学生）：……\n  蒸馏后：……</code></pre></div>\n<p>&lt;!-- 待回填：report.md 里的 before/after 两段 --&gt;</p>\n<p>判断蒸馏有没有起效，不要只看 loss（它永远降不到 0），看这三个：</p>\n<div class=\"tablewrap\"><table><thead><tr><th>看什么</th><th>训练前</th><th>训练后</th></tr></thead><tbody><tr><td>有没有按教师的<strong>结构</strong>写（<code>&lt;tool_call&gt;</code>）</td><td>直接写 JSON / 写自然语言</td><td>出现结构化标签</td></tr><tr><td>会不会<strong>先读再改</strong></td><td>一上来就猜内容</td><td>先 <code>read_file</code></td></tr><tr><td>生成长度</td><td>要么一句话结束、要么跑到上限</td><td>落在合理区间、能正常收尾</td></tr></tbody></table></div>"
   },
   {
    "id": "s7",
    "title": "7. 参数速查",
    "short": "参数速查",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>参数</th><th>作用</th><th>默认</th><th>建议</th></tr></thead><tbody><tr><td><code>beta</code></td><td>散度选择器（见下表）</td><td><code>1.0</code></td><td>先 <code>0.5</code></td></tr><tr><td><code>temperature</code></td><td><strong>同时</strong>给生成与损失用</td><td><code>1.0</code></td><td>1.0~2.0；越高教师分布越软、信息越多也越抖</td></tr><tr><td><code>max_completion_length</code></td><td>学生单条生成上限</td><td><code>512</code></td><td>多轮工具调用要调大；本脚本默认 160</td></tr><tr><td><code>teacher_model</code></td><td>教师</td><td>必填</td><td>比学生大 1 个量级即可</td></tr><tr><td><code>use_vllm</code> / <code>vllm_mode</code></td><td>用 vLLM 生成学生 rollout</td><td><code>False</code> / <code>colocate</code></td><td>规模上来后必开</td></tr><tr><td><code>max_tool_calling_iterations</code></td><td>允许的最多工具轮数</td><td>—</td><td>多轮 agent 时设</td></tr><tr><td><code>remove_unused_columns</code></td><td>是否删掉数据集多余列</td><td><code>False</code></td><td>蒸馏里保持 <code>False</code></td></tr></tbody></table></div>\n<h3 id=\"s7-h1\">β 的三个取值</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>β</th><th>公式</th><th>直觉</th><th>什么时候用</th></tr></thead><tbody><tr><td><code>0.0</code></td><td><code>D_KL[p_T ‖ p_S]</code></td><td><strong>前向 KL</strong>：教师有概率处学生也必须有 → 学生\"铺得开\"</td><td>想保留多样性</td></tr><tr><td><code>1.0</code>（TRL 默认）</td><td><code>D_KL[p_S ‖ p_T]</code></td><td><strong>反向 KL</strong>：学生只学教师最确定的部分 → \"学得尖\"</td><td>想要确定的学生</td></tr><tr><td><code>0.5</code>（脚本默认）</td><td>标准 JSD</td><td>折中、数值稳</td><td>通用首选</td></tr></tbody></table></div>\n<blockquote><p>⚠️ <code>DistillationConfig.beta</code> 和 <code>GRPOConfig.beta</code> <strong>同名但完全不同</strong>： 这里是\"用哪种散度\"，GRPO 里是\"对参考模型的 KL 惩罚系数\"。别抄错。</p></blockquote>\n<blockquote><p>小细节：<code>DistillationConfig</code> 的默认值与 <code>TrainingArguments</code> 不同—— <code>logging_steps=10</code>、<code>gradient_checkpointing=True</code>、未设 <code>fp16</code> 时 <code>bf16=True</code>、<code>lr=1e-6</code>。</p></blockquote>"
   },

    "id": "s8",
    "title": "8. 产物与验收",
    "short": "产物与验收",
    "html": "<h3 id=\"s8-h1\">8.1 日志指标</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>指标</th><th>含义</th><th>健康表现</th></tr></thead><tbody><tr><td><code>loss</code></td><td>散度均值</td><td>下降，但<strong>不会降到 0</strong>（学生追不上教师）</td></tr><tr><td><code>num_tokens</code></td><td>累计 token</td><td>估吞吐</td></tr><tr><td><code>step_time</code></td><td>每步耗时</td><td>明显高于 SFT（多一次教师前向）</td></tr><tr><td><code>completions/mean_length</code></td><td>学生平均生成长度</td><td>别一路顶到上限（说明不会停）</td></tr><tr><td><code>completions/mean_terminated_length</code></td><td>正常以 EOS 结束的平均长度</td><td>与上面接近才健康</td></tr><tr><td><code>completions/clipped_ratio</code></td><td>被截断的比例</td><td>长期 &gt;0.2 就调大 <code>max_completion_length</code></td></tr><tr><td><code>tools/call_frequency</code></td><td>平均每次生成调用几次工具</td><td>从 0 涨起来说明学会了用工具</td></tr><tr><td><code>tools/failure_frequency</code></td><td>工具调用失败率</td><td>应下降</td></tr><tr><td><code>entropy</code></td><td>输出分布熵</td><td>缓降；掉到 0 附近=塌缩</td></tr></tbody></table></div>\n<h3 id=\"s8-h2\">8.2 判断\"蒸馏成功\"的三个问题</h3>\n<ol><li>学生生成的<strong>结构</strong>像教师了吗（<code>&lt;tool_call&gt;</code>、<code>&lt;think&gt;</code>、收尾）？</li><li>同样的 prompt，学生的答案<strong>稳定性</strong>提高了吗（多采几次看方差）？</li><li>学生在<strong>自己容易犯错的那些位置</strong>上，<code>p_教师 - p_学生</code> 缩小了吗？（看 §5.5 那张表前后对比）</li></ol>\n<h3 id=\"s8-h3\">8.3 产物</h3>\n<ul><li><code>ckpt/distill-agent/</code>：可以做 RL 的起点（通常比 SFT 版更\"会写\"）</li><li><code>runs/distill/report.md</code>：这次蒸馏的证据</li></ul>"
   },

    "id": "s9",
    "title": "9. 常见坑",
    "short": "常见坑",
    "html": "<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>坑</th><th>症状</th><th>解法</th></tr></thead><tbody><tr><td class=\"num\">1</td><td>师生 tokenizer 不一致</td><td>蒸馏完全学不动（token 下标错位）</td><td>用同一个 tokenizer / 同一个词表</td></tr><tr><td class=\"num\">2</td><td>把 <code>beta</code> 当成 GRPO 的 KL 系数</td><td>调了没反应，或学生塌缩</td><td>这里 beta 是\"选散度\"，不是惩罚</td></tr><tr><td class=\"num\">3</td><td><code>max_completion_length</code> 太小</td><td><code>clipped_ratio</code> 高，学生学不会收尾</td><td>调大；多轮时要按整 episode 预算</td></tr><tr><td class=\"num\">4</td><td><code>temperature</code> 只调了生成没调损失</td><td>前后不一致，分布对不上</td><td>TRL 里同一个 temperature 两处都用；自己实现时注意</td></tr><tr><td class=\"num\">5</td><td>数据里塞了 <code>completion</code></td><td>被当成普通列忽略，或者报字段错</td><td>蒸馏数据集<strong>只放 prompt</strong></td></tr><tr><td class=\"num\">6</td><td>教师太大、学生太小</td><td>loss 降不下去（容量差太多）</td><td>教师大 1 个量级即可</td></tr><tr><td class=\"num\">7</td><td>以为 loss 到 0 才算成功</td><td>永远等不到</td><td>学生追不上教师是常态，看结构与稳定性</td></tr></tbody></table></div>"
   },

    "id": "s10",
    "title": "10. 练习与自测",
    "short": "练习与自测",
    "html": "<ol><li><strong>看分布</strong>：跑完整流程，找到 §5.5 那张表里 <code>p_教师 - p_学生</code> 最大的 3 个 token。它们是什么？通常是结构符号（<code>&lt;tool_call&gt;</code>、<code>{</code>、换行）——说明学生在\"格式\"上离教师最远。</li><li><strong>换 β</strong>：<code>--beta 0.0</code> 与 <code>--beta 1.0</code> 各训一次（40 步即可），同一个 prompt 采 5 次，比较答案的<strong>多样性</strong>。前向 KL 应该更散。</li><li><strong>换温度</strong>：<code>--temperature 2.0</code>，观察 <code>entropy</code> 与生成质量。温度太高教师分布变平，学生学到的是\"含糊\"。</li><li><strong>数据不加答案</strong>：故意往 JSONL 里加一个 <code>completion</code> 字段，看脚本/TRL 怎么处理——理解\"蒸馏不需要答案\"这件事。</li></ol>"
